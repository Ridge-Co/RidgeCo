# Cloudflare Worker deploy config for the RidgeCo Maintenance Hub.
# Purpose: enable push-to-main auto-deploy via Cloudflare Workers Builds.
# keep_vars = true is CRITICAL — it preserves the environment variables and
# secrets set in the Cloudflare dashboard (GOOGLE_SA_KEY, QB_*, TWILIO_*,
# WORKER_SECRET, SHEET_ID, etc.) so a deploy never wipes them.

name = "maintenance-hub-staging"
main = "worker.js"
compatibility_date = "2026-06-08"
# Required so this Worker can fetch() the str-automation Worker (same account/workers.dev subdomain) for the
# door-code watchdog: without it Cloudflare answers error 1042 (HTTP 404) to any Worker-to-Worker fetch on the
# same zone. Only changes how same-zone fetches are routed (over the public internet); every other outbound
# call (Google, QuickBooks, Twilio, Anthropic ...) is already public and unaffected.
compatibility_flags = ["global_fetch_strictly_public"]
keep_vars = true
workers_dev = true

# ── NO CRON TRIGGERS. EVER. (permanent rule, Brett, Oct 12 2026) ─────────────────────────────────────────
# Cloudflare Cron Triggers are unreliable for this account: it is at its trigger cap, so a new trigger (the
# every-15-minutes sweep) silently never attached and quiet-hours messages, recurring WOs, nudges, the dead-man
# switch etc. just stopped running with no error anywhere. The ONLY clock is the Apps Script scheduler
# (apps-script/hub-scheduler/HubScheduler.gs, one everyMinutes(15) trigger) calling POST /cron/run.
# TO ADD A PERIODIC JOB: add it to SCHED_JOBS in worker.js (the scheduler registry). NEVER add a cron here,
# in GitHub Actions (`schedule:`), or anywhere else.
#
# `crons = []` is deliberate and REQUIRED, not leftover: per Cloudflare's docs, when `crons` is omitted a deploy
# leaves the previously attached Cron Triggers in place, whereas an empty array removes them all. worker.js's
# scheduled() is a loud no-op that alerts if Cloudflare ever fires it anyway.
[triggers]
crons = ["0 11 * * *", "30 12 * * 1", "0 12 * * 3", "0 13 * * 1", "*/15 * * * *"]

# Git auto-deploy connected via Cloudflare Workers Builds (July 19, 2026).

# ── Environment variables & secrets (managed in the Cloudflare dashboard) ──
# These are intentionally NOT given values here: this file is committed to the
# repo, so putting secret values in it would leak them. keep_vars = true above
# preserves whatever is set in the dashboard on every deploy, so they stay in sync.
# Expected bindings (set/verify in Workers & Pages → maintenance-hub → Settings →
# Variables and Secrets):
#   Secrets: WORKER_SECRET, WORKER_SECRET_2 (rotation, temporary), GOOGLE_SA_KEY,
#            GOOGLE_SA_EMAIL, TWILIO_SID, TWILIO_AUTH, ANTHROPIC_API_KEY,
#            GOOGLE_MAPS_KEY, KEY_REGISTRY_SHEET_ID, MAKE_WEBHOOK_URL, QB_* (QuickBooks)
#   Vars:    SHEET_ID, DRIVE_PROPERTIES_ROOT
# Rotation note (2026-07-20): WORKER_SECRET_2 is the new value during the
# zero-downtime swap. Once clients are confirmed on it, set WORKER_SECRET = new
# value, delete WORKER_SECRET_2, and remove the dual-accept branch in worker.js.

# 2026-07-21 EMERGENCY REDEPLOY — restore known-good Worker after a staging build reached production (admin-token gate 403d the live Hub). No functional change.
