<!DOCTYPE html>
<html lang="en">
<head>
<script src="test-login.js"></script>
<script src="failure-reporter.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Inspection — Ridge Co</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --border:#dfe3e8; --text:#1c2430; --muted:#6b7684;
    --accent:#1d4ed8; --accent2:#1a7f4b; --danger:#c0392b; --warn:#b8860b; --chip:#eef2f7;
    --sev-urgent:#c0392b; --sev-high:#d9622b; --sev-medium:#c99a06; --sev-low:#4a7bd0; --sev-info:#8a94a3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  .hide{display:none!important}
  main{padding:12px 12px 90px;max-width:680px;margin:0 auto}
  h1{font-size:20px;margin:6px 0 10px} h2{font-size:17px;margin:14px 0 8px} h3{font-size:15px;margin:10px 0 6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .muted{color:var(--muted);font-size:13px}
  .btn{min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.go{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
  .btn.ghost{background:transparent}
  .btn.sm{min-height:36px;padding:6px 11px;font-size:13px}
  .btn.block{display:block;width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
  .pill.ok{background:#e7f6ec;color:var(--accent2)} .pill.warn{background:#fdf3e0;color:var(--warn)} .pill.bad{background:#fdecea;color:var(--danger)} .pill.new{background:#eaf1fd;color:var(--accent)}
  input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--surface);color:var(--text);font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  label.fld{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
  .seg{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
  .seg button{flex:1 1 0;min-width:72px;min-height:44px;padding:8px 6px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;color:var(--text)}
  .seg button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg button.sel.good{background:var(--accent2);border-color:var(--accent2)} .seg button.sel.poor{background:var(--danger);border-color:var(--danger)} .seg button.sel.fair{background:var(--warn);border-color:var(--warn)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
  .sheet h2{margin:2px 0 10px}
  .toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw}
  .toast.show{opacity:1}
  .banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
  .banner.warn{background:#fdf3e0;border:1px solid #f0d9a8;color:#7a5b12} .banner.err{background:#fdecea;border:1px solid #f1b9b3;color:#8e281d} .banner.ok{background:#e7f6ec;border:1px solid #b5e0c4;color:#14623a} .banner.info{background:#eaf1fd;border:1px solid #bcd0f5;color:#1a3f94}
  #login{max-width:360px;margin:60px auto;padding:20px;text-align:center}
  #syncbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
  #syncbar .st{font-weight:700}
  #syncbar.ok .st{color:var(--accent2)} #syncbar.work .st{color:var(--accent)} #syncbar.off .st{color:var(--warn)} #syncbar.err .st{color:var(--danger)}
  .area-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 4px;border-top:1px solid var(--border);cursor:pointer;min-height:52px}
  .area-row:first-child{border-top:none}
  .area-row.ex{opacity:.5}
  .issue{border-left:5px solid var(--sev-medium);padding:10px 10px 10px 12px;margin:8px 0;background:#fafbfc;border-radius:8px;cursor:pointer}
  .issue.urgent{border-color:var(--sev-urgent)} .issue.high{border-color:var(--sev-high)} .issue.medium{border-color:var(--sev-medium)} .issue.low{border-color:var(--sev-low)} .issue.info{border-color:var(--sev-info)}
  .issue .t{font-weight:700} .issue .f{font-size:13px;color:var(--muted);margin-top:3px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:2px solid var(--border);background:#e9edf2;cursor:pointer;padding:0}
  .thumb.sel{border-color:var(--accent)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .b{position:absolute;right:2px;bottom:2px;font-size:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 5px}
  .mic{width:100%;min-height:60px;font-size:17px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  .mic.live{background:var(--danger);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.75}}
  .step{display:flex;align-items:center;gap:10px}
  .step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
  .step .n{min-width:34px;text-align:center;font-size:20px;font-weight:700}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border);min-height:48px}
  .toggle input{width:26px;height:26px;flex:none}
  .sw{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;border:1px solid var(--border)}
  .propitem{padding:12px 4px;border-top:1px solid var(--border);cursor:pointer;min-height:48px}
  .propitem:first-child{border-top:none}
  .tradehead{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
  .linkbox{word-break:break-all;background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
  .propcard{border:1px solid var(--accent);background:#eaf1fd}
  .thumb.chk{border-color:var(--accent)}
  .thumb.chk::after{content:"✓";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .thumbs.big .thumb{width:104px;height:104px}
  .selbar{position:sticky;top:0;z-index:5;border-color:var(--accent);background:#eaf1fd}
  .mv{display:flex;gap:8px;flex:none}
  .mv button{width:44px;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:18px;font-weight:700;cursor:pointer;color:var(--text)}
  .mv button:disabled{opacity:.3;cursor:not-allowed}
  .mv button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .area-row.rr{cursor:default;user-select:none;-webkit-user-select:none;gap:6px}
  .area-row.rr>span:nth-of-type(1){flex:1;min-width:0}
  .dh{flex:none;width:44px;height:52px;border:none;background:transparent;font-size:26px;line-height:1;color:var(--muted,#6b7684);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:10px}
  .dh:focus-visible{outline:2px solid var(--primary,#1d4ed8);outline-offset:-2px}
  .area-row.shifting{transition:transform .14s ease}
  .area-row.dragging{position:relative;z-index:6;background:var(--surface,#fff);box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:10px;border-top-color:transparent;transition:none;cursor:grabbing}
  body.dragging-rows,body.dragging-rows *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
  .eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .eqgrid .full{grid-column:1 / -1}
  .pill.type{background:#f0eafd;color:#5b3fa8}
  .rt-item{border-top:1px solid var(--border);margin-top:10px;padding-top:8px}
  .quote{font-size:13px;color:var(--muted);font-style:italic;margin:2px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chips .btn{min-height:40px}
  .logo-opt{display:inline-block;width:92px;height:62px;border:2px solid var(--border);border-radius:8px;background:#fff;padding:3px;margin:0 8px 8px 0;cursor:pointer;vertical-align:top}
  .logo-opt img{width:100%;height:100%;object-fit:contain;display:block}
  .logo-opt.sel{border-color:var(--accent)}
  .swatch{display:inline-block;width:40px;height:40px;border-radius:8px;border:2px solid var(--border);margin:0 8px 8px 0;cursor:pointer;vertical-align:top;padding:0}
  .swatch.sel{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}
</style>
</head>
<body>
<div id="rc-navbar" style="background:#1d4ed8;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <a href="index.html" style="color:#fff;text-decoration:none">← Hub</a>
  <span style="margin-left:auto" id="nav-ver">Field Inspection</span>
</div>

<div id="login">
  <h1>Field Inspection</h1>
  <p class="muted">Enter your Hub access code.</p>
  <input id="login-input" type="password" placeholder="Access code" autocomplete="current-password">
  <p id="login-error" class="hide" style="color:var(--danger);font-size:13px">Not recognized — try again.</p>
  <button class="btn primary block" style="margin-top:12px" id="login-btn" onclick="doLogin()">Enter</button>
</div>

<div id="app" class="hide">
  <main id="view"></main>
  <div id="syncbar" class="ok"><span class="st" id="sync-st">Ready</span><span id="sync-act"></span></div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <input type="file" id="photo-in" accept="image/*" multiple class="hide">
  <input type="file" id="logo-in" accept="image/png,image/jpeg,image/webp" class="hide">
  <input type="file" id="audio-in" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.flac,.amr,.3gp" multiple class="hide">
</div>

<script>
var WORKER = 'https://maintenance-hub.brett-2f8.workers.dev';
var SECRET_KEY = 'mh_auth';
var AUTH_TOKEN = '';
var ID_PREFIX = window.__testmode ? 'TEST-' : 'fi_';
var TRADES = [['plumbing','Plumbing'],['electrical','Electrical'],['hvac','HVAC / Heating'],['roofing','Roofing / Gutters'],['structural','Structural'],['carpentry','Carpentry'],['drywall_paint','Drywall / Paint'],['flooring','Flooring'],['windows_doors','Windows / Doors'],['appliances','Appliances'],['pest','Pest'],['safety','Safety'],['exterior_site','Exterior / Site'],['cleaning','Cleaning'],['general','General'],['tenant_action','Tenant action']];
var SEVS = [['urgent','Urgent'],['high','High'],['medium','Medium'],['low','Low'],['info','Note']];
var CONDS = [['good','Good','good'],['fair','Fair','fair'],['poor','Poor','poor'],['nothing_to_do','Nothing to do','']];
var TRADE_LABEL = {}; TRADES.forEach(function(t){ TRADE_LABEL[t[0]] = t[1]; });
var SEV_LABEL = {}; SEVS.forEach(function(t){ SEV_LABEL[t[0]] = t[1]; });
var COND_LABEL = {good:'Good',fair:'Fair',poor:'Poor',nothing_to_do:'Nothing to do',not_inspected:'Not inspected',na:'N/A'};
var INSP_TYPES = [['periodic','Periodic'],['move_in','Move-in'],['move_out','Move-out'],['pre_listing','Pre-listing'],['other','Other']];
// Oct 27 2026: per-area "No access" reasons, neutral access & cooperation quick-picks, animal types
var ACCESS_REASONS = [['','No reason given'],['tenant_declined','Tenant declined access'],['blocked','Area blocked'],['other','Other (describe)']];
var COOP_CHOICES = [['completed','Occupant present; inspection completed as planned'],['not_present','Occupant not present'],['limited','Occupant present; access to some areas was limited'],['ended_early','Occupant asked that the inspection end early']];
var ANIMAL_TYPES = ['Dog','Cat','Bird','Other'];

// ── state ───────────────────────────────────────────────────────────────────
var S = { view:'home', rec:null, areaId:null, list:[], listErr:'', brands:[], reportBase:'https://ridge-co.github.io/RidgeCo', props:[], dir:null, propsErr:'', propQ:'', newProp:null, newOwner:null, ownerQ:'', pickUnitFor:'', unitQ:'', hits:[], ownerHits:{},
  sync:{ state:'idle', msg:'', syncing:false, again:false, timer:null, persistTimer:null, conflict:null, lastErr:'' },
  photoMsg:'', reorder:false, selMode:false, sel:{}, moveIds:[], types:[], typesErr:'', route:null, routeBusy:'', routeErr:'', pumping:false, proposals:null, structuring:false, summarizing:false, listening:false, interim:'', busy:{}, dictErr:'', noIdb:false, publishInfo:null, emailPreview:null, bookings:null, bookErr:'', newBooking:null, newInspId:'', visitOpen:false, rw:'' };
var blobUrl = {};           // photo id -> object URL (local copy)
var photoState = {};        // photo id -> {state, err}
var localOnly = {};         // id -> record for inspections only on this phone

// ── tiny utils ──────────────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id){ return document.getElementById(id); }
function toast(m){ var t=$('toast'); t.textContent=m; t.className='toast show'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.className='toast';},3200); }
function rid(n){ var a=new Uint8Array(n||8); crypto.getRandomValues(a); var s=''; for(var i=0;i<a.length;i++) s+=(a[i]%36).toString(36); return s; }
function newId(){ return ID_PREFIX + rid(12); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ /* private mode: nothing was stored */ } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ /* private mode: preference just isn't remembered */ } }
// Synchronous double-tap guard (claimSubmit pattern): true = you own the action, false = already running.
function claim(key){ if(S.busy[key]) return false; S.busy[key]=true; return true; }
function release(key){ delete S.busy[key]; }
function fpOf(doc){
  var h = 2166136261 >>> 0;
  function feed(s){ for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } }
  (doc.areas||[]).forEach(function(a){ (a.issues||[]).forEach(function(is){ feed([is.id,is.title,is.trade,is.severity,is.recommended_fix||''].join('|')+'\n'); }); });
  return h.toString(36);
}
function api(method, path, body){
  var opts = { method:method, headers:{'X-Auth-Token':AUTH_TOKEN} };
  if (body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  return fetch(WORKER + path, opts).then(function(res){
    return res.text().then(function(txt){
      var data; try{ data = JSON.parse(txt); }catch(e){ var er = new Error('Server returned an unreadable answer (HTTP '+res.status+')'); er.status = res.status; er.code='bad_response'; throw er; }
      if (res.status === 401 || (data && data.error === 'Unauthorized')){ var ue = new Error('Unauthorized'); ue.status=401; ue.code='unauthorized'; throw ue; }
      if (!res.ok || (data && data.ok === false)){ var e2 = new Error((data && (data.message || data.error)) || ('HTTP '+res.status)); e2.status = res.status; e2.code = data && data.error; e2.data = data; throw e2; }
      return data;
    });
  });
}

// ── IndexedDB (offline store). If it is unavailable we say so loudly and keep working in memory. ──
var _db = null, mem = { docs:{}, photos:{} };
function idbOpen(){
  if (_db) return Promise.resolve(_db);
  return new Promise(function(resolve){
    try{
      var rq = indexedDB.open('rc_field_inspect', 1);
      rq.onupgradeneeded = function(){ var d = rq.result; d.createObjectStore('docs',{keyPath:'id'}); var p = d.createObjectStore('photos',{keyPath:'id'}); p.createIndex('insp','insp'); };
      rq.onsuccess = function(){ _db = rq.result; resolve(_db); };
      rq.onerror = function(){ S.noIdb = true; resolve(null); };
      rq.onblocked = function(){ S.noIdb = true; resolve(null); };
    }catch(e){ S.noIdb = true; resolve(null); }
  });
}
function idbDo(store, mode, fn){
  return idbOpen().then(function(db){
    if (!db){ var o0 = fn(null); return (o0 && o0.result !== undefined) ? o0.result : o0; }
    return new Promise(function(resolve, reject){
      var tx = db.transaction(store, mode), st = tx.objectStore(store), out;
      try{ out = fn(st); }catch(e){ reject(e); return; }
      tx.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
      tx.onerror = function(){ reject(tx.error || new Error('Local storage error')); };
      tx.onabort = function(){ reject(tx.error || new Error('Local storage aborted (is the phone out of space?)')); };
    });
  });
}
function dbPut(store, val){ if (_db === null && S.noIdb){ mem[store][val.id] = val; return Promise.resolve(); } return idbDo(store,'readwrite',function(st){ if(!st){ mem[store][val.id]=val; return; } return st.put(val); }); }
function dbGet(store, id){ return idbDo(store,'readonly',function(st){ if(!st) return {result: mem[store][id]}; return st.get(id); }); }
function dbAll(store){ return idbDo(store,'readonly',function(st){ if(!st) return {result: Object.keys(mem[store]).map(function(k){return mem[store][k];})}; return st.getAll(); }); }
function dbDel(store, id){ return idbDo(store,'readwrite',function(st){ if(!st){ delete mem[store][id]; return; } return st.delete(id); }); }

// ── login ───────────────────────────────────────────────────────────────────
function doLogin(){
  var v = $('login-input').value.trim(); AUTH_TOKEN = v;
  api('GET','/fi/list').then(function(d){ lsSet(SECRET_KEY, v); enterApp(d); })
    .catch(function(e){ AUTH_TOKEN=''; var el=$('login-error'); el.textContent = (e.code==='unauthorized') ? 'Not recognized — try again.' : ('Could not reach the server: '+e.message); el.classList.remove('hide'); });
}
$('login-input').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
(function(){
  var stored = lsGet(SECRET_KEY,'');
  if (stored){ AUTH_TOKEN = stored; api('GET','/fi/list').then(enterApp).catch(function(e){ if (e.code==='unauthorized'){ AUTH_TOKEN=''; } else { enterApp(null, e); } }); }
})();
function enterApp(d, err){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  if (d) applyList(d); else { S.listErr = 'Could not load the server list: ' + (err && err.message) + ' — showing what is on this phone.'; }
  idbOpen().then(function(){ return dbAll('docs'); }).then(function(rows){
    (rows||[]).forEach(function(r){ localOnly[r.id] = r; });
    render(); setSync(); pumpPhotos();
  }).catch(function(e){ S.noIdb = true; render(); toast('Phone storage problem: '+e.message); });
  render(); setSync(); loadTypes();
}
function applyList(d){ S.list = d.inspections || []; S.brands = d.brands || []; S.reportBase = d.report_base || S.reportBase; S.listErr=''; }
function refreshList(){ return api('GET','/fi/list').then(function(d){ applyList(d); }).catch(function(e){ S.listErr = 'Could not refresh the server list: '+e.message; }); }

// ── sync engine ─────────────────────────────────────────────────────────────
function setSync(){
  var bar = $('syncbar'), st = $('sync-st'), act = $('sync-act');
  var rec = S.rec, ss = S.sync, np = pendingPhotoCount();
  var cls='ok', txt='', a='';
  if (!rec){ txt = S.noIdb ? '⚠ Phone storage unavailable — keep this page open' : 'Ready'; cls = S.noIdb ? 'err' : 'ok'; }
  else if (ss.conflict){ cls='err'; txt='⚠ Newer version on the server'; a='<button class="btn sm" onclick="showConflict()">Resolve</button>'; }
  else if (ss.state==='error'){ cls='err'; txt='⚠ Not saved to server: '+esc(ss.msg); a='<button class="btn sm" onclick="syncNow(true)">Retry</button>'; }
  else if (!navigator.onLine && rec.dirty){ cls='off'; txt='📴 Offline — saved on this phone'; }
  else if (ss.syncing){ cls='work'; txt='⏳ Saving…'; }
  else if (rec.dirty){ cls='work'; txt='⏳ Changes waiting to save'; }
  else { cls='ok'; txt='✓ Saved to server' + (rec.base_rev ? ' (v'+rec.base_rev+')' : ''); }
  if (np){ txt += ' · 📷 '+np+' photo'+(np>1?'s':'')+' waiting'; if (S.photoMsg){ cls = cls==='ok'?'err':cls; txt += ' ⚠'; a = '<button class="btn sm" onclick="retryPhotos()">Retry photos</button>'; } }
  bar.className = cls; st.innerHTML = txt; act.innerHTML = a;
}
function pendingPhotoCount(){ var n=0; for (var k in photoState){ if (photoState[k].state!=='done') n++; } return n; }
window.addEventListener('online', function(){ if (S.rec) syncNow(true); pumpPhotos(); setSync(); });
window.addEventListener('offline', setSync);
window.addEventListener('beforeunload', function(e){ if ((S.rec && S.rec.dirty) || pendingPhotoCount()){ e.preventDefault(); e.returnValue=''; return ''; } });
function mut(fn){
  var rec = S.rec; if (!rec) return;
  fn(rec.doc); rec.dirty = true; rec.ver = (rec.ver||0)+1; rec.doc.updated = new Date().toISOString();
  clearTimeout(S.sync.persistTimer);
  S.sync.persistTimer = setTimeout(persistLocal, 350);
  scheduleSync(); setSync();
}
function mutMeta(fn){ var rec=S.rec; if(!rec) return; fn(rec.meta); rec.dirty=true; rec.ver=(rec.ver||0)+1; clearTimeout(S.sync.persistTimer); S.sync.persistTimer=setTimeout(persistLocal,350); scheduleSync(); setSync(); }
function persistLocal(){
  var rec = S.rec; if (!rec) return Promise.resolve();
  return dbPut('docs', rec).then(function(){ localOnly[rec.id] = rec; }).catch(function(e){ S.sync.state='error'; S.sync.msg='Could not save on this phone: '+e.message; setSync(); });
}
function scheduleSync(){ clearTimeout(S.sync.timer); S.sync.timer = setTimeout(function(){ syncNow(false); }, 1800); }
function syncNow(manual){
  var rec = S.rec, ss = S.sync; if (!rec) return Promise.resolve();
  clearTimeout(ss.timer);
  if (ss.syncing){ ss.again = true; return Promise.resolve(); }
  if (ss.conflict) return Promise.resolve();
  if (!rec.dirty && !manual && rec.base_rev) return Promise.resolve();
  if (!navigator.onLine){ setSync(); return Promise.resolve(); }
  ss.syncing = true; ss.state='syncing'; setSync();
  var ver = rec.ver, sentDoc = JSON.parse(JSON.stringify(rec.doc)), sentMeta = JSON.parse(JSON.stringify(rec.meta));
  return persistLocal().then(function(){
    return api('POST','/fi/save',{ id:rec.id, base_rev:rec.base_rev||0, doc:sentDoc, meta:sentMeta, force: ss.forceNext===true });
  }).then(function(r){
    ss.forceNext = false;
    rec.base_rev = r.rev; rec.token = r.report_token; rec.status = r.status;
    if (r.unpublished){ toast('Edited after publishing — the public report is hidden until you publish again'); }
    if (rec.ver === ver) rec.dirty = false;
    ss.state='ok'; ss.msg='';
    return persistLocal();
  }).then(function(){
    ss.syncing=false; setSync(); refreshList().then(function(){ if (S.view==='home') render(); }); pumpPhotos();
    if (ss.again || rec.dirty){ ss.again=false; scheduleSync(); }
    if (S.view==='review') safeRender();
  }).catch(function(e){
    ss.syncing=false;
    if (e.code==='stale'){ ss.conflict = { server_rev:(e.data&&e.data.server_rev)||0, at:(e.data&&e.data.server_updated_at)||'' }; ss.state='error'; ss.msg='newer version on server'; setSync(); showConflict(); return; }
    if (e.code==='unauthorized'){ ss.state='error'; ss.msg='Session expired — reload and enter the code again'; setSync(); return; }
    ss.state='error'; ss.msg = e.message || 'unknown error'; setSync();
    if (e.status && e.status>=400 && e.status<500 && e.code!=='bad_response'){ return; } // validation-type error: do not hammer; user sees it + Retry
    clearTimeout(ss.timer); ss.timer = setTimeout(function(){ syncNow(false); }, 15000);
  });
}
function showConflict(){
  var c = S.sync.conflict; if (!c) return;
  openSheet('<h2>Newer version on the server</h2><p>The server has version <b>'+c.server_rev+'</b> of this inspection'+(c.at?' (saved '+esc(c.at.replace('T',' ').slice(0,16))+' UTC)':'')+', but this phone started from version <b>'+(S.rec.base_rev||0)+'</b>. This usually means it was edited on another device. <b>Nothing has been overwritten.</b></p>'
    +'<div class="btns"><button class="btn primary block" id="cf-load" onclick="conflictLoadServer()">Load the server version (discard this phone\'s unsaved changes)</button>'
    +'<button class="btn danger block" id="cf-force" onclick="conflictForce()">Keep this phone\'s version and overwrite the server</button>'
    +'<button class="btn block" onclick="closeSheet()">Decide later</button></div>');
}
function conflictLoadServer(){
  if (!claim('cf')) return; var rec = S.rec;
  api('GET','/fi/inspection?id='+encodeURIComponent(rec.id)).then(function(d){
    rec.doc = d.doc; rec.base_rev = d.inspection.rev; rec.token = d.inspection.report_token; rec.status = d.inspection.status; rec.meta = metaFrom(d.inspection, rec.meta); rec.dirty=false; S.sync.conflict=null; S.sync.state='ok';
    return persistLocal();
  }).then(function(){ release('cf'); closeSheet(); setSync(); render(); toast('Loaded the server version'); }).catch(function(e){ release('cf'); toast('Could not load: '+e.message); });
}
function conflictForce(){ S.sync.conflict=null; S.sync.forceNext=true; closeSheet(); syncNow(true); }
function metaFrom(h, old){ return { brand_id:h.brand_id||(old&&old.brand_id)||'', client_name:h.client_name||'', client_email:h.client_email||'', inspector:h.inspector||'', inspection_date:h.date||'', inspection_type:h.type||'periodic' }; }

// ── photos ──────────────────────────────────────────────────────────────────
function photoSrc(id){
  if (blobUrl[id]) return blobUrl[id];
  if (S.rec && S.rec.token) return WORKER+'/fi/photo/view?r='+encodeURIComponent(S.rec.token)+'&p='+encodeURIComponent(id);
  return '';
}
function loadPhotoBlobs(inspId){
  return dbAll('photos').then(function(rows){
    (rows||[]).forEach(function(p){
      if (p.insp !== inspId) return;
      if (p.blob && !blobUrl[p.id]) blobUrl[p.id] = URL.createObjectURL(p.blob);
    });
  });
}
function allPhotoStates(){
  return dbAll('photos').then(function(rows){
    photoState = {};
    (rows||[]).forEach(function(p){ if (p.state!=='done') photoState[p.id] = { state:p.state, err:p.err||'' }; });
    setSync();
  });
}
function compressImage(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(h*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){ URL.revokeObjectURL(url); if(b) resolve(b); else reject(new Error('Could not compress the photo')); }, 'image/jpeg', 0.82);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('This photo could not be read ('+(file.type||'unknown type')+')')); };
    img.src = url;
  });
}
var photoTarget = null; // {areaId}
function pickPhotos(areaId){ photoTarget = { areaId:areaId }; var inp = $('photo-in'); inp.value=''; inp.click(); }
$('photo-in').addEventListener('change', function(ev){
  var files = Array.prototype.slice.call(ev.target.files||[]); var tg = photoTarget; if (!files.length || !tg || !S.rec) return;
  var rec = S.rec, fails = 0, chain = Promise.resolve();
  files.forEach(function(f){
    chain = chain.then(function(){ return compressImage(f); }).then(function(blob){
      var id = 'ph_' + rid(10);
      var row = { id:id, insp:rec.id, blob:blob, state:'pending', err:'', at:Date.now() };
      return dbPut('photos', row).then(function(){
        blobUrl[id] = URL.createObjectURL(blob); photoState[id] = { state:'pending', err:'' };
        mut(function(doc){ var a = findArea(doc, tg.areaId); (a.photo_ids = a.photo_ids||[]).push(id); });
      });
    }).catch(function(e){ fails++; toast('Photo not added: '+e.message); });
  });
  chain.then(function(){ render(); pumpPhotos(); if (!fails) toast(files.length+' photo'+(files.length>1?'s':'')+' added'); });
});
function pumpPhotos(){
  if (S.pumping) return Promise.resolve(); if (!navigator.onLine) { setSync(); return Promise.resolve(); }
  S.pumping = true; S.photoMsg='';
  return dbAll('photos').then(function(rows){
    var todo = (rows||[]).filter(function(p){ return p.state!=='done'; });
    photoState = {}; todo.forEach(function(p){ photoState[p.id] = { state:p.state, err:p.err||'' }; });
    setSync();
    var chain = Promise.resolve();
    todo.forEach(function(p){
      chain = chain.then(function(){
        return dbGet('docs', p.insp).then(function(d){
          if (!d || !d.base_rev){ photoState[p.id] = { state:'pending', err:'waiting for the inspection to save' }; return; }
          return fetch(WORKER+'/fi/photo?inspection_id='+encodeURIComponent(p.insp)+'&photo_id='+encodeURIComponent(p.id), { method:'POST', headers:{'X-Auth-Token':AUTH_TOKEN,'Content-Type':'image/jpeg'}, body:p.blob })
            .then(function(res){ return res.text().then(function(t){ var j; try{ j=JSON.parse(t); }catch(e){ j={ok:false,message:'HTTP '+res.status}; } if (!res.ok || j.ok===false){ var er=new Error(j.message||('HTTP '+res.status)); er.code=j.error; throw er; } return j; }); })
            .then(function(){ p.state='done'; p.err=''; delete photoState[p.id]; return dbPut('photos', p); })
            .catch(function(e){
              if (e.code==='inspection_not_saved'){ photoState[p.id] = { state:'pending', err:'waiting for the inspection to save' }; if (S.rec && S.rec.id===p.insp){ S.rec.dirty=true; scheduleSync(); } return; }
              p.err = e.message; p.state='error'; photoState[p.id] = { state:'error', err:e.message }; S.photoMsg = e.message; return dbPut('photos', p);
            });
        });
      });
    });
    return chain;
  }).then(function(){ S.pumping=false; setSync(); if (S.view==='review'||S.view==='area') safeRender(); var stuck = Object.keys(photoState).some(function(k){ return photoState[k].state==='pending'; }); if (stuck) setTimeout(pumpPhotos, 20000); })
    .catch(function(e){ S.pumping=false; S.photoMsg = e.message; setSync(); });
}
function retryPhotos(){
  dbAll('photos').then(function(rows){ var ps=[]; (rows||[]).forEach(function(p){ if (p.state==='error'){ p.state='pending'; ps.push(dbPut('photos',p)); } }); return Promise.all(ps); }).then(function(){ S.photoMsg=''; pumpPhotos(); });
}

// ── model ───────────────────────────────────────────────────────────────────
function findArea(doc, id){ for (var i=0;i<doc.areas.length;i++) if (doc.areas[i].id===id) return doc.areas[i]; return null; }
function issueCount(a){ return (a.issues||[]).length; }
function inspectedCount(doc){ var act = doc.areas.filter(function(a){return !a.excluded;}); return { done: act.filter(function(a){ return (a.condition && a.condition!=='not_inspected') || (a.access && a.access.no_access); }).length, total: act.length }; }

// ── views ───────────────────────────────────────────────────────────────────
function render(){
  if (drag) return;   // never rebuild the list under a finger that is mid-drag; dragFinish() re-renders
  var v = $('view'), h = '';
  if (S.view==='home') h = viewHome();
  else if (S.view==='new') h = viewNew();
  else if (S.view==='insp') h = viewInsp();
  else if (S.view==='area') h = viewArea();
  else if (S.view==='review') h = viewReview();
  else if (S.view==='brands') h = viewBrands();
  else if (S.view==='voice') h = viewVoice();
  else if (S.view==='route') h = viewRoute();
  var y = window.scrollY, key = S.view + ':' + (S.areaId||'');
  v.innerHTML = h; window.scrollTo(0, render._key === key ? y : 0); render._key = key;
  if (S.view==='route') saveRouteDraft();
  if (S.view==='new' && !S.newProp) renderPropList();
  if (S.view==='area') bindArea();
  setSync();
}
// Re-render only when the user is not typing — a background sync/upload must never steal focus or close the keyboard.
function safeRender(){ var el = document.activeElement; if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && $('view').contains(el)) return false; render(); return true; }
function go(view, extra){ S.view = view; if (extra) for (var k in extra) S[k]=extra[k]; render(); }
function brandById(id){ for (var i=0;i<S.brands.length;i++) if (S.brands[i].id===id) return S.brands[i]; return null; }
function defaultBrand(){ for (var i=0;i<S.brands.length;i++) if (S.brands[i].is_default) return S.brands[i]; return S.brands[0] || null; }

function viewHome(){
  var h = '<h1>Field Inspection</h1>';
  if (S.noIdb) h += '<div class="banner err">This browser is not letting the app store data on the phone, so offline saving is off. Keep this page open until everything shows “Saved to server”.</div>';
  if (S.listErr) h += '<div class="banner warn">'+esc(S.listErr)+'</div>';
  h += '<button class="btn primary block" style="min-height:56px;font-size:17px" onclick="startNew()">＋ New inspection</button>';
  h += '<div class="btns"><button class="btn" onclick="openBrands()">🎨 Brands (Ridge Co, Premier…)</button></div>';
  var items = {};
  S.list.forEach(function(i){ items[i.id] = { id:i.id, address:i.address, date:i.date, status:i.status, issues:i.issue_count, server:true, rev:i.rev, brand:i.brand_id, updated:i.updated_at }; });
  Object.keys(localOnly).forEach(function(id){ var r = localOnly[id]; var it = items[id] || { id:id, server:false }; it.address = r.doc.property.address; it.date = r.meta.inspection_date; it.local = true; it.dirty = r.dirty; it.issues = r.doc.areas.reduce(function(n,a){return n+(a.issues||[]).length;},0); it.status = it.status || 'draft'; it.updated = r.doc.updated || it.updated; items[id]=it; });
  var arr = Object.keys(items).map(function(k){return items[k];}).sort(function(a,b){ return String(b.updated||'').localeCompare(String(a.updated||'')); });
  h += '<h2>Inspections</h2>';
  if (!arr.length) h += '<div class="card muted">None yet. Tap “New inspection” to start one.</div>';
  arr.forEach(function(it){
    var pill = it.status==='published' ? '<span class="pill ok">Published</span>' : '<span class="pill">Draft</span>';
    var sync = it.dirty ? ' <span class="pill warn">unsaved changes</span>' : (!it.server ? ' <span class="pill bad">only on this phone</span>' : '');
    h += '<div class="card" style="cursor:pointer" onclick="openInspection(\''+esc(it.id)+'\')"><div class="row"><b>'+esc(it.address||'(no address)')+'</b>'+pill+'</div><div class="muted">'+esc(it.date||'')+' · '+(it.issues||0)+' issue'+((it.issues||0)===1?'':'s')+sync+'</div></div>';
  });
  return h;
}

// ---- new inspection ----
function startNew(){
  S.newProp = null; S.newOwner = null; S.ownerQ=''; S.pickUnitFor=''; S.propQ=''; S.view='new';
  var d = defaultBrand();
  S.newOpts = { type:'periodic', date:todayStr(), inspector:lsGet('fi_inspector','Brett Lambert'), client:'', email:'', pre1978:false, brand:(d&&d.id)||'', beds:3, baths:1, sides:true, laundry:true, basement:true, attic:false };
  render(); loadProps();
}
// ---- Hub directory: properties, units, owners (searchable) ----
function nz(s){
  var m = { street:'st', avenue:'ave', road:'rd', drive:'dr', lane:'ln', court:'ct', boulevard:'blvd', place:'pl', apartment:'apt' };
  return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(' ').map(function(w){ return m[w]||w; }).join(' ');
}
function loadProps(){
  var cached = S.dir ? '' : lsGet('fi_dir','');
  if (cached){ try{ S.dir = JSON.parse(cached); }catch(e){ S.dir = null; } }
  api('GET','/fi/directory').then(function(d){
    S.dir = { properties:d.properties||[], units:d.units||[], owners:d.owners||[] }; S.propsErr='';
    lsSet('fi_dir', JSON.stringify(S.dir));
    if (S.view==='new' && !S.newProp && !S.pickUnitFor) renderPropList();
  }).catch(function(e){ S.propsErr = 'Could not load the Hub list ('+e.message+')' + (S.dir?' — using the copy saved on this phone.':'. You can still add the property by hand.'); if (S.view==='new' && !S.pickUnitFor) render(); });
}
function propLabel(p){ return p.address + (p.city?', '+p.city:'') + (p.state?', '+p.state:'') + (p.zip?' '+p.zip:''); }
function unitText(l){ l = String(l||'').trim(); return !l ? '' : (/^(unit|apt|suite|ste|#)/i.test(l) ? l : 'Unit '+l); }
function unitsOf(pid){ return ((S.dir&&S.dir.units)||[]).filter(function(u){ return String(u.property_id)===String(pid); }); }
function propById(id){ var l=(S.dir&&S.dir.properties)||[]; for (var i=0;i<l.length;i++) if (String(l[i].id)===String(id)) return l[i]; return null; }

    +tgl('sides','Exterior sides (left &amp; right)','Turn off for rowhomes — front and rear only')+tgl('laundry','Laundry')+tgl('basement','Basement')+tgl('attic','Attic')+'</div>';

function logoNudge(b){
  if (!b || b.has_logo || b.logo_data) return '';
  return '<div class="banner info" style="margin:8px 0 0">“'+esc(b.name)+'” has no logo yet, so the report header shows text only. <a href="#" onclick="openBrands();return false">Add the logo</a> once and every report uses it.</div>';
}
function tgl(k,label,sub){ return '<div class="toggle"><span>'+label+(sub?'<div class="muted">'+sub+'</div>':'')+'</span><input type="checkbox"'+(S.newOpts[k]?' checked':'')+' onchange="S.newOpts.'+k+'=this.checked"></div>'; }
function stepOpt(k,d){ var v = Math.max(0, Math.min(12, S.newOpts[k]+d)); if (k==='baths' && v<1) v=1; S.newOpts[k]=v; $('n-'+k).textContent=v; }
// Tokenised search: every word typed must appear in the address / city / owner (or the unit label for unit rows).
function searchProps(q){
  var d = S.dir; if (!d) return [];
  var toks = nz(q).split(' ').filter(Boolean), out = [];
  d.properties.forEach(function(p){
    var hay = nz(p.address+' '+p.city+' '+p.owner_name), units = unitsOf(p.id);
    if (!toks.length || toks.every(function(t){ return hay.indexOf(t)>-1; })) out.push({ p:p, u:null, n:units.length });
    if (toks.length) units.forEach(function(u){
      var ul = nz(unitText(u.label)), all = hay+' '+ul;
      if (toks.every(function(t){ return all.indexOf(t)>-1; }) && toks.some(function(t){ return ul.indexOf(t)>-1; })) out.push({ p:p, u:u, n:0 });
    });
  });

// ---- dictation ----
var recog = null;
function toggleDictation(){ if (S.listening) stopDictation(); else startDictation(); render(); }
function startDictation(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  S.dictErr='';
  if (!SR){ S.dictErr = 'Voice typing is not available in this browser. Tap the text box and use the microphone key on your keyboard instead — it works the same.'; var t=$('pending'); if (t) t.focus(); return; }
  try{
    recog = new SR(); recog.continuous = true; recog.interimResults = true; recog.lang = 'en-US';
    recog.onresult = function(ev){
      var fin = '', inter = '';
      for (var i=ev.resultIndex;i<ev.results.length;i++){ var tr = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += tr; else inter += tr; }
      if (fin){ var a = curArea(); var cur = a.pending_text||''; var nv = (cur && !/\s$/.test(cur) ? cur+' ' : cur) + fin.trim(); mut(function(){ a.pending_text = nv; }); var ta=$('pending'); if (ta) ta.value = nv; }
      S.interim = inter; var el=$('interim'); if (el) el.textContent = inter ? '… '+inter : '';
    };
    recog.onerror = function(ev){
      if (ev.error==='no-speech' || ev.error==='aborted') return;
      S.listening=false; S.dictErr = ev.error==='not-allowed' || ev.error==='service-not-allowed' ? 'Microphone is blocked. Allow the microphone for this site in Chrome (lock icon in the address bar), or use your keyboard’s mic key.' : ('Voice typing stopped: '+ev.error+'. Use your keyboard’s mic key if this keeps happening.'); render();
    };
    recog.onend = function(){ if (S.listening){ try{ recog.start(); }catch(e){ S.listening=false; S.dictErr='Voice typing stopped unexpectedly.'; render(); } } };
    S.listening = true; recog.start();
  }catch(e){ S.listening=false; S.dictErr='Could not start voice typing: '+e.message; }
}
function stopDictation(){ S.listening=false; S.interim=''; if (recog){ try{ recog.onend=null; recog.stop(); }catch(e){ /* already stopped */ } recog=null; } }

function localChecks(doc){
  var blocks=[], warns=[], active = doc.areas.filter(function(a){return !a.excluded;});
  var pend = pendingPhotoCount(); if (pend) blocks.push(pend+' photo'+(pend>1?'s are':' is')+' still uploading');
  if (!active.length) blocks.push('No areas to report');
  if (!(doc.owner && String(doc.owner.name||'').trim())) blocks.push('Choose who this inspection is on behalf of (the owner)');
  if (!doc.overall || !doc.overall.condition || doc.overall.condition==='not_inspected') blocks.push('Set the overall condition');
  active.forEach(function(a){ if ((a.pending_text||'').trim()) blocks.push('“'+a.name+'” has dictation not turned into issues (or cleared)'); });
  var sk = active.filter(function(a){ return !a.condition || a.condition==='not_inspected'; }).map(function(a){return a.name;}); if (sk.length) warns.push('Not marked inspected: '+sk.join(', '));
  var uns = (doc.voice_notes||[]).filter(function(n){ return !n.routed && String(n.transcript||'').trim(); }).length; if (uns) warns.push(uns+' voice note'+(uns>1?'s have':' has')+' not been sorted into areas yet');
  if (S.rec.dirty) blocks.push('Changes are not saved to the server yet');
  var sm = doc.summary; if (sm && sm.fp && sm.fp !== fpOf(doc)) warns.push('The AI summary is out of date and will be left out of the report');
  if (sm && !sm.accepted) warns.push('The AI summary has not been approved and will be left out of the report');
  return { blocks:blocks, warns:warns };
}
function rollup(doc){
  var by = {}, order = ['urgent','high','medium','low','info'];
  doc.areas.forEach(function(a){ if (a.excluded) return; (a.issues||[]).forEach(function(is){ var t = is.trade||'general'; var g = by[t] = by[t] || { trade:t, items:[], worst:'info' }; g.items.push({ area:a.name, title:is.title, severity:is.severity }); if (order.indexOf(is.severity) < order.indexOf(g.worst)) g.worst = is.severity; }); });
  return Object.keys(by).map(function(k){return by[k];}).sort(function(x,y){ return order.indexOf(x.worst)-order.indexOf(y.worst) || y.items.length-x.items.length; });
}

  if (rec.status==='published') h += publishedCard();
  return h;
}

function publishNow(ack){
  if (!claim('pub')) return; var btn=$('pub-btn'); if (btn) btn.disabled=true;
  var rec = S.rec;
  (rec.dirty ? syncNow(true) : Promise.resolve()).then(function(){
    if (rec.dirty || S.sync.state==='error') throw new Error('Could not save the latest changes to the server first.');
    return api('POST','/fi/publish',{ id:rec.id, rev:rec.base_rev, ack_warnings: ack===true });
  }).then(function(r){ rec.status='published'; return persistLocal().then(function(){ release('pub'); S.publishInfo = r; refreshList(); toast('Published'); render(); }); })
    .catch(function(e){
      release('pub');
      if (e.code==='needs_ack'){ openSheet('<h2>Publish anyway?</h2>'+((e.data&&e.data.warnings)||[]).map(function(w){ return '<div class="check">⚠️ '+esc(w.message)+'</div>'; }).join('')+'<div class="btns"><button class="btn go" onclick="closeSheet();publishNow(true)">Yes, publish</button><button class="btn" onclick="closeSheet();render()">Go back</button></div>'); return; }

      toast('Publish failed: '+e.message); render();
    });
}

var EQUIP_KINDS = {
  furnace:{label:'Furnace',extra:['fuel','filter_size']}, boiler:{label:'Boiler',extra:['fuel']}, central_ac:{label:'Central A/C',extra:['tonnage','filter_size']},
  heat_pump:{label:'Heat pump',extra:['tonnage','filter_size']}, water_heater:{label:'Water heater',extra:['fuel','capacity']}, refrigerator:{label:'Refrigerator',extra:[]},
  range:{label:'Range / oven',extra:['fuel']}, dishwasher:{label:'Dishwasher',extra:[]}, microwave:{label:'Microwave',extra:[]}, washer:{label:'Washer',extra:[]},
  dryer:{label:'Dryer',extra:['fuel']}, disposal:{label:'Garbage disposal',extra:[]}, other:{label:'Other equipment',extra:[]}
};
var EQUIP_LABEL = {name:'Label (optional, e.g. “Upstairs unit”)',brand:'Brand',model:'Model number',serial:'Serial number',year:'Year / date made',notes:'Notes',fuel:'Fuel type',filter_size:'Filter size',tonnage:'Tonnage',capacity:'Capacity'};
var EQUIP_HINT = {filter_size:'e.g. 16x25x1', fuel:'gas, electric, oil', capacity:'gallons, e.g. 40', tonnage:'e.g. 3 ton', year:'e.g. 2008', model:'as printed on the label', serial:'as printed on the label'};
function equipKeys(kind){ return ['brand','model','serial','year'].concat((EQUIP_KINDS[kind]||EQUIP_KINDS.other).extra); }
function equipSuggest(areaName){
  var n = String(areaName||'').toLowerCase(), out = [];
  if (/water heater/.test(n)) out = ['water_heater'];
  else if (/hvac|heat|furnace|boiler|mechanical|utility|cooling/.test(n)) out = ['furnace','boiler','central_ac','heat_pump'];
  else if (/kitchen/.test(n)) out = ['refrigerator','range','dishwasher','microwave','disposal'];
  else if (/laundry/.test(n)) out = ['washer','dryer'];
  else if (/basement|cellar/.test(n)) out = ['furnace','boiler','water_heater','washer','dryer'];
  return out;
}
function equipTitle(e){ var k = EQUIP_KINDS[e.kind] || EQUIP_KINDS.other; return (e.name ? e.name + ' · ' : '') + k.label; }
function equipSummary(e){
  var bits = [];
  ['brand','model','serial','year'].forEach(function(f){ if (e[f]) bits.push((f==='serial'?'S/N ':f==='model'?'Model ':'')+e[f]); });
  ['filter_size','fuel','tonnage','capacity'].forEach(function(f){ if (e[f]) bits.push((f==='filter_size'?'filter ':'')+e[f]); });
  return bits.join(' · ');
}

// ---- walk-through order ----
function walkKey(a, idx){
  var n = String(a.name||'').toLowerCase(), numM = n.match(/\d+/), num = numM ? Number(numM[0]) : 0;
  if (a.group==='exterior' || /exterior|roof|gutter|porch|deck|yard|fence|garage|shed|driveway|walkway|sidewalk/.test(n)){
    var r = /front/.test(n) ? 0 : /side|left|right/.test(n) ? 1 : /rear|back/.test(n) ? 2 : /roof|gutter/.test(n) ? 4 : 3;
    return [0,0,r,num,idx];
  }
  if (/smoke|\bco\b|carbon/.test(n)) return [3,0,0,num,idx];
  var isSys = /hvac|heat|furnace|boiler|mechanical|utility|cooling|water heater|electric|panel/.test(n);
  var isBed = /bedroom/.test(n), isBath = /bath|powder|restroom|toilet/.test(n), isHalf = /half|powder/.test(n);
  var fl = /basement|cellar/.test(n) ? 1 : /attic/.test(n) ? 4 : /third|3rd/.test(n) ? 3 : /second|2nd|upstairs/.test(n) ? 2 : null;

  var b = id ? JSON.parse(JSON.stringify(brandById(id))) : { id:'', name:'', primary_color:'#1d4ed8', accent_color:'#166534', tagline:'', contact_line:'', footer_text:'', website:'', phone:'', email:'', address:'', logo_data:'', is_default:false };
  ['website','phone','email','address'].forEach(function(f){ if (b[f]===undefined) b[f] = ''; });
  brandEdit = b; renderBrandSheet();
}

        +'<div class="muted">Accent color — tap to choose</div><div>'+sc.colors.map(function(c){ return '<button class="swatch'+(b.accent_color.toLowerCase()===c.hex?' sel':'')+'" style="background:'+esc(c.hex)+'" aria-label="accent color '+esc(c.hex)+'" onclick="brandEdit.accent_color=\''+esc(c.hex)+'\';renderBrandSheet()"></button>'; }).join('')+'</div>';

    +'<label class="fld">Tagline</label><input value="'+esc(b.tagline)+'" oninput="brandEdit.tagline=this.value">'
    +'<label class="fld">Phone</label><input type="tel" value="'+esc(b.phone)+'" oninput="brandEdit.phone=this.value">'
    +'<label class="fld">Email</label><input type="email" value="'+esc(b.email)+'" oninput="brandEdit.email=this.value">'
    +'<label class="fld">Address</label><input value="'+esc(b.address)+'" oninput="brandEdit.address=this.value">'
    +'<label class="fld">Contact line (optional — replaces the phone / email / website line in the report footer)</label><input value="'+esc(b.contact_line)+'" oninput="brandEdit.contact_line=this.value">'
    +'<label class="fld">Report footer text</label><textarea style="min-height:60px" oninput="brandEdit.footer_text=this.value">'+esc(b.footer_text)+'</textarea>'
    +'<label class="fld">Logo</label>'+(b.logo_data?'<div style="background:#f4f5f7;border-radius:8px;padding:8px;margin-bottom:6px"><img src="'+esc(b.logo_data)+'" alt="logo" style="max-height:60px;max-width:100%"></div>':'<div class="muted">No logo yet.</div>')
    +'<div class="btns"><button class="btn" onclick="$(\'logo-in\').value=\'\';$(\'logo-in\').click()">Choose logo image</button>'+(b.logo_data?'<button class="btn" onclick="brandEdit.logo_data=\'\';brandEdit.remove_logo=true;renderBrandSheet()">Remove logo</button>':'')+'</div>'

function captureBrand(){
  var b = brandEdit, url = String(b.website||'').trim();
  if (!url){ toast('Enter the company’s website address first'); return; }
  if (!claim('brscrape')) return; b.scraping = true; b.scrapeErr = ''; renderBrandSheet();
  api('POST','/fi/brand/scrape',{ url:url }).then(function(r){ b.scrape = r; b.scraping = false; b.website = r.website||b.website; release('brscrape'); renderBrandSheet(); })
    .catch(function(e){ b.scraping = false; b.scrapeErr = e.message; release('brscrape'); renderBrandSheet(); });
}
// Fills blank fields from what was found (never overwrites something already typed), and picks the first logo.
function applyScrape(){
  var b = brandEdit, sc = b.scrape; if (!sc) return;
  var filled = [];
  [['name','name'],['tagline','tagline'],['phone','phone'],['email','email'],['address','address']].forEach(function(p){ if (sc[p[0]] && !String(b[p[1]]||'').trim()){ b[p[1]] = sc[p[0]]; filled.push(p[1]); } });
  if (sc.website) b.website = sc.website.replace(/\/$/, '');
  if (sc.primary_color){ b.primary_color = sc.primary_color; filled.push('colors'); }
  if (sc.accent_color) b.accent_color = sc.accent_color;
  var pr = (sc.logos||[]).length ? useScrapedLogo(0, true) : Promise.resolve();
  pr.then(function(){ renderBrandSheet(); toast(filled.length ? 'Filled in: '+filled.join(', ')+' — check and adjust' : 'Nothing new to fill in'); });
}
function useScrapedLogo(i, quiet){
  var l = (brandEdit.scrape.logos||[])[i]; if (!l) return Promise.resolve();
  return shrinkLogo(l.data_uri).then(function(out){ brandEdit.logo_data = out; delete brandEdit.remove_logo; if (!quiet) renderBrandSheet(); })
    .catch(function(e){ toast('That logo could not be used: '+e.message); if (!quiet) renderBrandSheet(); });
}
// Shrinks any image (data/object URL) under the ~30 KB the server stores for a logo.
function shrinkLogo(src){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){
      var tries = [[260,'image/png',0],[200,'image/png',0],[320,'image/jpeg',0.85],[240,'image/jpeg',0.7],[160,'image/jpeg',0.6]], out = '', nw = img.naturalWidth||300, nh = img.naturalHeight||100;
      for (var i=0;i<tries.length && !out;i++){
        var sc = Math.min(1, tries[i][0]/nw), c = document.createElement('canvas'); c.width = Math.max(1,Math.round(nw*sc)); c.height = Math.max(1,Math.round(nh*sc));
        var ctx = c.getContext('2d'); if (tries[i][1]==='image/jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); } ctx.drawImage(img,0,0,c.width,c.height);
        var d = c.toDataURL(tries[i][1], tries[i][2]); if (d.length <= 40000) out = d;
      }
      if (!out) reject(new Error('it is too detailed to shrink small enough — try a simpler image')); else resolve(out);
    };
    img.onerror = function(){ reject(new Error('the image could not be read')); };
    img.src = src;
  });
}
$('logo-in').addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0]; if (!f || !brandEdit) return;
  var url = URL.createObjectURL(f);
  shrinkLogo(url).then(function(out){ URL.revokeObjectURL(url); brandEdit.logo_data = out; delete brandEdit.remove_logo; renderBrandSheet(); })
    .catch(function(e){ URL.revokeObjectURL(url); toast('Logo not used: '+e.message); });
});
function saveBrand(){
  var b = brandEdit; if (!String(b.name||'').trim()){ toast('Enter the company name'); return; }
  if (!claim('brsave')) return; $('br-save').disabled = true;
  var body = { id:b.id||undefined, name:b.name, primary_color:b.primary_color, accent_color:b.accent_color, tagline:b.tagline, contact_line:b.contact_line, footer_text:b.footer_text, website:b.website, phone:b.phone, email:b.email, address:b.address, is_default:!!b.is_default };
  if (b.logo_data && b.logo_data !== (brandById(b.id)||{}).logo_data) body.logo_data = b.logo_data;
  if (b.remove_logo) body.remove_logo = true;
  api('POST','/fi/brand/save',body).then(function(){ return refreshList(); }).then(function(){ release('brsave'); closeSheet(); toast('Saved'); if (S.view==='brands'||S.view==='review'||S.view==='new') render(); })
    .catch(function(e){ release('brsave'); $('br-save').disabled=false; toast('Not saved: '+e.message); });
}

// ---- voice notes: recordings -> transcript -> sorted into the right areas (you review before anything is added) ----
var voiceFiles = {}, voiceState = {}, voiceQueue = [], voicePumping = false;
function openVoice(){ S.view='voice'; S.routeErr=''; render(); }
function voiceItems(){ return (S.rec.doc.voice_notes||[]); }
function pickAudio(){ var i = $('audio-in'); i.value=''; i.click(); }
$('audio-in').addEventListener('change', function(ev){
  var files = Array.prototype.slice.call(ev.target.files||[]); if (!files.length || !S.rec) return;
  files.forEach(function(f){
    if (!f.size){ toast(f.name+' is empty'); return; }
    if (f.size > 14*1024*1024){ toast(f.name+' is larger than 14 MB — too long for one upload. Trim it or split it.'); return; }
    var id = 'vn_'+rid(8); voiceFiles[id] = f; voiceState[id] = { state:'queued', err:'', name:f.name, bytes:f.size, rec:S.rec }; voiceQueue.push(id);
  });
  render(); pumpVoice();
});
function mutRec(rec, fn){
  if (rec === S.rec){ mut(fn); return Promise.resolve(); }
  fn(rec.doc); rec.dirty = true; rec.ver = (rec.ver||0)+1; rec.doc.updated = new Date().toISOString(); return dbPut('docs', rec);
}
function pumpVoice(){
  if (voicePumping) return; var id = voiceQueue.shift(); if (!id) return;
  var f = voiceFiles[id], st = voiceState[id], rec = st.rec; voicePumping = true; st.state = 'working'; st.err = ''; if (S.view==='voice') safeRender();
  fetch(WORKER+'/fi/transcribe?inspection_id='+encodeURIComponent(rec.id)+'&name='+encodeURIComponent(f.name), { method:'POST', headers:{ 'X-Auth-Token':AUTH_TOKEN, 'Content-Type': f.type || 'application/octet-stream' }, body:f })
    .then(function(res){ return res.text().then(function(t){ var j; try{ j = JSON.parse(t); }catch(e){ j = { ok:false, message:'The server sent an unreadable answer (HTTP '+res.status+')' }; } if (!res.ok || j.ok===false){ var er = new Error(j.message || ('HTTP '+res.status)); er.code = j.error; throw er; } return j; }); })
    .then(function(r){
      return mutRec(rec, function(doc){ (doc.voice_notes = doc.voice_notes||[]).push({ id:id, name:f.name, bytes:f.size, transcript:r.transcript, at:new Date().toISOString(), source:'audio', routed:false, truncated:!!r.truncated }); }).then(function(){ delete voiceState[id]; delete voiceFiles[id]; if (r.truncated) toast(f.name+': the transcript may be cut off at the end (very long recording)'); });
    })
    .catch(function(e){ st.state = 'error'; st.err = e.message || 'unknown error'; })
    .then(function(){ voicePumping = false; if (S.view==='voice') safeRender(); setSync(); pumpVoice(); });
}
function retryVoice(id){ var st = voiceState[id]; if (!st || !voiceFiles[id]) return; st.state='queued'; st.err=''; voiceQueue.push(id); render(); pumpVoice(); }
function dropVoice(id){ delete voiceState[id]; delete voiceFiles[id]; voiceQueue = voiceQueue.filter(function(x){return x!==id;}); render(); }
function typedNoteSheet(){
  openSheet('<h2>Type or paste notes</h2><div class="muted">Paste text from a voice-to-text app, or type notes that jump between rooms — they get sorted into areas the same way.</div><label class="fld">Label (optional)</label><input id="tn-label" placeholder="e.g. Second-floor notes"><label class="fld">Notes</label><textarea id="tn-text" style="min-height:160px"></textarea><div class="btns"><button class="btn primary" onclick="saveTypedNote()">Add</button><button class="btn" onclick="closeSheet()">Cancel</button></div>');
}
function saveTypedNote(){
  var t = $('tn-text').value.trim(); if (!t){ toast('Type or paste something first'); return; }
  var label = $('tn-label').value.trim() || 'Typed notes';
  mut(function(doc){ (doc.voice_notes = doc.voice_notes||[]).push({ id:'vn_'+rid(8), name:label, bytes:0, transcript:t, at:new Date().toISOString(), source:'typed', routed:false }); });
  closeSheet(); render(); toast('Notes added');
}
var voiceOpen = {};
function toggleVoiceText(id){ voiceOpen[id] = !voiceOpen[id]; render(); }
function setVoiceText(id, v){ mut(function(doc){ (doc.voice_notes||[]).forEach(function(n){ if (n.id===id){ n.transcript = v; } }); }); }
function removeVoiceStep(id, btn){ if (btn.dataset.armed!=='1'){ btn.dataset.armed='1'; btn.textContent='Tap again to remove'; return; } mut(function(doc){ doc.voice_notes = (doc.voice_notes||[]).filter(function(n){ return n.id!==id; }); }); render(); }
function markUnrouted(id){ mut(function(doc){ (doc.voice_notes||[]).forEach(function(n){ if (n.id===id){ n.routed=false; delete n.routed_at; } }); }); render(); }
function viewVoice(){
  var doc = S.rec.doc, notes = voiceItems(), pending = Object.keys(voiceState).filter(function(k){ return voiceState[k].rec===S.rec; });
  var unsorted = notes.filter(function(n){ return !n.routed && String(n.transcript||'').trim(); });
  var h = '<div class="row"><button class="btn sm ghost" onclick="backToInsp()">‹ Areas</button></div><h1>Voice notes</h1>';
  h += '<div class="muted">Upload the recordings of your inspection notes. Each one is turned into text, then sorted into the right areas — even when you jumped between rooms and floors. You review everything before it is added.</div>';
  h += '<div class="btns"><button class="btn primary" onclick="pickAudio()">🎙 Add recordings</button><button class="btn" onclick="typedNoteSheet()">✍ Type or paste notes</button></div>';
  h += routeResumeHtml();
  if (S.routeErr) h += '<div class="banner err" style="margin-top:10px">'+esc(S.routeErr)+'</div>';
  if (S.routeBusy) h += '<div class="banner info" style="margin-top:10px">⏳ '+esc(S.routeBusy)+'</div>';
  pending.forEach(function(id){ var st = voiceState[id]; h += '<div class="card"><div class="row"><b>'+esc(st.name)+'</b>'+(st.state==='error'?'<span class="pill bad">Failed</span>':st.state==='working'?'<span class="pill new">Transcribing…</span>':'<span class="pill">Waiting</span>')+'</div><div class="muted">'+Math.round(st.bytes/1024)+' KB</div>'+(st.err?'<div class="banner err" style="margin-top:8px">'+esc(st.err)+'</div>':'')+(st.state==='error'?'<div class="btns"><button class="btn sm" onclick="retryVoice(\''+id+'\')">Try again</button><button class="btn sm danger" onclick="dropVoice(\''+id+'\')">Remove</button></div>':'')+'</div>'; });
  if (!notes.length && !pending.length) h += '<div class="card muted" style="margin-top:10px">Nothing yet. Tap “Add recordings” and pick the audio files from your phone or Google Drive.</div>';
  notes.forEach(function(n){
    h += '<div class="card"><div class="row"><b>'+esc(n.name||'Recording')+'</b>'+(n.routed?'<span class="pill ok">Sorted</span>':'<span class="pill warn">Not sorted yet</span>')+'</div><div class="muted">'+(n.source==='typed'?'Typed notes':'Recording'+(n.bytes?' · '+Math.round(n.bytes/1024)+' KB':''))+' · '+String(n.transcript||'').length+' characters'+(n.truncated?' · <span style="color:var(--warn)">may be cut off at the end</span>':'')+'</div>';
    h += '<div class="btns"><button class="btn sm" onclick="toggleVoiceText(\''+n.id+'\')">'+(voiceOpen[n.id]?'Hide text':'Show / fix text')+'</button>'+(n.routed?'<button class="btn sm" onclick="markUnrouted(\''+n.id+'\')">Sort again</button>':'')+'<button class="btn sm danger" onclick="removeVoiceStep(\''+n.id+'\',this)">Remove</button></div>';
    if (voiceOpen[n.id]) h += '<textarea style="min-height:160px;margin-top:8px" oninput="setVoiceText(\''+n.id+'\',this.value)">'+esc(n.transcript||'')+'</textarea><div class="muted">Fix any mis-heard words before sorting. Brand, model and serial numbers are worth double-checking.</div>';
    h += '</div>';
  });
  if (unsorted.length) h += '<button class="btn go block" style="min-height:56px;font-size:17px;margin-top:6px" id="route-btn" onclick="startRoute()"'+(S.routeBusy?' disabled':'')+'>✨ Sort '+unsorted.length+' note'+(unsorted.length===1?'':'s')+' into areas</button>';
  return h;
}
// The sorted-notes review is kept on the phone until it is added or discarded, so leaving the screen or reloading never loses the AI's work.
function routeKey(){ return 'fi_route_'+S.rec.id; }
function saveRouteDraft(){ if (S.rec && S.route){ S.route.recId = S.rec.id; lsSet(routeKey(), JSON.stringify(S.route)); } }
function dropRouteDraft(){ if (S.rec) lsDel(routeKey()); }
function loadRouteDraft(){
  S.route = null; if (!S.rec) return;
  var raw = lsGet(routeKey(), ''); if (!raw) return;
  try{ var r = JSON.parse(raw); if (r && r.recId===S.rec.id && r.issues) S.route = r; }catch(e){ lsDel(routeKey()); }
}
function routeCount(r){ return r ? r.issues.length + r.equipment.length + r.conditions.length + r.new_areas.length + r.unassigned.length : 0; }
function routeResumeHtml(){
  if (!S.route || (S.rec && S.route.recId && S.route.recId!==S.rec.id)) return '';
  return '<div class="banner warn" style="margin-top:10px"><b>Sorted notes are waiting for your review</b> ('+routeCount(S.route)+' item'+(routeCount(S.route)===1?'':'s')+'). Nothing has been added yet.<div class="btns"><button class="btn sm primary" onclick="S.view=\'route\';render()">Resume review</button><button class="btn sm" onclick="discardRoute()">Discard</button></div></div>';
}
function routeAreas(){ return S.rec.doc.areas.filter(function(a){ return !a.excluded; }).map(function(a){ return { id:a.id, name:a.name, group:a.group, issues:(a.issues||[]).map(function(i){return i.title;}) }; }); }
function chunkText(t){
  var out = [], cur = '', parts = String(t).split(/\n\s*\n/);
  parts.forEach(function(p){ while (p.length > 24000){ if (cur){ out.push(cur); cur=''; } out.push(p.slice(0,24000)); p = p.slice(24000); } if (cur.length + p.length + 2 > 24000){ out.push(cur); cur=''; } cur += (cur?'\n\n':'') + p; });
  if (cur.trim()) out.push(cur);
  return out;
}
function startRoute(){
  var doc = S.rec.doc, notes = voiceItems().filter(function(n){ return !n.routed && String(n.transcript||'').trim(); });
  if (!notes.length){ toast('Nothing to sort'); return; }
  if (!claim('route')) return;
  var chunks = []; notes.forEach(function(n){ chunkText(n.transcript).forEach(function(t,i){ chunks.push({ noteId:n.id, id:n.id+(i?'_'+i:''), label:n.name||'Recording', text:t }); }); });
  S.route = { recId:S.rec.id, issues:[], equipment:[], conditions:[], new_areas:[], unassigned:[], errors:[], noteIds:notes.map(function(n){return n.id;}), chunks:chunks };
  S.routeErr = ''; runChunks(chunks.slice(), 0, chunks.length).then(function(){
    release('route'); S.routeBusy = '';
    var r = S.route, any = r.issues.length || r.equipment.length || r.conditions.length || r.new_areas.length || r.unassigned.length;
    if (any || r.errors.length){ saveRouteDraft(); S.view='route'; render(); }
    else { S.routeErr = 'The notes were read but no problems or equipment details were found in them.'; S.route = null; dropRouteDraft(); render(); }
  });
}
function runChunks(list, done, total){
  var chain = Promise.resolve();
  list.forEach(function(ch){
    chain = chain.then(function(){
      S.routeBusy = 'Sorting '+(done+1)+' of '+total+': '+ch.label+'…'; if (S.view==='voice') safeRender();
      var doc = S.rec.doc, r = S.route;
      var proposed = r.issues.map(function(i){return i.title;});
      return api('POST','/fi/route',{ address:doc.property.address, pre1978:!!doc.pre1978, inspection_type:doc.type, areas:routeAreas(), notes:[{ id:ch.noteId, label:ch.label, text:ch.text }], proposed:proposed }).then(function(res){
        res.issues.forEach(function(i){ i.keep = true; r.issues.push(i); });
        res.equipment.forEach(function(e){ e.keep = true; r.equipment.push(e); });
        res.conditions.forEach(function(c){ var a = findArea(doc, c.area_id); c.keep = !!a && (!a.condition || a.condition==='not_inspected'); r.conditions.push(c); });
        res.new_areas.forEach(function(n){ r.new_areas.push(n); });
        res.unassigned.forEach(function(u){ r.unassigned.push(u); });
      }).catch(function(e){ r.errors.push({ chunk:ch, msg:e.message }); }).then(function(){ done++; });
    });
  });
  return chain;
}
function retryRouteErrors(){
  if (!claim('route')) return; var r = S.route, list = r.errors.map(function(e){return e.chunk;}); r.errors = [];
  runChunks(list, 0, list.length).then(function(){ release('route'); S.routeBusy=''; render(); });
}
// ---- route review ----
function areaOpts(sel){ return S.rec.doc.areas.filter(function(a){return !a.excluded;}).map(function(a){ return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+'</option>'; }).join(''); }
function areaName(id){ var a = findArea(S.rec.doc, id); return a ? a.name : '(unknown area)'; }
function viewRoute(){
  var r = S.route, doc = S.rec.doc;
  var h = '<div class="row"><button class="btn sm ghost" onclick="S.view=\'voice\';render()">‹ Voice notes</button></div><h1>Review sorted notes</h1>'+typeDatalist();
  h += '<div class="muted">Nothing is added until you tap “Add selected”. Each item shows the words it came from. If something landed in the wrong area, change the area before adding.</div>';
  r.errors.forEach(function(e){ h += '<div class="banner err" style="margin-top:10px"><b>“'+esc(e.chunk.label)+'” could not be sorted.</b> '+esc(e.msg)+'</div>'; });
  if (r.errors.length) h += '<div class="btns"><button class="btn" onclick="retryRouteErrors()"'+(S.routeBusy?' disabled':'')+'>'+(S.routeBusy?'Working…':'Try the failed part(s) again')+'</button></div>';
  if (r.unassigned.length){
    h += '<h2>Could not tell where these belong ('+r.unassigned.length+')</h2><div class="muted">Choose an area to add the text to that area’s notes (you can then tap “Turn into issues”), or dismiss it.</div>';
    r.unassigned.forEach(function(u,i){ h += '<div class="card"><div style="white-space:pre-wrap">'+esc(u.text)+'</div><div class="muted">'+esc(u.why||'')+'</div><select id="ua-'+i+'" style="margin-top:6px"><option value="">Choose an area…</option>'+areaOpts('')+'</select><div class="btns"><button class="btn sm primary" onclick="unassignedSend('+i+')">Add to that area’s notes</button><button class="btn sm" onclick="unassignedDismiss('+i+')">Dismiss</button></div></div>'; });
  }
  if (r.new_areas.length){
    h += '<h2>Possible new areas</h2>';
    r.new_areas.forEach(function(n,i){ h += '<div class="card"><b>'+esc(n.name)+'</b>'+(n.quote?'<div class="quote">“'+esc(n.quote)+'”</div>':'')+'<div class="btns"><button class="btn sm primary" onclick="routeCreateArea('+i+')">Create this area</button><button class="btn sm" onclick="S.route.new_areas.splice('+i+',1);render()">Skip</button></div><div class="muted">After creating it, change the area on the items that belong there.</div></div>'; });
  }
  var byArea = {}; r.issues.forEach(function(it,i){ (byArea[it.area_id] = byArea[it.area_id]||[]).push(i); });
  var n = r.issues.length;
  h += '<h2>Issues found ('+n+')</h2>';
  if (!n) h += '<div class="card muted">No issues were found in these notes.</div>';
  doc.areas.forEach(function(a){
    var idxs = byArea[a.id]; if (!idxs) return;
    h += '<h3>'+esc(a.name)+'</h3><div class="card">';
    idxs.forEach(function(i,k){ var it = r.issues[i];
      h += '<div class="'+(k?'rt-item':'')+'"><label class="check"><input type="checkbox" style="width:22px;height:22px" '+(it.keep?'checked':'')+' onchange="S.route.issues['+i+'].keep=this.checked"> <b>Add this issue</b></label>'
        +(it.quote?'<div class="quote">“'+esc(it.quote)+'”</div>':'')
        +'<select onchange="routeSetArea('+i+',this.value)">'+areaOpts(it.area_id)+'</select>'
        +'<input style="margin-top:6px" value="'+esc(it.title)+'" oninput="S.route.issues['+i+'].title=this.value" placeholder="Title">'
        +'<div class="row" style="gap:6px;margin-top:6px"><select onchange="S.route.issues['+i+'].trade=this.value">'+TRADES.map(function(t){return '<option value="'+t[0]+'"'+(it.trade===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+'</select><select onchange="S.route.issues['+i+'].severity=this.value">'+SEVS.map(function(t){return '<option value="'+t[0]+'"'+(it.severity===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+'</select></div>'
        +'<input style="margin-top:6px" list="type-dl" value="'+esc(it.issue_type||'')+'" oninput="S.route.issues['+i+'].issue_type=this.value" placeholder="Issue type (optional — pick or type)">'
        +'<textarea style="min-height:60px;margin-top:6px" oninput="S.route.issues['+i+'].detail=this.value" placeholder="Detail">'+esc(it.detail)+'</textarea>'
        +'<textarea style="min-height:60px;margin-top:6px" oninput="S.route.issues['+i+'].recommended_fix=this.value" placeholder="Recommended fix">'+esc(it.recommended_fix)+'</textarea>'
        +(it.fix_source==='suggested' && it.recommended_fix ? '<div class="muted">Fix suggested by AI — you didn’t state one.</div>':'')+(it.possible_duplicate_of?'<div class="muted" style="color:var(--warn)">May duplicate: '+esc(it.possible_duplicate_of)+'</div>':'')+'</div>';
    });
    h += '</div>';
  });
  if (r.equipment.length){
    h += '<h2>Equipment details ('+r.equipment.length+')</h2>';
    r.equipment.forEach(function(e,i){
      h += '<div class="card"><label class="check"><input type="checkbox" style="width:22px;height:22px" '+(e.keep?'checked':'')+' onchange="S.route.equipment['+i+'].keep=this.checked"> <b>Add '+esc((EQUIP_KINDS[e.kind]||EQUIP_KINDS.other).label)+'</b></label>'+(e.quote?'<div class="quote">“'+esc(e.quote)+'”</div>':'')
        +'<select onchange="S.route.equipment['+i+'].area_id=this.value">'+areaOpts(e.area_id)+'</select><div class="eqgrid">'
        +['brand','model','serial','year'].concat((EQUIP_KINDS[e.kind]||EQUIP_KINDS.other).extra).map(function(f){ return '<div><label class="fld">'+esc(EQUIP_LABEL[f]||f)+'</label><input value="'+esc(e[f]||'')+'" oninput="S.route.equipment['+i+'].'+f+'=this.value" autocomplete="off"></div>'; }).join('')
        +'<div class="full"><label class="fld">Notes</label><input value="'+esc(e.notes||'')+'" oninput="S.route.equipment['+i+'].notes=this.value"></div></div><div class="muted">Heard from a recording — check numbers against the label.</div></div>';
    });
  }
  if (r.conditions.length){
    h += '<h2>Area conditions</h2><div class="card">';
    r.conditions.forEach(function(c,i){ var a = findArea(doc, c.area_id); h += '<label class="check"><input type="checkbox" style="width:22px;height:22px" '+(c.keep?'checked':'')+' onchange="S.route.conditions['+i+'].keep=this.checked"> <span>Mark <b>'+esc(a?a.name:'?')+'</b> as <b>'+esc(COND_LABEL[c.condition])+'</b>'+(a && a.condition && a.condition!=='not_inspected' ? ' <span class="muted">(now '+esc(COND_LABEL[a.condition])+')</span>' : '')+'</span></label>'; });
    h += '</div>';
  }
  var kept = r.issues.filter(function(i){return i.keep && String(i.title||'').trim();}).length + r.equipment.filter(function(e){return e.keep;}).length + r.conditions.filter(function(c){return c.keep;}).length;
  h += '<div class="card selbar"><div class="muted">'+(r.unassigned.length?'Place or dismiss the '+r.unassigned.length+' item'+(r.unassigned.length===1?'':'s')+' above first.':kept+' item'+(kept===1?'':'s')+' selected.')+'</div><div class="btns"><button class="btn go" id="racc-btn" onclick="acceptRoute()"'+(r.unassigned.length||S.routeBusy?' disabled':'')+'>Add selected</button><button class="btn" onclick="discardRoute()">Discard all</button></div></div>';
  return h;
}
function routeSetArea(i, areaId){ S.route.issues[i].area_id = areaId; render(); }
function routeCreateArea(i){ var n = S.route.new_areas[i]; if (!n) return; var a = mkArea(n.name, 'interior'); mut(function(doc){ doc.areas.push(a); }); S.route.new_areas.splice(i,1); render(); toast('Area “'+a.name+'” created'); }
function unassignedSend(i){
  var u = S.route.unassigned[i], sel = $('ua-'+i); if (!u || !sel || !sel.value) return; var a = findArea(S.rec.doc, sel.value); if (!a) return;
  mut(function(){ a.pending_text = (a.pending_text ? a.pending_text.replace(/\s*$/,'')+'\n' : '') + u.text; });
  S.route.unassigned.splice(i,1); render(); toast('Added to '+a.name+' — open it and tap “Turn into issues”');
}
function unassignedDismiss(i){ S.route.unassigned.splice(i,1); render(); }
function discardRoute(){ S.route = null; dropRouteDraft(); S.view = 'voice'; render(); }
function acceptRoute(){
  if (!claim('racc')) return; var r = S.route, added = [], eqN = 0, condN = 0, now = new Date().toISOString();
  var failedNotes = {}; r.errors.forEach(function(e){ failedNotes[e.chunk.noteId] = true; });
  mut(function(doc){
    r.issues.forEach(function(i){
      if (!i.keep || !String(i.title||'').trim()) return; var a = findArea(doc, i.area_id); if (!a) return;
      var o = { id:'is_'+rid(8), title:i.title.trim(), trade:i.trade, severity:i.severity, detail:i.detail||'', likely_cause:i.likely_cause||'', recommended_fix:i.recommended_fix||'', fix_source:i.fix_source||'inspector', ai:true, wo:false, photo_ids:[], src:'voice' };
      if (String(i.issue_type||'').trim()) o.issue_type = i.issue_type.trim(); if (o.trade==='tenant_action') o.tenant_action = true;
      a.issues.push(o); added.push(o); if (!a.condition || a.condition==='not_inspected') a.condition = 'fair';
    });
    r.equipment.forEach(function(e){
      if (!e.keep) return; var a = findArea(doc, e.area_id); if (!a) return;
      var o = { id:'eq_'+rid(8), kind:e.kind, photo_ids:[] }; var any = false;
      ['name','brand','model','serial','year','notes'].concat((EQUIP_KINDS[e.kind]||EQUIP_KINDS.other).extra).forEach(function(f){ var v = String(e[f]||'').trim(); if (v){ o[f] = v; if (f!=='name') any = true; } });
      if (!any) return; (a.equipment = a.equipment||[]).push(o); eqN++;
    });
    r.conditions.forEach(function(c){ if (!c.keep) return; var a = findArea(doc, c.area_id); if (a){ a.condition = c.condition; condN++; } });
    (doc.voice_notes||[]).forEach(function(n){ if (r.noteIds.indexOf(n.id)>-1 && !failedNotes[n.id]){ n.routed = true; n.routed_at = now; } });
  });
  S.route = null; dropRouteDraft(); S.view = 'insp'; release('racc'); render();
  toast(added.length+' issue'+(added.length===1?'':'s')+(eqN?', '+eqN+' equipment':'')+(condN?', '+condN+' condition'+(condN===1?'':'s'):'')+' added');
  touchTypes(added);
}
</script>
