<!DOCTYPE html>
<html lang="en">
<head>
<script src="test-login.js"></script>
<script src="failure-reporter.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message Queue — Ridge Co</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --border:#dfe3e8; --text:#1c2430; --muted:#6b7684;
    --accent:#1d4ed8; --accent2:#1a7f4b; --danger:#c0392b; --warn:#b8860b; --chip:#eef2f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;overflow-x:hidden}
  header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10}
  header .hl{min-width:0}
  header h1{font-size:18px;margin:0}
  header .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .ver{margin-left:6px}
  main{padding:10px 14px 90px;max-width:720px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:13px}
  .btn{padding:9px 12px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.go{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn.small{padding:6px 12px;font-size:12px}
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn .n{font-weight:500;opacity:.8;margin-left:3px}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .status-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
  .pill.on{background:#e7f6ec;color:var(--accent2)}
  .pill.off{background:#fbeaea;color:var(--danger)}
  .pill.test{background:#fdf3e0;color:var(--warn)}
  /* Search + filter bar (Oct 21 2026): sticky under the header, everything client-side (no request while typing) */
  .searchbar{position:sticky;top:var(--hdr-h,60px);z-index:9;background:var(--bg);padding:8px 14px 6px;border-bottom:1px solid var(--border)}
  .searchbar .in{max-width:720px;margin:0 auto}
  .srow{display:flex;gap:8px;align-items:stretch}
  .sbox{position:relative;flex:1;min-width:0}
  .sbox input{padding-right:46px;min-height:44px}
  input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  .xbtn{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
  .fbtn{flex:none;white-space:nowrap}
  .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
  .btn.active .cnt{background:#fff;color:var(--accent)}
  .resline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .linkbtn{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;min-height:44px;padding:0 6px;cursor:pointer;font-family:inherit}
  .fpanel{margin-bottom:12px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fgrid .full{grid-column:1 / -1}
  .fgrid label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .fgrid > div{min-width:0}
  .fgrid select,.fgrid input{min-height:44px}
  .fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .bulkbar{margin-bottom:10px}
  .bb-row{display:flex;gap:8px;flex-wrap:wrap}
  .confirm{margin-top:10px;padding:10px;border-radius:10px;background:#fdf3e0;border:1px solid #ecd9a8;font-size:13px;line-height:1.5}
  .confirm .btn{margin:6px 6px 0 0}
  .banner{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.5}
  .banner.err{background:#fff4f4;border:1px solid #e9b4ac;color:#8a1f11}
  .banner.warn{background:#fdf3e0;border:1px solid #ecd9a8;color:#7a5b00}
  .banner .btn{margin-top:6px}
  .group-header{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:10px 0 4px;padding:6px 4px;border:0;background:none;text-align:left;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .group-header .chev{flex:none;width:14px;font-size:12px}
  .group-header .gl{flex:1;min-width:0;word-break:break-word}
  .group-header .gc{flex:none;font-weight:600}
  .group-header .gp{flex:none;background:#fdf3e0;color:var(--warn);border-radius:8px;padding:1px 7px;font-size:10px;letter-spacing:0;text-transform:none}
  .row-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:6px;align-items:flex-start}
  .ck{display:none;flex:none;width:44px;height:44px;margin:-10px 0 -10px -10px;align-items:center;justify-content:center;cursor:pointer}
  .ck input{width:22px;height:22px;margin:0}
  .row-card.bulk .ck{display:flex}
  .row-body{flex:1;min-width:0}
  .row-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row-name{font-weight:700;font-size:14px;word-break:break-word}
  .row-type{font-size:11px;color:var(--muted);word-break:break-word}
  .row-addr{font-size:11px;color:var(--muted);word-break:break-word}
  .row-msg{font-size:13px;line-height:1.5;margin:6px 0;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .row-meta{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-word}
  .row-gate{font-size:11px;color:var(--warn);margin-top:4px}
  .row-gate a{display:inline-block;min-height:44px;line-height:44px;font-weight:700;color:var(--accent,#1d4ed8);margin-left:4px}
  /* English view (Oct 13 2026): what a Spanish text says, so the review screen is readable */
  .row-en{font-size:13px;line-height:1.5;margin:4px 0 6px;padding:6px 9px;background:#eef6ff;border-left:3px solid #1d4ed8;border-radius:4px;white-space:pre-wrap;word-break:break-word}
  .row-en.err{background:#fff4f4;border-left-color:#c0392b;color:#8a1f11}
  .row-es-tag{display:inline-block;font-size:10px;font-weight:700;background:#fff3cd;color:#7a5b00;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.03em}
  .badge.pending{background:#fdf3e0;color:var(--warn)}
  .badge.sent{background:#e7f6ec;color:var(--accent2)}
  .badge.failed{background:#fbeaea;color:var(--danger)}
  .badge.skipped,.badge.unknown{background:var(--chip);color:var(--muted)}
  .more{width:100%;margin:2px 0 10px}
  .batch-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:20}
  .batch-bar > div{display:flex;gap:8px;flex:none}
  .empty{text-align:center;color:var(--muted);padding:34px 8px;font-size:14px;line-height:1.5}
  #login{max-width:360px;margin:70px auto;padding:20px;text-align:center}
  input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--surface);color:var(--text);font-family:inherit}
  .hide{display:none !important}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);max-width:92vw;background:#1c2430;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
<style id="mobile-input-font">
/* Ops_Build_Queue #96 (Oct 9 2026): inputs must be >=16px on touch screens or Android/iOS zoom the page on focus. Mouse/desktop density unchanged. */
@media (hover:none) and (pointer:coarse){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=submit]):not([type=button]):not([type=image]),select,textarea{font-size:16px !important}
}
</style>
</head>
<body>
<!-- RC-NAV: shared back-to-Hub bar (matches every other standalone tool page) -->
<div id="rc-navbar" style="position:static;z-index:9999;background:#1d4ed8;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow-x:auto;white-space:nowrap">
  <a href="index.html" style="color:#fff;text-decoration:none;display:flex;align-items:center;gap:4px;flex:none">← Hub</a>
</div>

<div id="login">
  <h1>Message Queue</h1>
  <p class="muted">Enter your Hub access code.</p>
  <input id="login-input" type="password" placeholder="Access code" autocomplete="current-password">
  <p id="login-error" class="hide" style="color:var(--danger);font-size:13px">Not recognized — try again.</p>
  <button class="btn primary" style="width:100%;margin-top:12px" onclick="doLogin()">Enter</button>
</div>

<div id="app" class="hide">
  <header id="hdr">
    <div class="hl">
      <h1>📱 Message Queue</h1>
      <div class="sub"><span id="loaded">Not loaded yet</span><span class="ver" id="ver"></span></div>
    </div>
    <button class="btn" id="refresh-btn" onclick="refreshList()">↻ Refresh</button>
  </header>

  <div class="searchbar" id="searchbar">
    <div class="in">
      <div class="srow">
        <div class="sbox">
          <input id="q" type="search" placeholder="Search messages…" title="Matches name, phone digits, address, message text, WO number, type" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search messages" oninput="onSearchInput()" onkeydown="onSearchKey(event)">
          <button class="xbtn hide" id="q-clear" aria-label="Clear search" onclick="clearSearch()">✕</button>
        </div>
        <button class="btn fbtn" id="filters-btn" aria-expanded="false" onclick="toggleFilters()">Filter &amp; sort<span class="cnt hide" id="fcount">0</span></button>
      </div>
      <div class="resline">
        <span id="result-count">Loading…</span>
        <button class="linkbtn hide" id="clear-filters" onclick="clearFilters()">Clear filters</button>
      </div>
    </div>
  </div>

  <main>
    <div id="banner"></div>

    <div class="card" style="padding:8px 12px;margin-bottom:8px">
      <div class="status-line" id="status-line">Loading status…</div>
    </div>

    <div class="tabs" id="status-tabs">
      <button class="btn small active" id="chip-pending" onclick="switchTab('pending')">Pending<span class="n" id="n-pending"></span></button>
      <button class="btn small" id="chip-sent" onclick="switchTab('sent')">Sent<span class="n" id="n-sent"></span></button>
      <button class="btn small" id="chip-skipped" onclick="switchTab('skipped')">Skipped<span class="n" id="n-skipped"></span></button>
      <button class="btn small" id="chip-failed" onclick="switchTab('failed')">Failed<span class="n" id="n-failed"></span></button>
      <button class="btn small" id="chip-all" onclick="switchTab('')">All<span class="n" id="n-all"></span></button>
      <button class="btn small" id="bulk-toggle-btn" style="margin-left:auto" onclick="toggleBulkMode()">☑ Select multiple</button>
    </div>

    <div class="card fpanel hide" id="filters-panel">
      <div class="fhead"><span>Filters <span class="muted" id="fpanel-count"></span></span><button class="btn small" id="clear-filters-top" onclick="clearFilters()">Clear filters</button></div>
      <div class="fgrid">
        <div class="full"><label class="fl" for="f-sort">Sort</label>
          <select id="f-sort" onchange="setSort(this.value)">
            <option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="recipient">Recipient A-Z</option><option value="property">Property A-Z</option><option value="status">Status</option>
          </select>
        </div>
        <div class="full"><label class="fl" for="f-group">Group by</label>
          <select id="f-group" onchange="setGroup(this.value)">
            <option value="prop">Property / recipient</option><option value="age">Age</option><option value="recipient">Recipient</option><option value="none">None (flat)</option>
          </select>
        </div>
        <div class="full"><label class="fl">Who</label>
          <div class="seg">
            <button class="btn small active" id="rt-all" onclick="setRType('')">All</button>
            <button class="btn small" id="rt-tenant" onclick="setRType('tenant')">Tenant</button>
            <button class="btn small" id="rt-vendor" onclick="setRType('vendor')">Vendor</button>
            <button class="btn small" id="rt-owner" onclick="setRType('owner')">Owner</button>
          </div>
        </div>
        <div class="full"><label class="fl" for="f-mtype">Message type</label><select id="f-mtype" onchange="setMType(this.value)"><option value="">All types</option></select></div>
        <div class="full"><label class="fl" for="f-prop">Property</label><select id="f-prop" onchange="setProp(this.value)"><option value="">All properties</option></select></div>
        <div class="full"><label class="fl" for="f-date">Date</label>
          <select id="f-date" onchange="setPreset(this.value)">
            <option value="">All time</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="custom">Custom range</option>
          </select>
        </div>
        <div><label class="fl" for="f-from">From</label><input id="f-from" type="date" onchange="setRange()"></div>
        <div><label class="fl" for="f-to">To</label><input id="f-to" type="date" onchange="setRange()"></div>
      </div>
    </div>

    <div class="card bulkbar hide" id="bulkbar">
      <div class="bb-row">
        <button class="btn" id="selall-btn" onclick="askSelectAll()">Select all shown</button>
        <button class="btn" onclick="clearSelection()">Clear selection</button>
      </div>
      <div class="confirm hide" id="selall-confirm"></div>
    </div>

    <div id="list"><div class="empty">Loading…</div></div>
  </main>

  <div class="batch-bar hide" id="batch-bar">
    <span class="muted" id="batch-count">0 selected</span>
    <div>
      <button class="btn" onclick="skipSelected()">Skip selected</button>
      <button class="btn go" onclick="releaseSelected()">Send selected</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var WORKER = 'https://maintenance-hub.brett-2f8.workers.dev';
var SECRET_KEY = 'mh_auth';
var PREF_KEY = 'mq_prefs_v1';          // cosmetic view preferences only (sort, group-by, status chip, collapsed groups)
var AUTH_TOKEN = '';
var TZ = 'America/New_York';
var PAGE_SIZE = 50;                    // rows drawn per open group before "Show more"
var all = [];                          // every active Message_Queue row, loaded ONCE per load (never per click)
var byId = {};
var loading = false, loadOk = false, loadErr = '', loadSeq = 0, lastLoaded = 0, badRows = 0;
var bulkMode = false;
var selected = {};                     // by row id; survives filter / search / group changes
var selAllConfirm = false;
var actionBusy = false;
var prefsOk = true;
var prefs = { sort: 'newest', group: 'prop', status: 'pending', ov: {} };
var F = { q: '', tokens: [], rtype: '', mtype: '', prop: '', preset: '', from: '', to: '' };
var ovSearch = {};                     // group open/closed taps made while a search/filter is active (in memory only)
var shownN = {};                       // "Show more" counters per group (in memory only)
var curGroups = [], lastView = null, renderedRows = [];
var translateBudget = 45;              // English-view lookups allowed per list load (same cap as before)
var searchTimer = null;
var SORTS = ['newest', 'oldest', 'recipient', 'property', 'status'];
var GROUPS = ['prop', 'age', 'recipient', 'none'];
var STATUSES = ['pending', 'sent', 'skipped', 'failed'];
var AGE_GROUPS = [
  { k: 'age0', label: 'Last 10 days' },
  { k: 'age1', label: '11–30 days' },
  { k: 'age2', label: '31–60 days' },
  { k: 'age3', label: '61–90 days' },
  { k: 'age4', label: 'Older than 90 days' }
];

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m, ms){ var t=el('toast'); t.textContent=m; t.className='toast show'; setTimeout(function(){t.className='toast';}, ms || 2400); }
// Anything that fails goes to the shared failure reporter (Needs Attention page); the console is the last resort.
function reportFail(where, msg){
  try {
    if (typeof window !== 'undefined' && typeof window.hubReportFailure === 'function') window.hubReportFailure('message-queue ' + where, msg);
    else console.error('[message-queue] ' + where + ': ' + msg);
  } catch (e) { console.error('[message-queue] could not report ' + where, e); }
}

function api(method, path, body){
  var opts = { method:method, headers:{'Content-Type':'application/json','X-Auth-Token':AUTH_TOKEN} };
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(function(res){
    return res.json().then(function(data){
      if (data && data.error === 'Unauthorized') throw new Error('Unauthorized');
      return data;
    }, function(){ throw new Error('The Hub answered HTTP ' + res.status + ' with something unreadable'); });
  });
}

// ── Stored values (storage can be blocked: private window, cleared site data, Chromebook policy) ─────────
function getStoredAuth(){
  try { return localStorage.getItem(SECRET_KEY) || ''; }
  catch (e) { prefsOk = false; return ''; }          // no stored code: the normal login box is shown
}
function loadPrefs(){
  try {
    var raw = localStorage.getItem(PREF_KEY); if (!raw) return;
    var p = JSON.parse(raw); if (!p || typeof p !== 'object') return;
    if (SORTS.indexOf(p.sort) >= 0) prefs.sort = p.sort;
    if (GROUPS.indexOf(p.group) >= 0) prefs.group = p.group;
    if (p.status === '' || STATUSES.indexOf(p.status) >= 0) prefs.status = p.status;
    if (p.ov && typeof p.ov === 'object') { Object.keys(p.ov).forEach(function(k){ prefs.ov[k] = !!p.ov[k]; }); }
  } catch (e) { prefsOk = false; }                    // cosmetic preference only: fall back to the defaults
}
function savePrefs(){
  try {
    var keys = Object.keys(prefs.ov);
    if (keys.length > 300) { keys.slice(0, keys.length - 300).forEach(function(k){ delete prefs.ov[k]; }); }
    localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
  } catch (e) { prefsOk = false; }                    // cosmetic preference only: the page keeps working unsaved
}

// ── Login (shares the Hub's stored code) ─────────────────────
// The first list request doubles as the access-code check, so a page load costs ONE read of the queue tab, not two.
function showLoginError(msg){ var e = el('login-error'); e.textContent = msg; e.classList.remove('hide'); }
function probe(){
  return api('GET','/message-queue').then(function(r){
    if (r && !Array.isArray(r) && r.error) throw new Error(r.error);
    return r;
  });
}
function doLogin(){
  var v = el('login-input').value.trim(); AUTH_TOKEN = v;
  probe().then(function(r){
    try { localStorage.setItem(SECRET_KEY, v); } catch (e) { toast('Signed in, but this browser would not remember the code.', 5000); }
    enterApp(r, null);
  }, function(err){
    AUTH_TOKEN = '';
    var m = err && err.message || 'error';
    if (m === 'Unauthorized') showLoginError('Not recognized — try again.');
    else { showLoginError('Could not check the code: ' + m); reportFail('login check', m); }
  });
}
function bootApp(){
  loadPrefs();
  el('login-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  var stored = getStoredAuth();
  if (!stored) return;
  AUTH_TOKEN = stored;
  probe().then(function(r){
    enterApp(r, null);
  }, function(err){
    var m = err && err.message || 'error';
    if (m === 'Unauthorized') { AUTH_TOKEN = ''; showLoginError('Your saved access code was not accepted — enter it again.'); }
    else { enterApp(null, m); }                        // the code is probably fine: open the page with a visible error + Retry
  });
}
function enterApp(list, err){
  el('login').style.display = 'none';
  el('app').classList.remove('hide');
  syncHeaderHeight();
  syncControls();
  api('GET','/version').then(function(d){ el('ver').textContent = (d && d.version) ? ('· ' + d.version) : ''; })
    .catch(function(e){ el('ver').textContent = '· version unavailable'; reportFail('version', e && e.message || 'error'); });
  loadStatus();
  if (err) listFailed(err); else applyList(list);
}
function syncHeaderHeight(){
  var h = el('hdr');
  if (h && h.offsetHeight && document.documentElement && document.documentElement.style) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight + 'px');
}
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', syncHeaderHeight);

// ── Global/Test Mode status strip ─────────────────────────────
function loadStatus(){
  api('GET','/health').then(function(h){
    var t = (h && h.twilio) || {};
    var box = el('status-line');
    var parts = [];
    parts.push('<span class="pill ' + (t.twilio_enabled ? 'on' : 'off') + '">Global: ' + (t.twilio_enabled ? 'ON — sending live' : 'OFF — nothing sends') + '</span>');
    parts.push('<span class="pill ' + (t.test_mode ? 'test' : 'on') + '">Test Mode: ' + (t.test_mode ? 'ON — redirects to your phone' : 'OFF — real recipients') + '</span>');
    var credsOk = t.sid_set && t.api_key_sid_set && t.api_key_secret_set && t.from_set;

// ── Load (ONE request per load; filters/tabs/search/sort/group never touch the network) ──────────────

}

}

  if (bad) reportFail('list rows', bad + ' entr' + (bad === 1 ? 'y' : 'ies') + ' in the message list could not be read');
  all = good; badRows = bad;

  Object.keys(selected).forEach(function(id){ if (!byId[id] || byId[id]._st !== 'pending') delete selected[id]; });

}

function toggleFilters(){
  var p = el('filters-panel'); var open = p.classList.contains('hide');
  p.classList.toggle('hide', !open); el('filters-btn').setAttribute('aria-expanded', open ? 'true' : 'false');
  el('filters-btn').className = 'btn fbtn' + (open ? ' active' : '');
}
function clearFilters(){
  F.q = ''; F.tokens = []; F.rtype = ''; F.mtype = ''; F.prop = ''; F.preset = ''; F.from = ''; F.to = '';
  el('q').value = ''; el('f-mtype').value = ''; el('f-prop').value = ''; syncControls();
  onFilterChange();
}
function applySearch(v){
  F.q = String(v || '').trim().toLowerCase();
  F.tokens = F.q ? F.q.split(/\s+/) : [];
  onFilterChange();
}
function onSearchInput(){
  var v = el('q').value;
  el('q-clear').classList.toggle('hide', !v);
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ searchTimer = null; applySearch(el('q').value); }, 150);
}
function onSearchKey(e){ if (e && e.key === 'Escape') clearSearch(); }
function clearSearch(){
  if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
  el('q').value = ''; applySearch('');
  if (el('q').focus) el('q').focus();
}
function toggleGroup(i){
  var g = curGroups[i]; if (!g) return;
  var k = okeyOf(g);
  if (narrowing()) ovSearch[k] = !g.open; else { prefs.ov[k] = !g.open; savePrefs(); }
  render();
}
function showMore(i){
  var g = curGroups[i]; if (!g) return;
  var k = okeyOf(g); shownN[k] = (shownN[k] || PAGE_SIZE) + PAGE_SIZE; render();
}

// ── English view: show what a Spanish vendor text says (Oct 13 2026) ─────────────────────
// Rows that carry the English original (Original_Body) show it straight away. Older vendor rows
// without one are sent to the Hub to translate (the Hub only translates text that reads as Spanish).
// A translation that can't be produced shows a visible warning + Retry — never a blank.
// Oct 21 2026: only rows that are actually drawn (open groups) are looked up, capped at 45 per list load;
// a vendor row past the cap shows a "Show English" button instead of being silently skipped.
var english = {};
function englishHtml(r){
  var saved = String(r.Original_Body || '').trim();
  var e = english[r.ID];
  var txt = saved || (e && e.english) || '';
  if (txt) return '<div class="row-en"><b>English:</b> ' + esc(txt) + '</div>';
  if (e && e.error) return '<div class="row-en err">⚠ English view unavailable — ' + esc(e.error) + ' <button class="btn small" onclick="retryEnglish(\'' + r.ID + '\')">Retry</button></div>';
  if (e && e.loading) return '<div class="row-en">Translating to English…</div>';
  return '';
}
function autoTranslate(){
  if (translateBudget <= 0) return;
  var need = renderedRows.filter(function(r){ return r.Recipient_Type === 'vendor' && !String(r.Original_Body || '').trim() && !english[r.ID]; }).map(function(r){ return r.ID; });
  need = need.slice(0, translateBudget);
  if (!need.length) return;
  translateBudget -= need.length;
  fetchEnglish(need);
}
function fetchEnglish(ids){
  var need = (ids || []).slice(0, 45);
  for (var i = 0; i < need.length; i += 15) (function(chunk){
    chunk.forEach(function(id){ english[id] = { loading: true }; });
    api('POST','/message-queue/translate',{ ids: chunk }).then(function(r){
      if (!r || r.error || !Array.isArray(r.results)) throw new Error((r && r.error) || 'bad response');
      r.results.forEach(function(x){ english[x.id] = x.english ? { english: x.english } : x.error ? { error: x.error } : { skipped: true }; });
      // A row the Hub didn't answer for must not sit on "Translating…" forever (silent stall).
      chunk.forEach(function(id){ if (english[id] && english[id].loading) english[id] = { error: 'the Hub returned no answer for this message' }; });
      renderList();
    }).catch(function(err){
      chunk.forEach(function(id){ english[id] = { error: 'could not reach the Hub (' + (err && err.message || 'error') + ')' }; });
      reportFail('english view', err && err.message || 'error');
      renderList();
    });
  })(need.slice(i, i + 15));
  if (need.length) renderList();
}
function retryEnglish(id){ delete english[id]; fetchEnglish([id]); }

// ── Bulk select (by id; survives filter/search/group changes) ───────────────────
function toggleBulkMode(){
  bulkMode = !bulkMode; selected = {}; selAllConfirm = false;
  render();
}
function toggleSelect(id, checked){
  if (checked) selected[id] = true; else delete selected[id];
  updateBatchBar();
}
// What a Send/Skip would touch: selected ids that still exist, are still pending AND are inside the current filter result.
function sendableIds(){
  var shown = {}; if (lastView) lastView.shown.forEach(function(r){ shown[r.ID] = true; });
  return Object.keys(selected).filter(function(id){ return byId[id] && byId[id]._st === 'pending' && shown[id]; });
}
function selectedExistingCount(){ return Object.keys(selected).filter(function(id){ return byId[id] && byId[id]._st === 'pending'; }).length; }
function updateBatchBar(){
  var send = sendableIds().length, total = selectedExistingCount(), hidden = total - send;
  el('batch-bar').classList.toggle('hide', !bulkMode || total === 0);
  el('batch-count').textContent = send + ' selected' + (hidden > 0 ? ' · ' + hidden + ' more hidden by filters (not included)' : '');
}
function shownPendingIds(){ return renderedRows.filter(function(r){ return r._st === 'pending' && r.ID; }).map(function(r){ return r.ID; }); }
function askSelectAll(){
  if (!shownPendingIds().length) { toast('No pending messages are shown right now.'); return; }
  selAllConfirm = true; renderConfirm();
}
function renderConfirm(){
  var box = el('selall-confirm'), n = shownPendingIds().length;
  if (!bulkMode || !n) selAllConfirm = false;
  if (!selAllConfirm) { box.classList.add('hide'); box.innerHTML = ''; return; }
  box.classList.remove('hide');
  box.innerHTML = 'Select all <b>' + n + '</b> pending message' + (n === 1 ? '' : 's') + ' shown on screen? Messages in closed groups or past “Show more” are not included.<br>' +
    '<button class="btn go" onclick="confirmSelectAll()">Yes, select ' + n + '</button><button class="btn" onclick="cancelSelectAll()">Cancel</button>';
}
function confirmSelectAll(){
  shownPendingIds().forEach(function(id){ selected[id] = true; });
  selAllConfirm = false; render();
}
function cancelSelectAll(){ selAllConfirm = false; renderConfirm(); }
function clearSelection(){ selected = {}; selAllConfirm = false; render(); }

// ── Actions ────────────────────────────────────────────────
function releaseOne(id){ releaseIds([id]); }
function skipOne(id){ skipIds([id]); }
function releaseSelected(){ releaseIds(sendableIds()); }
function skipSelected(){ skipIds(sendableIds()); }
function pendingOnly(ids){ return ids.filter(function(id){ return byId[id] && byId[id]._st === 'pending'; }); }

function releaseIds(ids){
  ids = pendingOnly(ids);
  if (!ids.length) { toast('Nothing to send — those messages are no longer pending.'); return; }
  if (actionBusy) { toast('Still working on the last tap — one moment.'); return; }
  actionBusy = true;
  api('POST','/message-queue/release',{ids:ids}).then(function(r){
    actionBusy = false;
    if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no answer from the Hub'), 6000); reportFail('send', (r && r.error) || 'no answer'); return; }
    var results = r.results || [];
    var sentCount = results.filter(function(x){return x.sent;}).length;
    var errs = results.filter(function(x){return x.error;});
    var heldCount = results.length - sentCount - errs.length;
    toast(sentCount + ' sent' + (heldCount ? ', ' + heldCount + ' still gated off' : '') + (errs.length ? ', ' + errs.length + ' error' + (errs.length === 1 ? '' : 's') + ': ' + errs[0].error : ''), errs.length ? 7000 : 2400);
    if (errs.length) reportFail('send', errs.length + ' message(s) could not be released: ' + errs[0].error);
    ids.forEach(function(id){ delete selected[id]; }); loadList();
  }).catch(function(e){ actionBusy = false; toast('Error: ' + (e && e.message || 'send failed'), 6000); reportFail('send', e && e.message || 'send failed'); });
}
function skipIds(ids){
  ids = pendingOnly(ids);
  if (!ids.length) { toast('Nothing to skip — those messages are no longer pending.'); return; }
  if (actionBusy) { toast('Still working on the last tap — one moment.'); return; }
  actionBusy = true;
  api('POST','/message-queue/skip',{ids:ids}).then(function(r){
    actionBusy = false;
    if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no answer from the Hub'), 6000); reportFail('skip', (r && r.error) || 'no answer'); return; }
    toast(ids.length + ' skipped');
    ids.forEach(function(id){ delete selected[id]; }); loadList();
  }).catch(function(e){ actionBusy = false; toast('Error: ' + (e && e.message || 'skip failed'), 6000); reportFail('skip', e && e.message || 'skip failed'); });
}

bootApp();
</script>
