<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ridge Co — Proposal</title>
<style>
:root{
  --bg:#eceef1;--surface:#ffffff;--surface2:#f3f5f8;--border:#dce0e6;
  --text:#1b1f24;--muted:#66707c;--accent:#1d4ed8;--accent2:#166534;
  --danger:#b42318;--warn:#b45309;--info:#1d4ed8;
  --radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;min-height:100vh;}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;}
.logo-text{color:var(--accent);font-size:1rem;letter-spacing:.15em;font-weight:bold;}
.print-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;font-weight:bold;padding:7px 12px;cursor:pointer;}
.main{padding:20px 16px 60px;max-width:640px;margin:0 auto;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.addr{font-size:1.1rem;font-weight:bold;margin-bottom:2px;}
.addr-sub{color:var(--muted);font-size:12px;}
.section-hd{color:var(--accent);font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--border);}
.section-hd:first-of-type{margin-top:6px;padding-top:0;border-top:none;}
.subhd{font-weight:bold;font-size:13.5px;margin:14px 0 4px;}
.subhd:first-child{margin-top:0;}
.body-text ul{margin:0 0 6px 20px;padding:0;}
.body-text li{margin-bottom:4px;}
.body-text p{margin-bottom:10px;}
.total-line{font-size:15px;font-weight:bold;}
.msg{margin:12px 0;padding:12px 14px;border-radius:6px;font-size:12px;line-height:1.6;}
.msg.error{background:#fdecea;border:1px solid var(--danger);color:var(--danger);}
.loading{text-align:center;color:var(--muted);padding:60px 20px;}
.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:20px;line-height:1.6;}
.hidden{display:none;}
@media print { .app-header .print-btn { display:none; } body{background:#fff;} .card{border:none;} }
</style>
</head>
<body>

<div class="app-header">
  <span class="logo-text">RIDGE CO</span>
  <button class="print-btn hidden" id="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="main">
  <div id="loading" class="loading">Loading your proposal…</div>
  <div id="content" class="hidden"></div>
</div>

<script>
var WORKER = 'https://maintenance-hub.brett-2f8.workers.dev';
var params = new URLSearchParams(window.location.search);
var TOKEN = params.get('t') || '';

function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function boldify(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

// Renders scopeProposal()'s plain-text doc (see worker.js) into readable HTML. Format is
// stable but not guaranteed — anything unexpected just falls back to a plain paragraph, so a
// future tweak to the generator text never breaks this page, it just renders a bit plainer.
function renderParagraph(para){
  var lines = para.split('\n').filter(function(l){ return l.length; });
  if (!lines.length) return '';
  var i = 0;
  var html = '';
  if (/^\*\*(.+)\*\*$/.test(lines[0].trim())) {
    html += '<div class="subhd">' + esc(lines[0].trim().replace(/^\*\*|\*\*$/g,'')) + '</div>';
    i = 1;
  }
  var rest = lines.slice(i);
  var allBullets = rest.length > 0 && rest.every(function(l){ return l.trim().indexOf('-') === 0; });
  if (allBullets) {
    html += '<ul>' + rest.map(function(l){ return '<li>' + boldify(esc(l.trim().replace(/^-\s*/,''))) + '</li>'; }).join('') + '</ul>';
    return html;
  }
  if (lines.length === 1 && lines[0].trim().length < 40 && /:$/.test(lines[0].trim())) {
    return '<div class="section-hd">' + esc(lines[0].trim()) + '</div>';
  }
  html += '<p>' + rest.map(function(l){
    var t = l.trim();
    if (/^Total Estimated Cost:/.test(t) || /^Required 50% Deposit:/.test(t)) return '<span class="total-line">' + boldify(esc(l)) + '</span>';
    return boldify(esc(l));
  }).join('<br>') + '</p>';
  return html;
}

function render(d){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('print-btn').classList.remove('hidden');
  var el = document.getElementById('content');
  el.classList.remove('hidden');

  var parts = String(d.proposal_text || '').split('\n\n');
  // First paragraph is the address, already shown in the header card below — skip re-showing it.
  if (parts.length && parts[0].trim() === String(d.address || '').trim()) parts.shift();

  var body = parts.map(renderParagraph).join('');

  el.innerHTML = '<div class="card">'
    + '<div class="addr">' + esc(d.address || '') + '</div>'
    + (d.title ? '<div class="addr-sub">' + esc(d.title) + '</div>' : '')
    + '</div>'
    + '<div class="card body-text">' + body + '</div>'
    + '<div class="footer-note">Questions about this proposal? Reply to the message this link came from, or contact Ridge Co directly.</div>';
}

if (!TOKEN){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  document.getElementById('content').innerHTML = '<div class="card"><div class="msg error">This link is missing its access code. Please use the link Ridge Co sent you.</div></div>';
} else {
  fetch(WORKER + '/scope-proposal/view?t=' + encodeURIComponent(TOKEN))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error){
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('content').innerHTML = '<div class="card"><div class="msg error">' + esc(d.message || 'This link is invalid or has expired.') + '</div></div>';
        return;
      }
      render(d);
    })
    .catch(function(){
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('content').innerHTML = '<div class="card"><div class="msg error">Could not load this proposal right now. Please try again shortly.</div></div>';
    });
}
</script>
</body>
</html>
