<style>
  :root{
    --bg:#f4f5f7; --surface:#fff; --border:#dfe3e8; --text:#1c2430; --muted:#6b7684;
    --accent:#1d4ed8; --accent2:#1a7f4b; --danger:#c0392b; --warn:#b8860b; --chip:#eef2f7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  header h1{font-size:18px;margin:0}
  header .ver{font-size:11px;color:var(--muted)}
  main{padding:14px 14px 60px;max-width:640px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .sec-title{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .muted{color:var(--muted);font-size:13px}
  .btn{padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.go{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .btn.ghost{background:transparent}
  .btn:active{opacity:.85}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted)}
  .pill.bad{background:#fbe5e2;color:var(--danger)}
  .pill.ok{background:#e7f6ec;color:var(--accent2)} .pill.due{background:#fdf3e0;color:var(--warn)} .pill.new{background:#eaf1fd;color:var(--accent)}
  input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:var(--surface);color:var(--text)}
  textarea{min-height:64px;resize:vertical}
  label.fld{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
  .grid2{display:flex;gap:8px}.grid2>div{flex:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
  .sheet h2{margin:2px 0 12px;font-size:18px}
  .dcard{border-top:1px solid var(--border);padding:12px 0}
  .dcard:first-child{border-top:none}
  .dtitle{font-weight:700}
  .dline{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .dline.notes{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .dtitle{overflow-wrap:anywhere;min-width:0}
  .card.review-card{border:2px solid var(--warn);background:#fff8e8}
  .dcard.review .dtitle{color:var(--danger)}
  .dcard.cancelled .dtitle{text-decoration:line-through;color:var(--muted)}
  .review-hint{font-size:13px;color:#7a5a00;margin:0 0 6px}
  .src-badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}
  .src-badge[data-src="email-watcher"]{background:#eaf1fd;color:var(--accent)}
  .driver-note{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:#fdf3e0;color:var(--warn)}
  /* Tenant RSVP (tenant answered the "can you be there" text). Declined is deliberately the loudest thing on the row. */
  .rsvp-line{margin-top:6px}
  .rsvp{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--chip);color:var(--muted)}
  .rsvp.yes{background:#e7f6ec;color:#14532d}
  .rsvp.unsure{background:#fdf3e0;color:#7a4b00}
  .rsvp.no{background:#b42318;color:#fff;font-size:13px;padding:3px 12px}
  .rsvp-when{font-size:12px;color:var(--muted);margin-left:6px}
  .rsvp-note{margin-top:4px;padding:6px 10px;border-left:3px solid var(--border);background:#f8f9fb;border-radius:0 8px 8px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .dcard.rsvp-declined{border-left:5px solid #b42318;padding-left:10px;background:#fff5f4}
  .dcard.rsvp-declined .rsvp-note{border-left-color:#b42318;background:#fff}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .hide{display:none}
  .banner{background:#eaf1fd;border:1px solid #cadcff;color:#274b8f;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  #login{max-width:360px;margin:70px auto;padding:20px;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>

<!-- Add / Edit delivery sheet -->

<script>
var WORKER = 'https://maintenance-hub.brett-2f8.workers.dev';
var SECRET_KEY = 'mh_auth';
var AUTH_TOKEN = '';
var DELS = [], TODAY = '';
var PROPS = [], UNITS = [], TENANTS = [];
var DELS_OK = false; // true only after /deliveries loaded cleanly (duplicate-order check depends on it)
var PREFILL = null; // from ?wo_id=&property_id=... when opened from a WO

function qs(k){ try{ return new URLSearchParams(window.location.search).get(k)||''; }catch(e){ return ''; } }
function api(method, path, body){
  var opts = { method:method, headers:{'Content-Type':'application/json','X-Auth-Token':AUTH_TOKEN} };
  if (body) opts.body = JSON.stringify(body);
  return fetch(WORKER + path, opts).then(function(res){
    return res.json().then(function(data){
      if (data && data.error === 'Unauthorized') throw new Error('Unauthorized');
      return data;
    });
  });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(function(){t.className='toast';},2400); }

// ── Login ────────────────────────────────────────────────────
function doLogin(){
  var v=document.getElementById('login-input').value.trim(); AUTH_TOKEN=v;
  api('GET','/deliveries').then(function(){ localStorage.setItem(SECRET_KEY,v); enterApp(); })
    .catch(function(){ AUTH_TOKEN=''; document.getElementById('login-error').classList.remove('hide'); });
}
document.getElementById('login-input').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
(function(){
  var stored=localStorage.getItem(SECRET_KEY);
  if(stored){ AUTH_TOKEN=stored; api('GET','/deliveries').then(enterApp).catch(function(){ AUTH_TOKEN=''; }); }
})();
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.remove('hide');
  api('GET','/version').then(function(d){ document.getElementById('ver').textContent=d.version||''; }).catch(function(){});
  loadEntities().then(function(){
    if (qs('wo_id') || qs('property_id')) { PREFILL = { wo_id:qs('wo_id'), property_id:qs('property_id'), unit_id:qs('unit_id'), tenant_id:qs('tenant_id') }; openAdd(); }
  });
  load();
}

// ── Load ─────────────────────────────────────────────────────
function loadEntities(){
  return Promise.all([
    api('GET','/properties').then(function(l){ PROPS=Array.isArray(l)?l:[]; }).catch(function(){ PROPS=[]; }),
    api('GET','/units').then(function(l){ UNITS=Array.isArray(l)?l:[]; }).catch(function(){ UNITS=[]; }),
    api('GET','/tenants').then(function(l){ TENANTS=Array.isArray(l)?l:[]; }).catch(function(){ TENANTS=[]; })
  ]);
}
function load(){
  return api('GET','/deliveries').then(function(d){
    if(!d || d.error || !Array.isArray(d.deliveries)) throw new Error((d&&d.error)||'unexpected response');
    DELS=d.deliveries; TODAY=d.today||''; DELS_OK=true;
    render();
  }).catch(function(e){ DELS_OK=false; document.getElementById('lists').innerHTML='<div class="banner" style="background:#fbe5e2;border-color:#f0b9b2;color:#8a2a1f">Could not load deliveries ('+esc(e&&e.message||'unknown error')+'). Reload the page to try again.</div>'; });
}
function statusPill(s){
  var done=['Delivered'], bad=['Cancelled','Needs Review'], warn=['Exception','Rescheduled'], live=['En-Route','Approaching','Arrived'];
  var cls='new'; if(bad.indexOf(s)>=0)cls='bad'; else if(done.indexOf(s)>=0)cls='ok'; else if(warn.indexOf(s)>=0)cls='due'; else if(live.indexOf(s)>=0)cls='due';
  return '<span class="pill '+cls+'">'+esc(s||'Ordered')+'</span>';
}
function whereText(d){
  var addr = d.delivery_address || [d.property_address, d.unit_label?('Unit '+d.unit_label):''].filter(Boolean).join(' ');
  return addr || '(no address)';
}
function relayTarget(d){
  if (d.onsite_contact==='tenant' && d.tenant_phone) return { phone:d.tenant_phone, name:(d.tenant_name||'tenant') };
  // a 'brett' row's onsite phone IS Brett's own number: never offer to relay to him, fall through to the tenant
  if (d.onsite_contact!=='brett' && d.onsite_contact_phone) return { phone:d.onsite_contact_phone, name:'on-site contact' };
  if (d.tenant_phone) return { phone:d.tenant_phone, name:(d.tenant_name||'tenant') };
  return null;
}
function relayText(d){
  var item = [d.item_type, d.make_model].filter(Boolean).join(' ') || 'your appliance';
  var when = d.expected_date ? ('on '+d.expected_date+(d.expected_window?(' ('+d.expected_window+')'):'')) : 'soon';
  var store = d.store ? (d.store+' ') : '';
  var name = (d.tenant_name||'').split(' ')[0];
  return (name?('Hi '+name+', '):'')+store+'is delivering '+item+' '+when+' to '+whereText(d)+'. Please plan to be available, and text us at this number if anything comes up. — Ridge Co';
}
function relay(id){
  var d=DELS.find(function(x){return x.id===id;}); if(!d) return;
  var tgt=relayTarget(d);
  if(!tgt||!tgt.phone){ toast('No phone on file for the contact'); return; }
  // CAP-036 #6 (Sep 24 2026): used to build an sms: URI that just opened the ADMIN's own
  // phone's messaging app — nothing was ever actually sent, and there was no email either.
  // Now actually sends via Twilio SMS (+ email, if the tenant has one on file) through the
  // real /delivery/relay endpoint. Prompt still lets the text be edited before it goes out.
  var msg = prompt('Send to '+tgt.name+' ('+tgt.phone+') by text'+(d.tenant_id?' (and email, if on file)':'')+':', relayText(d));
  if (msg === null) return;
  msg = msg.trim();
  if (!msg) { toast('Nothing sent — message was empty.'); return; }
  api('POST','/delivery/relay', { id: id, message: msg }).then(function(r){
    if (r && r.error) { toast('Could not send: '+r.error); return; }
    var parts = [r.sms_sent ? 'SMS sent' : 'SMS not sent'];
    if (r.email) parts.push(r.email_sent ? 'email sent' : 'email not sent');
    toast(parts.join(' · '));
  }).catch(function(e){ toast('Error: '+(e&&e.message||'unknown error')); });
}
function bucket(d){
  if(d.status==='Needs Review') return 'review';   // emails the watcher could not place: always on top, any date
  if(d.status==='Cancelled') return (d.expected_date && d.expected_date>=TODAY) ? 'cancelled' : 'done';
  if(d.status==='Delivered') return 'done';
  if(!d.expected_date) return 'nodate';
  if(d.expected_date===TODAY) return 'today';
  if(d.expected_date>TODAY) return 'upcoming';
  return 'past';
}
function render(){
  var el=document.getElementById('lists');
  if(!DELS.length){ el.innerHTML='<div class="card"><p class="muted">No deliveries yet. Tap <b>+ New delivery</b> to add one.</p></div>'; return; }
  var groups={ review:[], today:[], upcoming:[], cancelled:[], past:[], nodate:[], done:[] };
  DELS.forEach(function(d){ groups[bucket(d)].push(d); });
  var html='';
  html+=section('🔎 Needs review — emails I could not place', groups.review, false, 'review');
  html+=section('📦 Today', groups.today, true);
  html+=section('🗓 Upcoming', groups.upcoming, true);
  html+=section('🚫 Cancelled (upcoming)', groups.cancelled, false);
  html+=section('⚠ Past date — not yet delivered', groups.past, true);
  html+=section('📝 Needs a date', groups.nodate, true);
  html+=section('✓ Delivered / closed', groups.done, false);
  el.innerHTML=html||'<div class="card"><p class="muted">Nothing to show.</p></div>';
}
function section(title, arr, showRelay, kind){
  if(!arr.length) return '';
  var isRev = kind==='review';
  return '<div class="sec-title"'+(isRev?' id="sec-review" style="color:var(--danger)"':'')+'>'+title+' ('+arr.length+')</div>'
    + '<div class="card'+(isRev?' review-card':'')+'">'
    + (isRev?'<p class="review-hint">The watcher read these store emails but could not file them. Tap Edit to set the property and date, or remove the row if it is not a real delivery.</p>':'')
    + arr.map(function(d){ return dcard(d, showRelay); }).join('')+'</div>';
}
function contactLabel(d){
  var c = d.onsite_contact || 'tenant';
  if (c==='tenant') return d.tenant_name ? ('Tenant: '+esc(d.tenant_name)) : 'Tenant';
  var nm = String(c); nm = nm.charAt(0).toUpperCase()+nm.slice(1);
  return 'Meets: '+esc(nm);
}
function srcBadge(d){
  var s = String(d.source||''); if(!s) return '';
  var label = s==='email-watcher' ? '✉ email' : (s==='manual' ? 'manual' : s);
  return '<span class="src-badge" data-src="'+esc(s)+'" title="Source: '+esc(s)+'">'+esc(label)+'</span>';
}
// ── Tenant RSVP badge ────────────────────────────────────────────────────
// Worker fields: tenant_rsvp (''|Confirmed|Declined|Unsure), tenant_rsvp_at, tenant_rsvp_note. Unknown values are treated as "no answer".
function rsvpState(d){
  var v=String(d&&d.tenant_rsvp||'').trim().toLowerCase();
  if(v==='confirmed'||v==='yes') return 'yes';
  if(v==='declined'||v==='no') return 'no';
  if(v==='unsure') return 'unsure';
  return '';
}
function rsvpOpen(d){ return ['Delivered','Cancelled','Needs Review'].indexOf(d.status)<0; }
function rsvpWhen(s){
  s=String(s||'').trim(); if(!s) return '';
  var t=/^\d{4}-\d{2}-\d{2}T/.test(s)?new Date(s):null;
  if(!t||isNaN(t.getTime())) return s;      // not an ISO stamp: show it as stored rather than guess a time zone
  try{ return t.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return s; }
}
function rsvpBadge(d){
  var st=rsvpState(d), open=rsvpOpen(d);
  if(!st){
    if(!open) return '';
    var noticeKnown=('tenant_notice_sent_at' in d)||('tenant_notice_status' in d);
    if(noticeKnown){
      var asked=!!d.tenant_notice_sent_at||/^sent/i.test(String(d.tenant_notice_status||''));
      return '<div class="rsvp-line"><span class="rsvp" data-rsvp="'+(asked?'none':'not-asked')+'">'+(asked?'Tenant: No answer yet':'Tenant: not asked yet')+'</span></div>';
    }
    if(!d.tenant_name) return '';
    return '<div class="rsvp-line"><span class="rsvp" data-rsvp="none">Tenant: No answer yet</span></div>';
  }
  var label=st==='yes'?'✓ Tenant: Confirmed':(st==='no'?'✕ Tenant: Declined':'? Tenant: Unsure');
  var when=rsvpWhen(d.tenant_rsvp_at);
  var note=String(d.tenant_rsvp_note||'').trim();
  return '<div class="rsvp-line"><span class="rsvp '+st+'" data-rsvp="'+st+'">'+esc(label)+'</span>'
    +(when?'<span class="rsvp-when">'+esc(when)+'</span>':'')
    +'</div>'
    +(note?'<div class="rsvp-note" data-rsvp-note>“'+esc(note)+'”</div>':'');
}
function driverNote(d){
  return /Driver calls Brett/i.test(d.notes||'') ? '<div><span class="driver-note">📞 Driver calls: Brett</span></div>' : '';
}
function dcard(d, showRelay){
  var item=[d.item_type,d.make_model].filter(Boolean).join(' ')||(d.status==='Needs Review'?'Store email (not filed)':'(item?)');
  var win=d.expected_window?(' · '+esc(d.expected_window)):'';
  var contact = contactLabel(d);
  var wo = d.linked_wo_ids?(' · '+esc(d.linked_wo_ids)):'';
  var order = d.order_number?(esc(d.store||'')+' #'+esc(d.order_number)):esc(d.store||'');
  var tgt=relayTarget(d);
  var relayBtn = (showRelay && tgt) ? '<button class="btn small go" style="min-height:40px" onclick="relay(this.closest(\'.dcard\').getAttribute(\'data-id\'))">✉ Relay to tenant</button>' : '';
  var cls = d.status==='Needs Review' ? ' review' : (d.status==='Cancelled' ? ' cancelled' : '');
  if(rsvpState(d)==='no' && rsvpOpen(d)) cls += ' rsvp-declined';
  return '<div class="dcard'+cls+'" data-id="'+esc(d.id)+'">'
    + '<div class="row"><span class="dtitle">'+esc(item)+srcBadge(d)+'</span>'+statusPill(d.status)+'</div>'
    + '<div class="dline">'+esc(whereText(d))+(d.expected_date?(' · '+esc(d.expected_date)+win):'')+'</div>'
    + rsvpBadge(d)
    + '<div class="dline">'+contact+wo+(order?(' · '+order):'')+'</div>'
    + driverNote(d)
    + (d.notes?('<div class="dline notes">📝 '+esc(d.notes)+'</div>'):'')
    + '<div class="actions">'+relayBtn+'<button class="btn small" style="min-height:40px" onclick="openEdit(this.closest(\'.dcard\').getAttribute(\'data-id\'))">Edit</button></div>'
    + '</div>';
}

// ── Add / Edit ───────────────────────────────────────────────
function fillProps(){
  var s=document.getElementById('df-property');
  s.innerHTML='<option value="">— pick property —</option>'+PROPS.filter(function(p){return p.Active!=='FALSE';}).map(function(p){
    return '<option value="'+esc(p.ID)+'">'+esc(p.Address||('property '+p.ID))+'</option>';
  }).join('');
}
// CAP-036 #7 (Sep 24 2026) — combo-box: a known store fills #df-store (hidden) from the
// dropdown; "Other…" reveals the text input for anything not listed. #df-store's value is
// what formBody()/saveD() actually send — this is a manual-entry convenience layered on top,
// nothing else changes about what gets written to the Store column.
var KNOWN_STORES = ['Home Depot', "Lowe's", 'Ace Hardware', 'Walmart'];
function onStoreSelectChange(){
  var sel = document.getElementById('df-store-select').value;
  var inp = document.getElementById('df-store');
  if (sel === 'Other') { inp.style.display = ''; inp.value = ''; inp.focus(); }
  else { inp.style.display = 'none'; inp.value = sel; }
}
function syncStoreSelectFromValue(v){
  var sel = document.getElementById('df-store-select');
  var inp = document.getElementById('df-store');
  if (!v) { sel.value = ''; inp.style.display = 'none'; inp.value = ''; }
  else if (KNOWN_STORES.indexOf(v) >= 0) { sel.value = v; inp.style.display = 'none'; inp.value = v; }
  else { sel.value = 'Other'; inp.style.display = ''; inp.value = v; }
}
function onPropertyChange(){
  var pid=document.getElementById('df-property').value;
  var us=document.getElementById('df-unit');
  us.innerHTML='<option value="">— (whole property) —</option>'+UNITS.filter(function(u){return u.Active!=='FALSE'&&String(u.Property_ID)===String(pid);}).map(function(u){
    return '<option value="'+esc(u.ID)+'">'+esc(u.Unit_Label||('unit '+u.ID))+'</option>';
  }).join('');
  // auto-fill delivery address from property
  var p=PROPS.find(function(x){return String(x.ID)===String(pid);});
  var addr=document.getElementById('df-address'); if(p && !addr.value) addr.value=p.Address||'';
  fillTenants();
}
function onUnitChange(){ fillTenants(); }
function fillTenants(){
  var pid=document.getElementById('df-property').value, uid=document.getElementById('df-unit').value;
  var ts=document.getElementById('df-tenant');
  var list=TENANTS.filter(function(t){
    if(t.Active==='FALSE') return false;
    if(uid) return String(t.Unit_ID)===String(uid);
    if(pid) return String(t.Property_ID)===String(pid);
    return false;
  });
  ts.innerHTML='<option value="">— none —</option>'+list.map(function(t){
    return '<option value="'+esc(t.ID)+'">'+esc(((t.First_Name||'')+' '+(t.Last_Name||'')).trim()||('tenant '+t.ID))+'</option>';
  }).join('');
  if(list.length===1) ts.value=list[0].ID;
}
function resetForm(){
  ['df-store','df-order','df-model','df-dims','df-address','df-date','df-window','df-backup','df-backupphone','df-notes','df-woids'].forEach(function(id){ document.getElementById(id).value=''; });
  syncStoreSelectFromValue('');
  document.getElementById('df-item').value='';
  document.getElementById('df-onsite').value='tenant';
  fillProps();
  document.getElementById('df-property').value='';
  document.getElementById('df-unit').innerHTML='<option value="">— (whole property) —</option>';
  document.getElementById('df-tenant').innerHTML='<option value="">— none —</option>';
}
function openAdd(){
  document.getElementById('df-id').value='';
  document.getElementById('dm-title').textContent='New delivery';
  document.getElementById('df-editonly').classList.add('hide');
  document.getElementById('df-remove').classList.add('hide');
  document.getElementById('df-hint').classList.remove('hide');
  resetForm();
  if(PREFILL){
    if(PREFILL.property_id){ document.getElementById('df-property').value=PREFILL.property_id; onPropertyChange(); }
    if(PREFILL.unit_id){ document.getElementById('df-unit').value=PREFILL.unit_id; onUnitChange(); }
    if(PREFILL.tenant_id){ document.getElementById('df-tenant').value=PREFILL.tenant_id; }
    document.getElementById('df-woline').textContent = PREFILL.wo_id ? ('Linked to '+PREFILL.wo_id) : '';
    PREFILL._wo = PREFILL.wo_id;
  } else { document.getElementById('df-woline').textContent=''; }
  document.getElementById('d-modal').classList.add('open');
}
function openEdit(id){
  var d=DELS.find(function(x){return x.id===id;}); if(!d) return;
  document.getElementById('df-id').value=id;
  document.getElementById('dm-title').textContent='Edit delivery';
  document.getElementById('df-editonly').classList.remove('hide');
  document.getElementById('df-remove').classList.remove('hide');
  document.getElementById('df-hint').classList.add('hide');
  document.getElementById('df-woline').textContent='';
  fillProps();
  syncStoreSelectFromValue(d.store||'');
  document.getElementById('df-order').value=d.order_number||'';
  document.getElementById('df-item').value=d.item_type||'';
  document.getElementById('df-model').value=d.make_model||'';
  document.getElementById('df-dims').value=d.dims||'';
  document.getElementById('df-property').value=d.property_id||''; onPropertyChange();
  document.getElementById('df-unit').value=d.unit_id||''; onUnitChange();
  document.getElementById('df-tenant').value=d.tenant_id||'';
  document.getElementById('df-address').value=d.delivery_address||'';
  document.getElementById('df-date').value=d.expected_date||'';
  document.getElementById('df-window').value=d.expected_window||'';
  setSel('df-onsite', d.onsite_contact||'tenant');
  document.getElementById('df-backup').value=d.backup_contact||'';
  document.getElementById('df-backupphone').value=d.backup_phone||'';
  document.getElementById('df-notes').value=d.notes||'';
  setSel('df-status', d.status||'Ordered');
  document.getElementById('df-woids').value=d.linked_wo_ids||'';
  document.getElementById('d-modal').classList.add('open');
}
// Select value that is not one of the listed options (e.g. Onsite_Contact 'brett' from the email watcher, or a
// status added later) must round-trip: otherwise select.value silently becomes '' and Save would blank the field.
function setSel(id, val){
  var s = document.getElementById(id); val = val || '';
  Array.prototype.slice.call(s.querySelectorAll('option[data-dyn]')).forEach(function(o){ o.parentNode.removeChild(o); });
  if (val && !Array.prototype.some.call(s.options, function(o){ return o.value===val; })) {
    var o = document.createElement('option'); o.value = val; o.textContent = val; o.setAttribute('data-dyn','1'); s.appendChild(o);
  }
  s.value = val;
}
function closeD(){ document.getElementById('d-modal').classList.remove('open'); }
function formBody(){
  return {
    store:document.getElementById('df-store').value.trim(),
    order_number:document.getElementById('df-order').value.trim(),
    item_type:document.getElementById('df-item').value,
    new_make_model:document.getElementById('df-model').value.trim(),
    new_dims:document.getElementById('df-dims').value.trim(),
    property_id:document.getElementById('df-property').value,
    unit_id:document.getElementById('df-unit').value,
    tenant_id:document.getElementById('df-tenant').value,
    delivery_address:document.getElementById('df-address').value.trim(),
    expected_date:document.getElementById('df-date').value,
    expected_window:document.getElementById('df-window').value.trim(),
    onsite_contact:document.getElementById('df-onsite').value,
    backup_contact:document.getElementById('df-backup').value.trim(),
    backup_phone:document.getElementById('df-backupphone').value.trim(),
    delivery_notes:document.getElementById('df-notes').value.trim()
  };
}
function normOrder(o){ return String(o||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function dupOrder(order, exceptId){
  var k = normOrder(order); if(!k) return null;
  return DELS.find(function(x){ return String(x.id)!==String(exceptId||'') && normOrder(x.order_number)===k; }) || null;
}
function saveD(btn){
  var id=document.getElementById('df-id').value;
  if(!id){
    // CAP audit gap #8: warn (never block) when this Order # is already on the list. Runs BEFORE the button locks so Cancel leaves the form usable.
    var ord=document.getElementById('df-order').value.trim();
    if(ord){
      if(!DELS_OK){
        if(!confirm('The delivery list did not load, so I could not check whether order '+ord+' is already on it. Add it anyway?')) return;
      } else {
        var dup=dupOrder(ord);
        if(dup && !confirm('Order '+ord+' is already on the list ('+([dup.item_type,dup.make_model].filter(Boolean).join(' ')||'item?')+' · '+(dup.expected_date||'no date')+' · '+(dup.status||'Ordered')+').\n\nAdd another delivery with the same order number?')) return;
      }
    }
  }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Saving…';
  if(id){
    var f=formBody();
    var fields={ Store:f.store, Order_Number:f.order_number, Item_Type:f.item_type, New_Make_Model:f.new_make_model, New_Dims:f.new_dims,
      Property_ID:f.property_id, Unit_ID:f.unit_id, Tenant_ID:f.tenant_id, Delivery_Address:f.delivery_address,
      Expected_Date:f.expected_date, Expected_Window:f.expected_window, Onsite_Contact:f.onsite_contact,
      Backup_Contact:f.backup_contact, Backup_Phone:f.backup_phone, Delivery_Notes:f.delivery_notes,
      Status:document.getElementById('df-status').value, Linked_WO_IDs:document.getElementById('df-woids').value.trim() };
    api('POST','/delivery/update',{ id:id, fields:fields }).then(function(r){
      btn.disabled=false; btn.textContent='Save';
      if(r&&r.success){ toast('Saved'); closeD(); load(); } else toast((r&&r.error)||'Could not save');
    }).catch(function(e){ btn.disabled=false; btn.textContent='Save'; toast('Error: '+e.message); });
  } else {
    var body=formBody();
    if(PREFILL && PREFILL._wo) body.linked_wo_ids=PREFILL._wo;
    body.source='manual';
    api('POST','/delivery/add',body).then(function(r){
      btn.disabled=false; btn.textContent='Save';
      if(r&&r.success){ toast('Delivery added'+(r.wo_id?(' · '+r.wo_id+' created'):'')); PREFILL=null; closeD(); load(); }
      else toast((r&&r.error)||'Could not add');
    }).catch(function(e){ btn.disabled=false; btn.textContent='Save'; toast('Error: '+e.message); });
  }
}
function removeD(){
  var id=document.getElementById('df-id').value; if(!id) return;
  if(!confirm('Remove this delivery? The linked work order stays intact.')) return;
  api('POST','/delivery/update',{ id:id, fields:{ Active:'FALSE' } }).then(function(r){
    if(r&&r.success){ toast('Removed'); closeD(); load(); } else toast((r&&r.error)||'Could not remove');
  }).catch(function(e){ toast('Error: '+e.message); });
}
</script>
