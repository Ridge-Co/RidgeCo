name: Message Queue Sweep

# Replaces Cloudflare Cron Triggers for time-sensitive message processing (quiet-hours-held
# SMS sends, deferred appointment-reminder notifications). Cloudflare caps Cron Triggers at
# 3 (free) / 5 (paid) per Worker, and all 4 paid-tier slots are already used (daily digest,
# 2x weekly optimizer review, weekly AR report) — so this runs from GitHub Actions instead,
# which is free with no practical run-count limit on a public repo. Same pattern already
# proven by selftest-invoice.yml (the Invoice OCR Canary).
#
# Secrets: CRON_SWEEP_TOKEN only — a dedicated, narrow-scope token, deliberately NOT
# WORKER_SECRET (see the security note in CLAUDE.md: don't widen that shared key). This
# token is accepted ONLY for POST /cron/sweep — nothing else.
#
# What it actually processes (see cronSweep() in worker.js):
#   1. Quiet-hours-held tenant/vendor SMS (held for 7pm-9am ET, now due).
#   2. Deferred appointment-reminder notifications (Notification_Queue) — this existed before
#      but was never wired to anything automatic; this workflow is what actually fires it now.

on:
  # Sep 20 2026: this used to ALSO fire on a schedule (every 15 min), racing the Cloudflare
  # Cron Trigger in wrangler.toml, which independently calls the same /cron/sweep endpoint on
  # the same cadence. Both firing within seconds of each other caused a real incident: a vendor
  # (Eddie Smith, WO-1195) got the same "please submit your invoice" SMS twice in one afternoon
  # because two overlapping sweeps both read the vendor-nudge state as "not yet sent" before
  # either had a chance to mark it sent. Fixed properly in cronSweep() (worker.js) with a
  # Sheets-Config single-flight claim that makes any second sweep within the claim window a
  # no-op — but the redundant trigger itself served no purpose once the Cloudflare Cron Trigger
  # covers the schedule, so it's removed here rather than left as a harmless-but-wasteful ping.
  workflow_dispatch:          # manual/on-demand only — the Cloudflare Cron Trigger (wrangler.toml)
                              # is now the only automatic caller of /cron/sweep.

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the sweep endpoint
        env:
          CRON_SWEEP_TOKEN: ${{ secrets.CRON_SWEEP_TOKEN }}
        run: |
          if [ -z "$CRON_SWEEP_TOKEN" ]; then
            echo "CRON_SWEEP_TOKEN not set as a GitHub Actions secret yet — nothing to do."
            echo "Add it under Settings > Secrets and variables > Actions once Brett has also"
            echo "set the matching Cloudflare Worker secret of the same name."
            exit 0
          fi
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://maintenance-hub.brett-2f8.workers.dev/cron/sweep" \
            -H "X-Auth-Token: $CRON_SWEEP_TOKEN")
          echo "HTTP $http_code"
          cat response.json
          if [ "$http_code" != "200" ]; then
            echo "Sweep endpoint did not return 200 — see response above."
            exit 1
          fi
