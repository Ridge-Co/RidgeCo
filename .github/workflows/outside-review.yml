# Outside code reviewer (Open Code Review + Gemini). Advisory only: posts PR comments, never blocks merge.
# Runs on every code PR into main AND staging, so problems surface before staging testing.
name: Outside Review
on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]
    paths: ['worker.js','*.html','src/**','test/**','scripts/**']
concurrency:
  group: outside-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: ${{ vars.OUTSIDE_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Pinned to the audited commit (Sep 2026 vet: no Alibaba endpoints, telemetry off by default).
      - uses: alibaba/open-code-review@a758d9cbfb689937c7857ad64b2dd66adb58c0c2
        with:
          llm_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
          llm_auth_token: ${{ secrets.GEMINI_REVIEW_KEY }}
          llm_model: ${{ vars.OUTSIDE_REVIEW_MODEL || 'gemini-3.5-flash-lite' }}
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          ocr_version: '1.12.11'
          rule: .opencodereview/rule.json
          background: 'Cloudflare Worker (worker.js) + static HTML portals backed by Google Sheets. See context/FEATURE_LOG.md regression rules.'
