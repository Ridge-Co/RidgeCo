<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrettOS — Optimizer Proposals</title>
<style>
  :root{--bg:#e9ebef;--card:#fff;--ink:#0e1621;--muted:#5b6672;--line:#d8dce2;
    --green:#1a8f4c;--greenbg:#e6f4ec;--amber:#b26a00;--amberbg:#fbf0dd;
    --red:#c0242b;--redbg:#f9e4e4;--blue:#1f5fbf;--bluebg:#e7effb;
    --shadow:0 1px 2px rgba(16,23,32,.08),0 1px 8px rgba(16,23,32,.04);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.4;padding-bottom:96px}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px}
  .title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .title small{font-weight:600;color:var(--muted);font-size:12px;margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
  .pcard{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;box-shadow:var(--shadow)}
  .pcard.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
  .pcard input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--blue)}
  .pbody{flex:1;min-width:0}
  .prow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rank{font-size:12px;font-weight:800;color:var(--muted)}
  .ptitle{font-size:15px;font-weight:800}
  .chip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .chip.big{background:var(--greenbg);color:var(--green)} .chip.quick{background:var(--bluebg);color:var(--blue)}
  .chip.fix{background:var(--amberbg);color:var(--amber)} .chip.eff{background:#eef0f3;color:#42505e}
  .pprob{font-size:13px;color:#26313d;margin:6px 0 0}
  .pact{font-size:13px;color:var(--ink);margin:5px 0 0;font-weight:600}
  .pimp{font-size:12px;color:var(--muted);margin:4px 0 0}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;box-shadow:var(--shadow)}
  .banner{background:var(--amberbg);color:var(--amber);border:1px solid #f0d9ad;border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:700;margin:8px 0}
  .modal{display:none;position:fixed;inset:0;background:rgba(14,22,33,.45);z-index:50;padding:14px}
  .modal .box{max-width:560px;margin:20px auto;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .modal textarea{width:100%;height:44vh;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:6px;color:var(--ink)}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
  .mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--ink)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px;box-shadow:0 -2px 12px rgba(16,23,32,.08)}
  .bar .wrap{padding:0 12px}
  .go{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;background:var(--blue);color:#fff}
  .go:disabled{background:#c7ccd3;color:#fff}
  .q{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
  .q:last-child{border-bottom:none}
  .qs{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--greenbg);color:var(--green);flex:none}
  .spin{color:var(--muted);font-size:13px;padding:16px 2px}
  .tokbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
  .tokbar input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;margin:6px 0}
  .tokbar button{width:100%;border:none;border-radius:9px;padding:11px;font-weight:700;background:var(--blue);color:#fff}
  a.back{color:var(--blue);font-size:12.5px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="title">🧭 Optimizer Proposals <small id="asof"></small></div>
    <a class="back" href="command-center.html">← Command Center</a></header>
  <div id="body"><div class="spin">Loading…</div></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="wrap">
  <button class="go" id="go" onclick="approveSel()" disabled>Approve selected</button>
</div></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="box">
  <div class="prow" style="justify-content:space-between;align-items:center"><b id="mtitle">Build brief</b><button class="mini" onclick="closeModal()">Close</button></div>
  <div id="mmsg" class="sub" style="margin:6px 0"></div>
  <textarea id="mtext" readonly></textarea>
  <button class="go" style="margin-top:10px" onclick="copyFromModal()">📋 Copy to clipboard</button>
</div></div>
<script>
const _p=new URLSearchParams(location.search);
const STAGING=_p.has('staging');
const WORKER=STAGING?'https://maintenance-hub-staging.brett-2f8.workers.dev':'https://maintenance-hub.brett-2f8.workers.dev';
const AUTH_KEY=STAGING?'mh_auth_staging':'mh_auth';
let TOKEN=''; try{TOKEN=localStorage.getItem(AUTH_KEY)||''}catch(e){}
let PROPOSALS=[], REVIEW_TS='';
function h(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function getJSON(path){const r=await fetch(WORKER+path,{headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN}});const t=await r.text();let d=null;try{d=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(path+' → HTTP '+r.status+' '+((d&&d.error)||t.slice(0,80)));if(d&&d.error)throw new Error(d.error);return d;}
function chip(tag){const t=(tag||'').toUpperCase();if(t.indexOf('QUICK')>=0)return '<span class="chip quick">QUICK WIN</span>';if(t.indexOf('FIX')>=0)return '<span class="chip fix">FIXES EXISTING</span>';if(t.indexOf('BIG')>=0)return '<span class="chip big">BIG GAIN</span>';return t?'<span class="chip eff">'+h(t)+'</span>':'';}

async function load(){
  if(!TOKEN){ document.getElementById('body').innerHTML='<div class="tokbar"><b>Connect</b><div class="sub">Paste your Hub access code (mh_auth) to load proposals.</div><input id="tok" type="password" placeholder="access code"><button onclick="saveTok()">Connect</button></div>'; return; }
  let rev=null,q=null;
  try{ rev=await getJSON('/ops-review-log?limit=1'); }catch(e){ document.getElementById('body').innerHTML='<div class="card"><b>Couldn’t load</b><div class="sub">'+h(e.message)+'</div></div>'; return; }
  try{ q=await getJSON('/ops-queue'); }catch(e){ q=null; }
  render(rev,q);
}
function render(rev,q){
  const row=(rev&&rev.rows&&rev.rows[0])||null;
  let items=[];
  if(row&&row.Proposal_JSON){ try{ items=JSON.parse(row.Proposal_JSON)||[]; }catch(e){ items=[]; } }
  PROPOSALS=items; REVIEW_TS=(row&&row.Timestamp)||'';
  document.getElementById('asof').textContent=REVIEW_TS?('· '+REVIEW_TS.slice(0,10)):'';
  let html='';
  if(!row){ html='<div class="card"><b>No review yet</b><div class="sub">Run a review from the Command Center first.</div></div>'; document.getElementById('body').innerHTML=html; return; }
  html+='<div class="card"><h2>This week’s review</h2><div class="sub">'+h(row.Total_Jobs||'0')+' jobs · success '+pct(row.Success_Rate)+' · escalation '+pct(row.Escalation_Rate)+(row.Stuck_Patterns?' · ⚠ '+h(row.Stuck_Patterns):'')+'</div></div>';
  const totJobs=parseInt(row.Total_Jobs||'0')||0;
  if(totJobs<20) html+='<div class="banner">⚠ Directional only — thin data ('+totJobs+' telemetry rows; a confident review wants 20+). Treat these as hypotheses to sanity-check, not conclusions.</div>';
  if(items.length){
    html+='<div class="ctrls"><button class="mini" onclick="pick(3)">Top 3</button><button class="mini" onclick="pick(5)">Top 5</button><button class="mini" onclick="pick(99)">All</button><button class="mini" onclick="pick(0)">Clear</button></div>';
    items.forEach((it,i)=>{
      html+='<label class="pcard" id="pc'+i+'"><input type="checkbox" data-i="'+i+'" onchange="syncSel()">'
        +'<div class="pbody"><div class="prow"><span class="rank">#'+(it.rank||i+1)+'</span><span class="ptitle">'+h(it.title||'')+'</span></div>'
        +'<div class="prow" style="margin-top:4px">'+chip(it.tag)+(it.effort?'<span class="chip eff">'+h(it.effort)+' effort</span>':'')+'</div>'
        +(it.problem?'<div class="pprob">'+h(it.problem)+'</div>':'')
        +(it.action?'<div class="pact">→ '+h(it.action)+'</div>':'')
        +(it.impact?'<div class="pimp">Impact: '+h(it.impact)+'</div>':'')
        +'</div></label>';
    });
    document.getElementById('bar').style.display='block';
  } else {
    // older review or parse fallback — show the full text
    html+='<div class="card"><h2>Proposal</h2><div class="sub" style="white-space:pre-wrap;color:var(--ink);font-size:13.5px">'+h(row.Proposal||'(none)')+'</div><div class="sub" style="margin-top:8px">This review isn’t in the selectable format yet — run a fresh review from the Command Center to get checkboxes.</div></div>';
  }
  // Greenlit build queue — full detail, copyable brief, status control. No longer a read-once dead end.
  const queue=(q&&q.queue)||[]; window.__queue=queue;
  if(queue.length){
    html+='<div class="card"><div class="prow" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Greenlit — build queue ('+queue.length+')</h2><button class="mini" onclick="copyAll()">📋 Copy all</button></div>'
      +'<div class="sub" style="margin:4px 0 0">Full detail below. Tap <b>Copy build brief</b>, paste it into a Claude session, and it builds from that — no worker secret needed. Mark items <b>building</b> / <b>done</b> to keep the list live.</div></div>';
    queue.forEach((x,qi)=>{
      const st=(x.Status||'greenlit').toLowerCase();
      html+='<div class="qcard" id="qc'+qi+'">'
        +'<div class="prow"><span class="rank">#'+h(x.Rank||'')+'</span><span class="ptitle">'+h(x.Title||'')+'</span></div>'
        +'<div class="prow" style="margin-top:4px"><span class="qs">'+h(st)+'</span>'+chip(x.Tag)+(x.Effort?'<span class="chip eff">'+h(x.Effort)+' effort</span>':'')+'</div>'
        +(x.Problem?'<div class="pprob">'+h(x.Problem)+'</div>':'')
        +(x.First_Step?'<div class="pact">→ '+h(x.First_Step)+'</div>':'')
        +(x.Impact?'<div class="pimp">Impact: '+h(x.Impact)+'</div>':'')
        +'<div class="ctrls" style="margin-top:9px">'
        +'<button class="mini" onclick="copyOne('+qi+')">📋 Copy build brief</button>'
        +(st!=='building'?'<button class="mini" onclick="setStatus('+h(jsq(x.ID))+',\'building\')">▶ Building</button>':'')
        +'<button class="mini" onclick="setStatus('+h(jsq(x.ID))+',\'done\')">✓ Done</button>'
        +'<button class="mini" onclick="setStatus('+h(jsq(x.ID))+',\'dropped\')">✕ Drop</button>'
        +'</div></div>';
    });
  }
  document.getElementById('body').innerHTML=html;
  syncSel();
}
function pct(x){const n=parseFloat(x);return Number.isFinite(n)?Math.round(n*100)+'%':'n/a';}
function pick(n){document.querySelectorAll('#body input[type=checkbox]').forEach(cb=>{const i=+cb.getAttribute('data-i');cb.checked=(n>=99)?true:(n===0?false:(PROPOSALS[i]&&(PROPOSALS[i].rank||i+1)<=n));});syncSel();}
function syncSel(){let n=0;document.querySelectorAll('#body input[type=checkbox]').forEach(cb=>{const card=document.getElementById('pc'+cb.getAttribute('data-i'));if(cb.checked){n++;card&&card.classList.add('sel');}else{card&&card.classList.remove('sel');}});const g=document.getElementById('go');g.disabled=!n;g.textContent=n?('Approve '+n+' → queue for build'):'Approve selected';}
function selected(){const out=[];document.querySelectorAll('#body input[type=checkbox]:checked').forEach(cb=>{const it=PROPOSALS[+cb.getAttribute('data-i')];if(it)out.push(it);});return out;}
async function approveSel(){
  const items=selected(); if(!items.length)return;
  const g=document.getElementById('go'); g.disabled=true; g.textContent='Queueing…';
  try{
    const r=await fetch(WORKER+'/ops-approve',{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:JSON.stringify({items,review_ts:REVIEW_TS})});
    const d=await r.json(); if(!r.ok||!d||d.ok!==true) throw new Error((d&&d.error)||('HTTP '+r.status));
    g.textContent='✓ Queued '+d.queued;
    setTimeout(load,700);
  }catch(e){ g.disabled=false; g.textContent='Failed — '+(e&&e.message||e); }
}
function saveTok(){const v=document.getElementById('tok').value.trim();if(!v)return;TOKEN=v;try{localStorage.setItem(AUTH_KEY,v)}catch(e){}document.getElementById('body').innerHTML='<div class="spin">Connecting…</div>';load();}

// ── Greenlit → build bridge ──────────────────────────────────────────────
// Headless Claude can't read the authed queue (no worker secret). So the item comes to
// Claude instead: this renders a clean build brief you copy and paste into a session.
function jsq(s){return JSON.stringify(String(s==null?'':s));}
function brief(x){
  return '## '+(x.Title||'(untitled)')+'\n'
    +'- Rank: #'+(x.Rank||'')+(x.Tag?'  ·  '+x.Tag:'')+(x.Effort?'  ·  '+x.Effort+' effort':'')+'\n'
    +(x.Problem?'- Problem: '+x.Problem+'\n':'')
    +(x.First_Step?'- First step: '+x.First_Step+'\n':'')
    +(x.Impact?'- Impact: '+x.Impact+'\n':'')
    +(x.Review_TS?'- From review: '+String(x.Review_TS).slice(0,10)+'\n':'')
    +'- Queue ID: '+(x.ID||'')+'\n';
}
function copyOne(qi){const x=(window.__queue||[])[qi];if(!x)return;openModal('Build brief — '+(x.Title||''),brief(x),'Paste this into a Claude session to build it.');}
function copyAll(){const qs=window.__queue||[];if(!qs.length)return;const text='# BrettOS — greenlit build queue ('+qs.length+' items)\n\n'+qs.map(brief).join('\n');openModal('All greenlit ('+qs.length+')',text,'Paste into a Claude session — this is the full build backlog.');}
function openModal(title,text,msg){document.getElementById('mtitle').textContent=title;document.getElementById('mtext').value=text;document.getElementById('mmsg').textContent=msg||'';document.getElementById('modal').style.display='block';tryCopy(text);}
function closeModal(){document.getElementById('modal').style.display='none';}
function tryCopy(text){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){var m=document.getElementById('mmsg');if(m)m.textContent='✓ Copied to clipboard. (Or select the text below to copy manually.)';},function(){});}}catch(e){}}
function copyFromModal(){const t=document.getElementById('mtext');t.focus();t.select();try{document.execCommand('copy')}catch(e){}tryCopy(t.value);document.getElementById('mmsg').textContent='✓ Copied (or long-press the text → Copy).';}
// Lifecycle: greenlit → building → done | dropped. Keeps the queue live (done/dropped drop off).
async function setStatus(id,status){
  if(status==='dropped'&&!confirm('Drop this item from the build queue?'))return;
  try{
    const r=await fetch(WORKER+'/ops-queue-update',{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:JSON.stringify({id:id,status:status})});
    const d=await r.json().catch(function(){return null;});
    if(!r.ok||!d||(d.success!==true&&d.ok!==true)) throw new Error((d&&d.error)||('HTTP '+r.status));
    load();
  }catch(e){ alert('Update failed — '+(e&&e.message||e)); }
}
load();
</script>
<!-- B-093 auto-refresh: poll /version, refresh onto new code (idle=auto, mid-entry=tap banner).
     Added because a stale cached copy of THIS page (pre-greenlit-build, no status buttons) left
     Brett unable to tap anything but checkboxes — the page now self-updates when the Worker version changes. -->
<script>
(function(){
  var VER_URL = WORKER + '/version', booted = null;
  function dirty(){
    var el = document.activeElement;
    if (el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') && el.value) return true;
    if (document.getElementById('modal') && document.getElementById('modal').style.display==='block') return true;
    return false;
  }
  function banner(){
    if (document.getElementById('mh-upd-banner')) return;
    var b = document.createElement('div');
    b.id = 'mh-upd-banner';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#0b8a3e;color:#fff;padding:13px 16px;text-align:center;font:600 15px system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
    b.textContent = 'Update ready — tap to refresh';
    b.onclick = function(){ location.reload(true); };
    document.body.appendChild(b);
  }
  function check(){
    fetch(VER_URL, {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if (!d || !d.version) return;
      if (booted === null){ booted = d.version; return; }
      if (d.version !== booted){ dirty() ? banner() : location.reload(true); }
    }).catch(function(){});
  }
  check();
  setInterval(check, 60000);
})();
</script>
</body>
</html>
