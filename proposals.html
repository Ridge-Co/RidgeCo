<!DOCTYPE html>
<html lang="en">
<head>
<script src="test-login.js"></script>
<script src="failure-reporter.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrettOS — Proposals and build queue</title>
<style>
  /* Queue v2 (Nov 16 2026). Fluid layout: one column under 700px, two columns of cards from 700px, a board with one column per
     stage group plus a detail pane from 1101px. No fixed-pixel page column. No text under 13px. Colours pass 4.5:1 on their backgrounds. */
  :root{--bg:#e9ebef;--card:#fff;--ink:#0e1621;--muted:#4a5561;--line:#cfd4db;--colbg:#dfe3e8;
    --green:#0f6b36;--greenbg:#e3f3ea;--amber:#7a4700;--amberbg:#fbf0dd;
    --red:#a11a21;--redbg:#f9e4e4;--blue:#1a3fb0;--bluebg:#e7effb;--grey:#39434f;--greybg:#eef0f3;
    --shadow:0 1px 2px rgba(16,23,32,.08),0 1px 8px rgba(16,23,32,.04);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.4;padding-bottom:120px}
  .wrap{width:100%;padding:0 clamp(10px,1.6vw,28px)}
  header{padding:12px 0 4px}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:800;margin:0}
  h2{font-size:16px;font-weight:800;margin:0}
  .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
  a.back{color:var(--blue);font-size:14px;font-weight:700;margin-left:auto}
  .counts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:8px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:14px;color:var(--ink)}
  .stat b{font-size:16px}
  .stat.warn{background:var(--amberbg);border-color:#e6cf9f;color:var(--amber)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 8px}
  .filters label{font-size:14px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
  input[type=search],input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid #8b96a3;border-radius:9px;padding:7px 9px;max-width:100%}
  #qsearch{flex:1 1 220px;min-width:0}
  input.days{width:76px}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid #8b96a3;background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:700;min-height:36px}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff}
  .btn.danger{color:var(--red);border-color:var(--red)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--blue);text-decoration:underline}
  .btn:disabled{opacity:.55;cursor:default}
  .tog[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:inline-flex;gap:0}
  .seg button{border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:9px 0 0 9px;margin-left:0}
  .seg button:last-child{border-radius:0 9px 9px 0}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #1a3fb0;outline-offset:2px}

  .board{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .col{min-width:0}
  .colhead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .count{background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:800}
  .cards{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .empty{font-size:14px;color:var(--muted);padding:8px 2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);min-width:0}
  .card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
  .card.pinned{border-left:5px solid var(--amber)}
  .chead{display:flex;gap:6px;align-items:flex-start}
  .pick{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;flex:none}
  .pick input{width:20px;height:20px;accent-color:var(--blue);margin:0}
  .ctitle{flex:1;min-width:0;text-align:left;background:none;border:none;padding:2px 0;color:var(--ink);font-size:15px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
  .ctitle .rank{color:var(--muted);font-weight:800;margin-right:4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
  .chip{font-size:13px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--greybg);color:var(--grey);max-width:100%;overflow-wrap:anywhere}
  .chip.safe,.chip.s-live,.chip.s-done,.chip.s-merged{background:var(--greenbg);color:var(--green)}
  .chip.gated,.chip.s-blocked,.chip.stuck,.chip.s-dropped{background:var(--redbg);color:var(--red)}
  .chip.s-building,.chip.s-queued,.chip.pin,.chip.s-snoozed{background:var(--amberbg);color:var(--amber)}
  .chip.s-pr_open,.chip.s-approved,.chip.s-review{background:var(--bluebg);color:var(--blue)}
  a.chip{text-decoration:underline}
  .flag{font-size:14px;font-weight:600;margin:6px 0 0;padding:7px 9px;border-radius:9px;overflow-wrap:anywhere}
  .flag.red{background:var(--redbg);color:var(--red)}.flag.amber{background:var(--amberbg);color:var(--amber)}.flag.blue{background:var(--bluebg);color:var(--blue)}.flag.green{background:var(--greenbg);color:var(--green)}
  .cbtns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
  .detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .detail p{margin:6px 0 0;font-size:15px;overflow-wrap:anywhere}
  .detail .lbl{font-size:13px;font-weight:800;color:var(--muted);display:block;margin-top:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  textarea.note{width:100%;margin-top:4px;resize:vertical;background:#fbfcfd}
  textarea.note.saved{border-color:var(--green);background:var(--greenbg)} textarea.note.bad{border-color:var(--red)}
  .dropbox{display:none;margin-top:6px}.dropbox.on{display:flex}
  .dropbox input{flex:1 1 180px;min-width:0}
  pre.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--greybg);border-radius:8px;padding:8px;margin:6px 0 0;color:var(--ink)}
  details>summary{cursor:pointer;font-weight:800;font-size:15px;padding:4px 0}
  .pane{display:none}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:16px 0 0;box-shadow:var(--shadow)}
  .q{font-size:15px;padding:9px 0;border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:none}
  .wk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .wk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
  .banner{border-radius:11px;padding:10px 12px;font-size:15px;font-weight:600;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--redbg);color:var(--red);border:1px solid #e3b5b8}
  .banner.ok{background:var(--greenbg);color:var(--green);border-color:#b5dcc4}
  .banner.info{background:var(--amberbg);color:var(--amber);border-color:#e6cf9f}
  .banner span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
  .spin{color:var(--muted);font-size:15px;padding:16px 2px}
  .bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--ink);padding:10px clamp(10px,1.6vw,28px);box-shadow:0 -2px 12px rgba(16,23,32,.12);display:none;flex-wrap:wrap;gap:8px;align-items:center}
  .bulkbar.on{display:flex}
  .bulkbar b{font-size:15px}
  .modal{display:none;position:fixed;inset:0;background:rgba(14,22,33,.5);z-index:50;padding:14px;overflow:auto}
  .modal .box{width:min(100%,760px);margin:20px auto;background:#fff;border-radius:14px;padding:14px}
  .modal textarea{width:100%;height:44vh;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
  .tokbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;width:min(100%,520px)}
  .tokbar input{width:100%;margin:6px 0}

  @media (min-width:700px){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card.sel{grid-column:1 / -1}
  }
  @media (min-width:1101px){
    .layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,520px);gap:14px;align-items:start}
    .board{grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:10px;align-items:start}
    .col{background:var(--colbg);border-radius:12px;padding:8px}
    .cards{grid-template-columns:minmax(0,1fr)}
    .card.sel{grid-column:auto}
    .card .detail.inline{display:none}
    .pane{display:block;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .pane .detail{border-top:none;margin-top:0;padding-top:0}
  }
  @media (hover:none) and (pointer:coarse){
    .pick{min-width:44px;min-height:44px}
    .ctitle{min-height:44px}
    input[type=search],input[type=text],input[type=number],input[type=password],textarea{min-height:44px}
  }
</style>
<style id="mobile-input-font">
/* Ops_Build_Queue #96 (Oct 9 2026): inputs must be >=16px on touch screens or Android/iOS zoom the page on focus. Mouse/desktop density unchanged. */
@media (hover:none) and (pointer:coarse){
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=submit]):not([type=button]):not([type=image]),select,textarea{font-size:16px !important}
}
</style>
<style id="mobile-tap-targets">
/* Ops_Build_Queue #111 (Oct 29 2026): tap targets >=44px + scrollable wide tables on touch phones only (same gate as mobile-input-font, so mouse/desktop density is unchanged).
   min-height/min-width only (never a fixed height) so labels wrap instead of overflowing; !important so page rules like .btn.small{min-height:34px} cannot win. Documented exceptions: checkboxes/radios/file inputs and plain text links inside a sentence. */
@media (hover:none) and (pointer:coarse){
  button,input[type=button],input[type=submit],select,summary,.btn,.btn-sm,.filter-btn,#rc-navbar a{min-height:44px !important}
  button,input[type=button],input[type=submit],.btn,.btn-sm,.filter-btn,#rc-navbar a{min-width:44px !important}
  .modal-close{font-size:1.6rem;line-height:1;margin:-8px -10px -8px 0}
  div.tab{min-height:44px !important;min-width:44px;display:flex;align-items:center;justify-content:center}
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  a.back{display:inline-flex;align-items:center;min-height:44px}
}
</style>

<script>
// ── Queue v2 (Nov 16 2026) ───────────────────────────────────────────────────────────────────────
// Every change to a row goes to POST /ops-queue-stage (one narrow route, re-read after every write). The page never calls any AI
// service: "Build now" only marks the row queued and pinned; a separate scheduled build run picks queued rows up.
const _p=new URLSearchParams(location.search);
const STAGING=_p.has('staging');
const WORKER=STAGING?'https://maintenance-hub-staging.brett-2f8.workers.dev':'https://maintenance-hub.brett-2f8.workers.dev';
const AUTH_KEY=STAGING?'mh_auth_staging':'mh_auth';
const REPO_URL='https://github.com/Ridge-Co/RidgeCo';
const REVIEW_CAP=25, LIVE_CAP=12, DEFAULT_SNOOZE=10, RECHECK_GRACE_DAYS=4, BULK_MAX=40;
const STAGE_LABEL={review:'Review',approved:'Approved',queued:'Queued',building:'Building',pr_open:'PR open',merged:'Merged',live:'Live',done:'Done',blocked:'Blocked',snoozed:'Snoozed',dropped:'Dropped'};
const GROUPS=[['review','Review'],['approved','Approved and queued'],['building','Building'],['waiting','Waiting on you'],['live','Live'],['other','Other']];
function report(where,e){ try{ if(typeof window.hubReportFailure==='function') window.hubReportFailure('proposals:'+where,String((e&&e.message)||e)); }catch(e2){ console.error('could not report',where,e2); } }
function store(key,val){ try{ if(val===undefined) return localStorage.getItem(key)||''; localStorage.setItem(key,val); return val; }catch(e){ console.warn('This browser is not saving settings for this page ('+key+').'); return ''; } }
let TOKEN=store(AUTH_KEY);
let ROWS=[], BYID={}, REV=null, SEL='', SHOW_ALL_REVIEW=false, SYNCED=false, LASTQ=null;
const BULK=new Set(), F={q:'',stage:'',risk:'',tag:'',mine:false,stuck:false};
let REVIEW_ANYWAY={}; try{ REVIEW_ANYWAY=JSON.parse(store('prop_review_anyway')||'{}')||{}; }catch(e){ REVIEW_ANYWAY={}; }

function h(s){return (s==null?'':(''+s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ms(v){const t=Date.parse(String(v||''));return Number.isFinite(t)?t:NaN;}
function pct(x){const n=parseFloat(x);return Number.isFinite(n)?Math.round(n*100)+'%':'n/a';}
function wide(){return window.matchMedia('(min-width:1101px)').matches;}

// ── network: every call either returns data or throws a plain-English error (nothing fails quietly) ──
async function call(method,path,body){
  let r;
  try{ r=await fetch(WORKER+path,{method:method,headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:body===undefined?undefined:JSON.stringify(body)}); }
  catch(e){ throw new Error('Could not reach the Hub. Check the connection and try again.'); }
  const t=await r.text(); let d=null;
  try{ d=JSON.parse(t); }catch(e){ d=null; }
  if(r.status===401) throw new Error('The Hub did not accept the access code. Reconnect and try again.');
  if(!d) throw new Error('The Hub sent an answer this page could not read (HTTP '+r.status+').');
  if(d.bulk===true) return d;                                   // bulk answers list each row's own result
  if(!r.ok||d.error||(d.ok!==true&&d.success!==true)) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function getJSON(path){return call('GET',path);}
function postJSON(path,body){return call('POST',path,body);}

// ── messages ────────────────────────────────────────────────────────────────────────────────────
let RETRY=null;
function toast(msg,kind,retry){
  const el=document.getElementById('toast'); if(!el)return;
  RETRY=retry||null;
  el.innerHTML=msg?'<div class="banner'+(kind?' '+kind:'')+'"><span>'+h(msg)+'</span>'+(retry?'<button type="button" class="btn" data-act="retry">Try again</button>':'')+'<button type="button" class="btn" data-act="dismiss">Dismiss</button></div>':'';
}
// Double-tap guard: the button is disabled on the very first line, before anything is awaited, and restored on success AND failure.
const BUSY={};
async function guarded(key,btn,fn){
  if(BUSY[key])return; BUSY[key]=true;
  let old=''; if(btn){ old=btn.textContent; btn.disabled=true; btn.textContent='Saving…'; }
  try{ await fn(); }
  catch(e){ report(key,e); toast('That did not save. '+String((e&&e.message)||e),'',function(){ guarded(key,null,fn); }); }
  finally{ BUSY[key]=false; if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent=old; } }
}

// ── rows ────────────────────────────────────────────────────────────────────────────────────────
// The Hub sends each row's stage. This fallback only matters if the page loads before the Hub has the new code.
function fallbackStage(x){
  const s=String(x.Status||'').toLowerCase(), bs=String(x.Build_State||'');
  if(s==='dropped'||bs==='abandoned')return 'dropped';
  if(bs==='pr_closed'||s==='held'||bs==='held')return 'blocked';
  if(s==='greenlit'||s==='prepared')return 'approved';
  if(s==='building')return bs==='pr_open'?'pr_open':'building';
  if(s==='done')return bs==='pr_open'?'pr_open':(bs==='building'?'building':(bs==='live'?'live':'done'));
  return ms(x.Snooze_Until)>Date.now()?'snoozed':'review';
}
function isSafe(x){return String(x.Risk_Class||'').toUpperCase()==='SAFE';}
function onBrett(x){return String(x.Blocked_On||'brett').toLowerCase()==='brett';}
function prep(x){
  x._stage=STAGE_LABEL[x.stage]?x.stage:fallbackStage(x);
  x._stuck=x.stuck===true;
  x._hours=(typeof x.stage_hours==='number')?x.stage_hours:null;
  x._group=groupOf(x);

}
function groupOf(x){
  const s=x._stage, now=Date.now();
  if(s==='review'){
    const sn=ms(x.Snooze_Until);
    if(Number.isFinite(sn)&&sn<=now){            // snooze is up: it comes back once the Optimizer has re-checked it against builds since
      const v=String(x.Scout_Verdict||'').toLowerCase(), graceOver=(now-sn)>RECHECK_GRACE_DAYS*86400000;
      if(v==='covered'&&!REVIEW_ANYWAY[x.ID]){ x._why=x.Scout_Note||'The Optimizer says builds shipped since cover this'; return 'built'; }
      if(v==='keep'||v==='update'||graceOver) x._back=v?('Back from snooze. Re-checked: '+v):'Back from snooze. Not re-checked yet';
      else { x._wait=true; return 'snoozedlist'; }
    }
    if(String(x.Shipped_Match||'').trim()&&!REVIEW_ANYWAY[x.ID]){ x._why=x.Shipped_Match; return 'built'; }
    return 'review';
  }
  if(s==='approved'||s==='queued')return 'approved';
  if(s==='building')return 'building';
  if(s==='pr_open')return 'waiting';
  if(s==='blocked')return onBrett(x)?'waiting':'building';
  if(s==='merged'||s==='live')return recent(x,14)?'live':'other';
  if(s==='done')return recent(x,14)?'live':'other';
  if(s==='snoozed')return 'snoozedlist';

}
function when(x){return ms(x.Stage_Updated)||ms(x.Build_Updated)||ms(x.Timestamp);}
function recent(x,days){const t=when(x);return Number.isFinite(t)&&Date.now()-t<days*86400000;}
function effortParts(e){
  e=String(e||'').trim(); if(!e)return {l:'',rest:''};
  const m=/^(xs|s|m|l|xl|small|medium|large|low|high|quick)\b[\s:.,;()\-]*/i.exec(e);
  const size=function(w){w=w.toLowerCase();return (w==='s'||w==='xs'||w==='small'||w==='low'||w==='quick')?'S':(w==='m'||w==='medium')?'M':'L';};
  if(m)return {l:size(m[1]),rest:e.slice(m[0].length).trim()};
  const k=/\b(small|quick|low)\b/i.test(e)?'S':/\b(medium|moderate)\b/i.test(e)?'M':/\b(large|big|high)\b/i.test(e)?'L':'';

}
const EFFORT_WORD={S:'small',M:'medium',L:'large'};

// ── load ────────────────────────────────────────────────────────────────────────────────────────
async function load(){
  if(!TOKEN){ document.getElementById('body').innerHTML='<div class="tokbar"><b>Connect</b><div class="sub">Enter your Hub access code to load the queue.</div><input id="tok" type="password" placeholder="Access code" aria-label="Hub access code"><button type="button" class="btn primary" data-act="savetok">Connect</button></div>'; return; }
  let rev=null,q=null;
  try{ rev=await getJSON('/ops-review-log?limit=1'); }
  catch(e){ rev=null; report('review-log',e); toast('Could not load this week’s review. '+e.message,'',load); }
  try{ q=await getJSON('/ops-queue?all=1'); }
  catch(e){
    report('queue',e);
    document.getElementById('body').innerHTML='<div class="banner"><span>Could not load the queue. '+h(e.message)+'</span><button type="button" class="btn" data-act="reload">Try again</button>'+(/access code/.test(e.message)?'<button type="button" class="btn" data-act="forget">Reconnect</button>':'')+'</div>';
    return;
  }
  if(q&&q.truncated) toast('The queue list is cut off at 400 rows, so the oldest rows are not shown here.','info');
  REV=rev; LASTQ=q;
  ROWS=((q&&q.queue)||[]).map(prep); BYID={}; ROWS.forEach(function(x){BYID[String(x.ID)]=x;});
  Array.from(BULK).forEach(function(id){ if(!BYID[id]) BULK.delete(id); });
  fillTags(); render(); maybeSync();
}
// Ask the Hub to check GitHub for every build in flight, once per page load. GitHub often refuses the Hub's shared address,
// so the PR list is looked up from this browser and handed over; if that lookup fails the Hub tries by itself.
async function maybeSync(){
  if(SYNCED)return;
  const need=ROWS.some(function(x){return x._stage==='building'||x._stage==='pr_open'||x._stage==='merged'||(x._stage==='blocked'&&x.PR_Number);});
  if(!need)return; SYNCED=true;
  let prs=[];
  try{
    const ac=new AbortController(); const tm=setTimeout(function(){ac.abort();},6000);
    const g=await fetch('https://api.github.com/repos/Ridge-Co/RidgeCo/pulls?state=all&sort=updated&direction=desc&per_page=100',{headers:{'Accept':'application/vnd.github+json'},signal:ac.signal});
    clearTimeout(tm);
    if(g.ok) prs=(await g.json()).map(function(p){return {number:p.number,state:p.state,merged_at:p.merged_at,title:p.title,body:(String(p.body||'').match(/(?:ops[ -]?queue\s+(?:item\s+)?#?|\bqueue\s+(?:item\s+|row\s+)?#)\d+/ig)||[]).join(' ')};});
  }catch(e){ prs=[]; console.warn('GitHub could not be read from this browser; the Hub will check by itself.',e); }
  try{
    const body={prs:prs}; if(STAGING) body.title_prefix='TEST-';
    const r=await fetch(WORKER+'/ops-queue/sync',{method:'POST',headers:{'Content-Type':'application/json','X-Auth-Token':TOKEN},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.errors&&d.errors.length) toast('Could not check GitHub for '+d.errors.length+' build'+(d.errors.length>1?'s':'')+' ('+d.errors[0].error+'). Their stage below may be out of date.','',function(){SYNCED=false;maybeSync();});
    else if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    if(d.changed&&d.changed.length) load();
  }catch(e){
    report('sync',e);
    toast('Could not check GitHub for build progress. '+String((e&&e.message)||e)+' Stages below may be out of date.','',function(){SYNCED=false;maybeSync();});
  }
}
function fillTags(){
  const sel=document.getElementById('fTag'), cur=F.tag, tags=Array.from(new Set(ROWS.map(function(x){return String(x.Tag||'').trim();}).filter(Boolean))).sort();
  sel.innerHTML='<option value="">Any</option>'+tags.map(function(t){return '<option value="'+h(t)+'"'+(t===cur?' selected':'')+'>'+h(t)+'</option>';}).join('');
  if(cur&&tags.indexOf(cur)<0) F.tag='';
}

// ── filters ─────────────────────────────────────────────────────────────────────────────────────
function passes(x){
  if(F.q){ const q=F.q.toLowerCase().replace(/^#/,''); if(String(x.ID).toLowerCase()!==q&&String(x.Title||'').toLowerCase().indexOf(q)<0) return false; }
  if(F.stage&&x._stage!==F.stage)return false;
  if(F.risk==='SAFE'&&!isSafe(x))return false;
  if(F.risk==='GATED'&&isSafe(x))return false;
  if(F.tag&&String(x.Tag||'').trim()!==F.tag)return false;
  if(F.mine&&!(x._stage==='pr_open'||(x._stage==='blocked'&&onBrett(x))))return false;
  if(F.stuck&&!x._stuck)return false;
  return true;
}
function filtering(){return !!(F.q||F.stage||F.risk||F.tag||F.mine||F.stuck);}
function sortRows(list,g){
  return list.slice().sort(function(a,b){
    const pa=String(a.Pinned||'').toUpperCase()==='TRUE'?0:1, pb=String(b.Pinned||'').toUpperCase()==='TRUE'?0:1;
    if(pa!==pb)return pa-pb;
    if(g==='review'){ const ra=parseFloat(a.Rank),rb=parseFloat(b.Rank); const na=Number.isFinite(ra)?ra:999,nb=Number.isFinite(rb)?rb:999; if(na!==nb)return na-nb; return (+b.ID)-(+a.ID); }
    return (when(b)||0)-(when(a)||0)||(+b.ID)-(+a.ID);
  });
}

// ── render ──────────────────────────────────────────────────────────────────────────────────────
function chip(cls,text,title){return '<span class="chip'+(cls?' '+cls:'')+'"'+(title?' title="'+h(title)+'" aria-label="'+h(title)+'"':'')+'>'+h(text)+'</span>';}
function prUrl(x){return REPO_URL+'/pull/'+encodeURIComponent(String(x.PR_Number||'').trim());}
function chipsOf(x){
  const out=[], ef=effortParts(x.Effort), pinned=String(x.Pinned||'').toUpperCase()==='TRUE';
  out.push(chip('s-'+x._stage,STAGE_LABEL[x._stage]));
  if(x._stage!=='review'||String(x.Risk_Class||'').trim()) out.push(isSafe(x)?chip('safe','Safe','Safe: may be built without you'):chip('gated','Gated','Gated: needs a build you supervise'));
  if(ef.l) out.push(chip('','Effort '+ef.l,'Effort: '+EFFORT_WORD[ef.l]));
  if(x.Tag) out.push(chip('',x.Tag));
  if(pinned) out.push(chip('pin','Pinned'));
  if(x._stuck) out.push(chip('stuck','Stuck'+(x._hours!==null?' '+(x._hours>=48?Math.floor(x._hours/24)+' days':x._hours+' hours'):'')));
  if(String(x.Requires_Spend||'').toUpperCase()==='TRUE') out.push(chip('pin','Costs money'));
  if(String(x.PR_Number||'').trim()) out.push('<a class="chip" href="'+h(prUrl(x))+'" target="_blank" rel="noopener">PR #'+h(x.PR_Number)+'</a>');
  return out.join('');
}
function pushButton(x){

  if(s==='approved')return '<button type="button" class="btn primary" data-act="buildnow">Build now</button>';
  if(s==='queued')return '<span class="flag amber" style="margin:0">Queued for the next build run</span>';
  if(s==='building')return '<button type="button" class="btn" data-act="retry-build">Retry</button>';
  if(s==='pr_open')return '<button type="button" class="btn primary" data-act="openpr">Open PR</button>';
  if(s==='merged')return '<button type="button" class="btn primary" data-act="marklive">Mark live</button>';
  if(s==='blocked')return '<button type="button" class="btn primary" data-act="unblock">Unblock</button>';

}
function flagsOf(x){

}
function detail(x,inline){

function card(x){

function render(){
  const body=document.getElementById('body');

      const ef=effortParts(it.effort);
      html+='<label class="wk"><input type="checkbox" class="wkbox" data-i="'+i+'"><span><b>#'+h(it.rank||i+1)+' '+h(it.title||'')+'</b><span class="chips">'+(it.tag?chip('',it.tag):'')+(ef.l?chip('','Effort '+ef.l,'Effort: '+EFFORT_WORD[ef.l]):'')+'</span>'
        +(it.problem?'<span class="sub" style="display:block">'+h(it.problem)+'</span>':'')+(it.action?'<span style="display:block;font-size:15px">'+h(it.action)+'</span>':'')+(it.impact?'<span class="sub" style="display:block">Impact: '+h(it.impact)+'</span>':'')+(ef.rest?'<span class="sub" style="display:block">Effort: '+h(ef.rest)+'</span>':'')+'</span></label>';
    });
    if(open.length) html+='<div class="row"><button type="button" class="btn go" id="wkGo" data-act="approveweek" disabled>Approve selected</button><span class="sub">Risk is decided for you; change it on the card afterwards if you disagree.</span></div>';
    if(covered) html+='<div class="sub">'+covered+' finding'+(covered>1?'s':'')+' from this review match items already in the queue, so they are not shown again.</div>';
    html+='</details>';
  } else if(REV) html+='<div class="panel sub">No weekly review yet. Run one from the Command Center.</div>';
  body.innerHTML=html;
  bulkBar();
}

// ── duplicate matching for the weekly list (same algorithm as the Hub's queueSimilarity) ─────────
const STOP=new Set(['the','and','for','with','from','that','this','into','via','per','new','add','build','show','make','use','using','when','not','all','any','every','each','are','was','were','been','will','can','should','would','could','item','items','page','view','flow','tool','auto','automatic','automatically','system','feature']);
function toks(t){const o=new Set();String(t==null?'':t).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).forEach(function(w){if(w.length<3||STOP.has(w))return;let s=w;if(s.length>5&&/ing$/.test(s))s=s.slice(0,-3);else if(s.length>4&&/ed$/.test(s))s=s.slice(0,-2);else if(s.length>4&&/ies$/.test(s))s=s.slice(0,-3)+'y';else if(s.length>3&&/s$/.test(s)&&!/ss$/.test(s))s=s.slice(0,-1);if(s.length>=3)o.add(s);});return o;}
function dice(a,b){if(!a.size||!b.size)return 0;let i=0;a.forEach(function(t){if(b.has(t))i++;});return 2*i/(a.size+b.size);}
function overlapsQueue(it,rows){const ta=toks(it.title),fa=toks([it.title,it.problem,it.action].join(' '));for(let k=0;k<rows.length;k++){const r=rows[k];if(dice(ta,toks(r.Title))>=0.6||dice(fa,toks([r.Title,r.Problem,r.First_Step].join(' ')))>=0.30)return r;}return null;}

// ── writes ──────────────────────────────────────────────────────────────────────────────────────
async function setStage(id,body,okMsg){
  const d=await postJSON('/ops-queue-stage',Object.assign({id:String(id)},body));
  const warn=(d.warnings||[]).join(' ');
  let msg=typeof okMsg==='function'?okMsg(d):okMsg;
  await load();
  toast((msg||'Saved.')+(warn?' '+warn:''),warn?'info':'ok');
}
async function saveNoteIfChanged(box,id){
  const ta=box&&box.querySelector('textarea.note'); if(!ta)return;
  const was=String((BYID[id]||{}).Brett_Note||'').trim();
  if(ta.value.trim()===was)return;
  await postJSON('/ops-queue-update',{id:id,note:ta.value.trim()});
  if(BYID[id])BYID[id].Brett_Note=ta.value.trim();
}
function riskWords(d){return d.risk_class==='SAFE'?'safe':'gated';}

  open:function(el,id){ SEL=(SEL===id&&!wide())?'':id; render(); if(SEL&&!wide()){ const c=document.querySelector('.card.sel'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest'}); } },

  }); },
  buildnow:function(el,id,box){ guarded('stage'+id,el,async function(){ await saveNoteIfChanged(box,id); await setStage(id,{stage:'queued'},'Queued for the next build run.'); }); },
  'retry-build':function(el,id){ guarded('stage'+id,el,function(){ return setStage(id,{stage:'queued',note:'retry'},'Queued for the next build run.'); }); },
  openpr:function(el,id){ const x=BYID[id]; if(x&&String(x.PR_Number||'').trim()) window.open(prUrl(x),'_blank','noopener'); else toast('This item has no PR number yet.'); },
  marklive:function(el,id){ guarded('stage'+id,el,function(){ return setStage(id,{stage:'live'},'Marked live.'); }); },
  unblock:function(el,id){ const x=BYID[id]||{}; const to=(String(x.PR_Number||'').trim()&&String(x.Build_State||'')!=='pr_closed')?'pr_open':'queued';
    guarded('stage'+id,el,function(){ return setStage(id,{stage:to},to==='pr_open'?'Unblocked. Back to waiting for your merge.':'Unblocked. Queued for the next build run.'); }); },
  toreview:function(el,id){ guarded('stage'+id,el,function(){ return setStage(id,{stage:'review'},'Moved back to review.'); }); },
  wake:function(el,id){ guarded('stage'+id,el,function(){ return setStage(id,{stage:'review'},'Brought back to review.'); }); },
  snooze:function(el,id,box){

  dropask:function(el,id,box){ const b=box&&box.querySelector('.dropbox'); if(!b)return; b.classList.toggle('on'); if(b.classList.contains('on')) b.querySelector('input').focus(); },
  drop:function(el,id,box){

  },
  dropbuilt:function(el,id){ guarded('stage'+id,el,function(){ return setStage(id,{stage:'dropped',reason:'already built (per Optimizer flag)'},'Dropped as already built.'); }); },
  reviewanyway:function(el,id){ REVIEW_ANYWAY[id]=1; store('prop_review_anyway',JSON.stringify(REVIEW_ANYWAY)); ROWS.forEach(function(x){x._why='';x._group=groupOf(x);}); render(); },
  dropallbuilt:function(el){

  },
  risk:function(el,id){ const v=el.getAttribute('data-v'); guarded('risk'+id,el,function(){ return setStage(id,{risk_class:v},function(d){return 'Risk saved: '+riskWords(d)+'.';}); }); },
  pin:function(el,id){ const on=el.getAttribute('data-v')==='on'; guarded('pin'+id,el,function(){ return setStage(id,{pinned:on},on?'Pinned to the top.':'Unpinned.'); }); },
  copy:function(el,id){ const x=BYID[id]; if(x) openModal('Build brief: '+(x.Title||''),brief(x),'Paste this into a Claude session to build it.'); },
  showall:function(){ SHOW_ALL_REVIEW=true; render(); },
  // bulk
  bsafe:function(el){ guarded('bulk',el,function(){ return bulkWrite(Array.from(BULK),{risk_class:'SAFE'},'set to safe'); }); },
  bgated:function(el){ guarded('bulk',el,function(){ return bulkWrite(Array.from(BULK),{risk_class:'GATED'},'set to gated'); }); },
  bpin:function(el){ guarded('bulk',el,function(){ return bulkWrite(Array.from(BULK),{pinned:true},'pinned'); }); },
  bdropask:function(){ const b=document.getElementById('bulkDrop'); b.classList.toggle('on'); if(b.classList.contains('on')) document.getElementById('bulkReason').focus(); },
  bdrop:function(el){
    const why=document.getElementById('bulkReason').value.trim();

  },
  bclear:function(){ BULK.clear(); render(); },

  pick:function(el){ const nmax=+el.getAttribute('data-v'); document.querySelectorAll('#sec-week input.wkbox').forEach(function(cb){ const i=+cb.getAttribute('data-i'); const it=(window.__reviewOpen||[])[i]; cb.checked=nmax>=99?true:(nmax===0?false:!!(it&&(it.rank||i+1)<=nmax)); }); weekCount(); },
  approveweek:function(el){

    if(!items.length)return;
    guarded('week',el,async function(){
      const d=await postJSON('/ops-approve',{items:items.slice(0,20),review_ts:window.__reviewTs||''});
      await load();

    });

  retry:function(){ const f=RETRY; toast(''); if(f) f(); },
  dismiss:function(){ toast(''); },
  reload:function(){ document.getElementById('body').innerHTML='<div class="spin">Loading…</div>'; load(); },
  forget:function(){ TOKEN=''; store(AUTH_KEY,''); load(); },
  savetok:function(){ const v=document.getElementById('tok').value.trim(); if(!v){ toast('Enter the access code first.'); return; } TOKEN=v; store(AUTH_KEY,v); document.getElementById('body').innerHTML='<div class="spin">Connecting…</div>'; load(); },
  closemodal:function(){ document.getElementById('modal').style.display='none'; },
  copymodal:function(){ const t=document.getElementById('mtext'); t.focus(); t.select(); copyText(t.value); },
};
// One bulk request per 40 rows; every row's own result comes back, so a partly failed batch says exactly which rows failed and why.
async function bulkWrite(ids,body,verb){
  if(!ids.length)return;
  let saved=0; const failed=[];
  for(let i=0;i<ids.length;i+=BULK_MAX){
    const d=await postJSON('/ops-queue-stage',Object.assign({ids:ids.slice(i,i+BULK_MAX)},body));
    (d.results||[]).forEach(function(r){ if(r.ok) saved++; else failed.push(r); });
  }
  BULK.clear(); failed.forEach(function(r){ BULK.add(String(r.id)); });
  await load();
  if(failed.length) toast(saved+' '+verb+', '+failed.length+' did not save: '+failed.slice(0,4).map(function(r){return '#'+r.id+' ('+r.error+')';}).join('; ')+'. The ones that failed are still selected.','',function(){ guarded('bulk',null,function(){ return bulkWrite(Array.from(BULK),body,verb); }); });
  else toast(saved+' item'+(saved===1?'':'s')+' '+verb+'.','ok');
}
function bulkBar(){
  const n=BULK.size, bar=document.getElementById('bulkbar');
  bar.classList.toggle('on',n>0);
  document.getElementById('bulkN').textContent=n+' selected';

}
function weekCount(){ const n=document.querySelectorAll('#sec-week input.wkbox:checked').length, g=document.getElementById('wkGo'); if(g){ g.disabled=!n; g.textContent=n?('Approve '+n+' selected'):'Approve selected'; } }

// "Your change" saves when you leave the box; a failed save is shown with a retry.
document.addEventListener('focusout',function(ev){
  const ta=ev.target; if(!(ta.classList&&ta.classList.contains('note')))return;

  save().catch(function(e){ report('note',e); if(ta.isConnected) ta.classList.add('bad'); toast('Your change was not saved. '+String((e&&e.message)||e),'',function(){ save().catch(function(e2){ report('note',e2); toast('Your change was still not saved. '+String((e2&&e2.message)||e2)); }); }); });
});

}

<!-- B-093 auto-refresh: poll /version, refresh onto new code (idle=auto, mid-entry=tap banner). A failed check is counted and,
     after five in a row, shown once: the page may then be out of date without knowing it. -->
<script>
(function(){
  var VER_URL = WORKER + '/version', booted = null, misses = 0, told = false;
  function dirty(){
    var el = document.activeElement;
    if (el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') && el.value) return true;
    if (document.getElementById('modal') && document.getElementById('modal').style.display==='block') return true;
    if (BULK.size) return true;
    return false;
  }
  function banner(){
    if (document.getElementById('mh-upd-banner')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'mh-upd-banner';
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;width:100%;border:none;background:#0b6b33;color:#fff;padding:13px 16px;text-align:center;font:600 15px system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
    b.textContent = 'Update ready. Tap to refresh';
    b.onclick = function(){ location.reload(); };
    document.body.appendChild(b);
  }
  function check(){
    fetch(VER_URL, {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      misses = 0;
      if (!d || !d.version) return;
      if (booted === null){ booted = d.version; return; }
      if (d.version !== booted){ dirty() ? banner() : location.reload(); }
    }).catch(function(e){
      misses++;
      if (misses >= 5 && !told){ told = true; toast('This page cannot check for updates right now (' + String((e && e.message) || e) + '). Refresh it by hand if something looks out of date.', 'info'); }
    });
  }
  check();
  setInterval(check, 60000);
})();
</script>
