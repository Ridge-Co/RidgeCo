<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridge Co — Signed Proposals</title>
<style>
  :root{--bg:#e9ebef;--card:#fff;--ink:#0e1621;--muted:#5b6672;--line:#d8dce2;
    --green:#1a8f4c;--greenbg:#e6f4ec;--amber:#b26a00;--amberbg:#fbf0dd;
    --red:#c0242b;--redbg:#f9e4e4;--blue:#1d4ed8;--bluebg:#e7effb;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:60px}
  .wrap{max-width:640px;margin:0 auto;padding:0 12px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
  .title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .title small{font-weight:600;color:var(--muted);font-size:12px;margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(16,23,32,.06)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-size:15px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .chip{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .chip.signed{background:var(--amberbg);color:var(--amber)}
  .chip.booked{background:var(--greenbg);color:var(--green)}
  .chip.billmiss{background:var(--redbg);color:var(--red)}
  .amt{margin-left:auto;text-align:right}
  .amt .big{font-size:17px;font-weight:800}
  .amt .lbl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .booked{font-size:12.5px;color:var(--green);font-weight:700;margin-top:8px}
  .muted{color:var(--muted)}
  .warn{background:var(--amberbg);color:#5c3d00;border:1px solid #ecd6a6;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #ccd;border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  #login{max-width:340px;margin:60px auto;text-align:center}
  #login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px;margin:10px 0}
  .modal{display:none;position:fixed;inset:0;background:rgba(14,22,33,.5);z-index:50;padding:14px}
  .modal.open{display:block}
  .box{max-width:520px;margin:24px auto;background:#fff;border-radius:14px;padding:16px}
  .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-top:8px;padding-top:8px;border-top:2px solid var(--ink)}
  .hide{display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0e1621;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<!-- RC-NAV: shared back-to-Hub + tools jump bar (Aug 20, 2026) -->
<div id="rc-navbar" style="position:static;z-index:9999;background:#1d4ed8;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overflow-x:auto;white-space:nowrap">
  <a href="index.html" style="color:#fff;text-decoration:none;display:flex;align-items:center;gap:4px;flex:none">← Hub</a>
  <select id="rc-nav-jump" onchange="if(this.value)location.href=this.value" style="margin-left:auto;flex:none;background:#fff;color:#1b1f24;border:none;border-radius:4px;padding:4px 6px;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:46vw">
    <option value="">Jump to…</option>
    <optgroup label="Dashboards">
      <option value="command-center.html">Command Center</option>
      <option value="action-center.html">Action Center</option>
    </optgroup>
    <optgroup label="Money">
      <option value="vendor-reconcile.html">Vendor reconciliation</option>
      <option value="receipt-reconciler.html">Receipt Reconciler</option>
      <option value="ar-report-admin.html">Open Item Report</option>
      <option value="qb-email-backfill.html">Fix QB emails</option>
      <option value="qb-invoice-email-backfill.html">Fix unsent invoice emails</option>
      <option value="trash.html">Trash Service billing</option>
      <option value="signed-proposals.html">Signed proposals → QB</option>
    </optgroup>
    <optgroup label="Tools">
      <option value="scope-creator.html">Scope Creator</option>
      <option value="inspect.html">Inspection Scheduler</option>
      <option value="deliveries.html">Deliveries</option>
      <option value="proposals.html">Proposals</option>
      <option value="tenant-wo-access.html">Tenant WO Access</option>
      <option value="building-info.html">Building Info</option>
      <option value="keys.html">Keys</option>
      <option value="cluster-tool.html">Location Cluster Tagger</option>
    </optgroup>
    <optgroup label="Data import">
      <option value="importer.html">Tenant Importer</option>
      <option value="clickup-importer.html">ClickUp Importer</option>
      <option value="data-importer.html">Data Importer</option>
      <option value="key-importer.html">Key Registry Importer</option>
      <option value="patch-importer.html">Patch Importer</option>
      <option value="wo-bulk-fix.html">WO Bulk Fix</option>
      <option value="owner-setup.html">Owner Setup (legacy)</option>
    </optgroup>
    <optgroup label="Portals">
      <option value="owner.html">Owner Portal</option>
      <option value="vendor.html">Vendor Portal</option>
      <option value="tenant.html">Tenant Portal</option>
    </optgroup>
  </select>
</div>


<div id="login">
  <div class="title" style="justify-content:center;margin-bottom:6px">🧾 Signed Proposals</div>
  <p class="muted" style="font-size:13px">Enter your Hub access code.</p>
  <input id="login-input" type="password" placeholder="Access code" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn primary" style="width:100%" onclick="doLogin()">Enter</button>
  <p id="login-error" class="hide" style="color:var(--red);font-size:13px">Wrong code — try again.</p>
</div>

<div id="app" class="hide">
  <header><div class="wrap"><div class="title">🧾 Signed Proposals <small id="count"></small></div></div></header>
  <div class="wrap" id="list"><p class="muted" style="padding:20px 0"><span class="spin"></span> Loading…</p></div>
</div>

<div class="modal" id="modal"><div class="box">
  <div class="title" id="m-title" style="margin-bottom:6px">Preview</div>
  <div id="m-body"><p class="muted"><span class="spin"></span> Building preview…</p></div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" onclick="closeModal()">Cancel</button>
    <button class="btn primary hide" style="flex:1" id="m-confirm" onclick="confirmBook(this)">Confirm</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
var WORKER='https://maintenance-hub.brett-2f8.workers.dev';
var SECRET_KEY='mh_auth';
var AUTH_TOKEN='';
var cur=null;

function api(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json','X-Auth-Token':AUTH_TOKEN}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(WORKER+path,opts).then(function(res){return res.json().then(function(d){if(d.error==='Unauthorized')throw new Error('Unauthorized');return d;});});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// Human text for Scope_Signatures.Bill_Skip_Reason (worker.js scopeProposalBook) — every reason
// the vendor-bill half of a booking can come up empty, so "no bill" is never just unexplained.
function skipReasonText(code){
  return {
    no_vendor:'no vendor is set on this scope',
    vendor_not_found:'the vendor set on this scope could not be found',
    zero_cost:'the vendor cost on this scope is $0',
    qb_vendor_unresolved:'QuickBooks could not resolve/create this vendor',
    qb_bill_api_error:'the QuickBooks bill API call failed',
    bill_exception:'an error occurred while creating the bill',
  }[code] || 'reason unknown — check this scope’s vendor and cost fields';
}
function money(n){return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

function doLogin(){
  var v=document.getElementById('login-input').value.trim();AUTH_TOKEN=v;
  api('GET','/proposal/signatures').then(function(){localStorage.setItem(SECRET_KEY,v);enterApp();})
    .catch(function(){AUTH_TOKEN='';document.getElementById('login-error').classList.remove('hide');});
}
function enterApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load();}

// Two separate signed-proposal systems feed this one screen: the older per-property B-076
// registry (/proposal/signatures + /proposal/book) and the newer generic scope e-sign system
// (/scope-proposal/signed + /scope-proposal/book, Aug 19/21 2026). Same review/preview/confirm
// UX either way — each row just remembers which API pair (`kind`) it books through.
function load(){
  Promise.all([
    api('GET','/proposal/signatures').catch(function(e){return {error:e.message};}),
    api('GET','/scope-proposal/signed').catch(function(e){return {error:e.message};})
  ]).then(function(res){
    var legacy=Array.isArray(res[0])?res[0]:[];
    var scoped=Array.isArray(res[1])?res[1]:[];
    if(!Array.isArray(res[0])&&!Array.isArray(res[1])){
      document.getElementById('list').innerHTML='<div class="warn">'+esc((res[0]&&res[0].error)||(res[1]&&res[1].error)||'Could not load')+'</div>';return;
    }
    var rows=legacy.map(function(r){r.kind='legacy';return r;}).concat(scoped.map(function(r){r.kind='scope';return r;}));
    rows.sort(function(a,b){return String(b.signed_ts||'').localeCompare(String(a.signed_ts||''));});
    document.getElementById('count').textContent=rows.length+' total';
    if(!rows.length){document.getElementById('list').innerHTML='<p class="muted" style="padding:20px 0">No signed proposals yet. When a customer signs a proposal, it appears here.</p>';return;}
    var html='';
    rows.forEach(function(r){
      var booked=(r.status==='Booked')||r.qb_invoice_id;
      var billMissing=!!r.bill_missing; // scope kind only — worker.js flags: invoiced, no bill, one was expected
      var subLine=r.kind==='scope' ? (r.title||('Scope #'+r.scope_id)) : (r.option_label||('Option '+r.option));
      var invLabel=r.kind==='scope' ? 'Invoice owner (deposit)' : 'Invoice owner (1st pmt)';
      var invAmt=r.kind==='scope' ? r.deposit : r.first_payment;
      var billLabel=r.kind==='scope' ? 'Bill vendor (deposit share)' : 'Bill vendor (base)';
      var billAmt=r.kind==='scope' ? r.vendor_cost_total : r.vendor_cost;
      var chipClass = billMissing ? 'billmiss' : (booked ? 'booked' : 'signed');
      var chipText = billMissing ? '⚠ Invoiced — no bill' : (booked ? '✓ Booked' : 'Signed — needs billing');
      html+='<div class="card"><div class="row">'
        +'<div><div class="name">'+esc(r.signer||'—')+'</div>'
        +'<div class="sub">'+esc(r.property||r.proposal_id)+' · '+esc(subLine)+'</div>'
        +'<div class="sub">Signed '+esc(r.signed_date||'')+'</div></div>'
        +'<span class="chip '+chipClass+'">'+chipText+'</span>'
        +'</div>'
        +'<div class="row" style="margin-top:10px">'
        +'<div class="amt"><div class="lbl">'+invLabel+'</div><div class="big">'+money(invAmt)+'</div></div>'
        +'<div class="amt"><div class="lbl">'+billLabel+'</div><div class="big">'+money(billAmt)+'</div>'
        +(r.kind==='scope'&&r.vendor_cost_full>billAmt?'<div class="sub">of '+money(r.vendor_cost_full)+' job cost</div>':'')
        +'</div>'
        +'</div>';
      if(billMissing){
        html+='<div class="warn">⚠ Invoice was created, but no vendor bill exists — '+esc(skipReasonText(r.bill_skip_reason))+'. Fix the vendor/cost on this scope, then retry.</div>'
          +'<div style="margin-top:12px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\')">Retry — create vendor bill</button></div>';
      } else if(booked){
        html+='<div class="booked">✓ QuickBooks: invoice'+(r.qb_invoice_number?(' #'+esc(r.qb_invoice_number)):'')+(r.qb_bill_number?(' · bill #'+esc(r.qb_bill_number)):'')+' created.'
          +((r.kind==='scope'&&!r.qb_bill_number&&r.bill_skip_reason==='in_house')?' <span class="muted">(no vendor bill — vendor is in-house)</span>':'')
          +'</div>';
      } else {
        html+='<div style="margin-top:12px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\')">Preview &amp; create invoice + bill</button></div>';
      }
      html+='</div>';
    });
    document.getElementById('list').innerHTML=html;
  }).catch(function(e){document.getElementById('list').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}

function bookPath(kind){return kind==='scope' ? '/scope-proposal/book' : '/proposal/book';}

function preview(id,kind){
  cur={id:id,kind:kind};
  document.getElementById('m-title').textContent='Preview — create in QuickBooks';
  document.getElementById('m-body').innerHTML='<p class="muted"><span class="spin"></span> Building preview…</p>';
  document.getElementById('m-confirm').classList.add('hide');
  document.getElementById('modal').classList.add('open');
  api('POST',bookPath(kind),{id:id,preview_only:true}).then(function(r){
    if(!r||!r.ok||!r.preview){document.getElementById('m-body').innerHTML='<div class="warn">'+esc((r&&r.error)||'Could not build preview')+'</div>';return;}
    var p=r.preview,h='';
    var subhead=esc(p.property)+' · '+esc(p.signer)+(p.option?(' · Option '+esc(p.option)):'');
    h+='<div class="sub" style="margin-bottom:8px">'+subhead+'</div>';
    h+='<div class="line"><span>Invoice → '+esc(p.invoice.customer)+' <span class="muted">('+esc(p.invoice.level)+')</span><br><span class="muted" style="font-size:12px">'+esc(p.invoice.desc)+'</span></span><span>'+money(p.invoice.amount)+'</span></div>';
    if(p.bill){h+='<div class="line"><span>Vendor bill → '+esc(p.bill.vendor)+' <span class="muted">('+esc(p.bill.trade)+')</span></span><span>'+money(p.bill.amount)+'</span></div>';}
    else {h+='<div class="line muted"><span>No vendor bill</span><span>—</span></div>';}
    if(p.already&&(p.already.invoice||p.already.bill)){h+='<div class="warn">Already partly booked (invoice '+esc(p.already.invoice||'—')+', bill '+esc(p.already.bill||'—')+'). Confirm will only create what is missing.</div>';}
    if(p.warnings&&p.warnings.length){h+='<div class="warn">⚠ '+p.warnings.map(esc).join('<br>⚠ ')+'</div>';}
    document.getElementById('m-body').innerHTML=h;
    var b=document.getElementById('m-confirm');b.classList.remove('hide');b.textContent='Confirm — create in QuickBooks';b.disabled=false;
  }).catch(function(e){document.getElementById('m-body').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}

function confirmBook(btn){
  if(!cur)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating…';
  api('POST',bookPath(cur.kind),{id:cur.id}).then(function(r){
    if(r&&r.ok){
      var msg='Created'+(r.invoice_number?(' invoice #'+r.invoice_number):' invoice')+(r.bill_number?(' + bill #'+r.bill_number):(r.bill_id?' + bill':''));
      document.getElementById('m-body').innerHTML='<p style="font-weight:700;color:var(--green)">✓ '+esc(msg)+'</p>'+((r.warnings&&r.warnings.length)?('<div class="warn">⚠ '+r.warnings.map(esc).join('<br>⚠ ')+'</div>'):'');
      btn.classList.add('hide');toast('Booked in QuickBooks');load();
    } else {
      btn.disabled=false;btn.textContent='Confirm — create in QuickBooks';
      document.getElementById('m-body').innerHTML+='<div class="warn">⚠ '+esc((r&&r.error)||'Failed')+'</div>';
    }
  }).catch(function(e){btn.disabled=false;btn.textContent='Confirm — create in QuickBooks';toast('Error: '+e.message);});
}
function closeModal(){document.getElementById('modal').classList.remove('open');cur=null;}

(function(){var s=localStorage.getItem(SECRET_KEY);if(s){AUTH_TOKEN=s;api('GET','/proposal/signatures').then(enterApp).catch(function(){AUTH_TOKEN='';});}})();
</script>
</body>
</html>
