<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridge Co — Signed Proposals</title>
<style>
  :root{--bg:#e9ebef;--card:#fff;--ink:#0e1621;--muted:#5b6672;--line:#d8dce2;
    --green:#1a8f4c;--greenbg:#e6f4ec;--amber:#b26a00;--amberbg:#fbf0dd;
    --red:#c0242b;--redbg:#f9e4e4;--blue:#1d4ed8;--bluebg:#e7effb;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:60px}
  .wrap{max-width:640px;margin:0 auto;padding:0 12px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
  .title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .title small{font-weight:600;color:var(--muted);font-size:12px;margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(16,23,32,.06)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-size:15px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .chip{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .chip.signed{background:var(--amberbg);color:var(--amber)}
  .chip.booked{background:var(--greenbg);color:var(--green)}
  .amt{margin-left:auto;text-align:right}
  .amt .big{font-size:17px;font-weight:800}
  .amt .lbl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .booked{font-size:12.5px;color:var(--green);font-weight:700;margin-top:8px}
  .muted{color:var(--muted)}
  .warn{background:var(--amberbg);color:#5c3d00;border:1px solid #ecd6a6;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
  /* Hard stop: the customer was invoiced and the vendor never got billed. Deliberately red and
     deliberately louder than .warn — this one costs real money if it's scrolled past. */
  .warn.hard{background:var(--redbg);color:#7a1418;border-color:#eec0c0}
  .chip.gap{background:var(--redbg);color:var(--red)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #ccd;border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  #login{max-width:340px;margin:60px auto;text-align:center}
  #login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:16px;margin:10px 0}
  .modal{display:none;position:fixed;inset:0;background:rgba(14,22,33,.5);z-index:50;padding:14px}
  .modal.open{display:block}
  .box{max-width:520px;margin:24px auto;background:#fff;border-radius:14px;padding:16px}
  .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-top:8px;padding-top:8px;border-top:2px solid var(--ink)}
  .hide{display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0e1621;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="login">
  <div class="title" style="justify-content:center;margin-bottom:6px">🧾 Signed Proposals</div>
  <p class="muted" style="font-size:13px">Enter your Hub access code.</p>
  <input id="login-input" type="password" placeholder="Access code" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn primary" style="width:100%" onclick="doLogin()">Enter</button>
  <p id="login-error" class="hide" style="color:var(--red);font-size:13px">Wrong code — try again.</p>
</div>

<div id="app" class="hide">
  <header><div class="wrap"><div class="title">🧾 Signed Proposals <small id="count"></small></div></div></header>
  <div class="wrap" id="list"><p class="muted" style="padding:20px 0"><span class="spin"></span> Loading…</p></div>
</div>

<div class="modal" id="modal"><div class="box">
  <div class="title" id="m-title" style="margin-bottom:6px">Preview</div>
  <div id="m-body"><p class="muted"><span class="spin"></span> Building preview…</p></div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="flex:1" id="m-cancel" onclick="closeModal()">Cancel</button>
    <button class="btn primary hide" style="flex:1" id="m-confirm" onclick="confirmModalAction(this)">Confirm</button>
  </div>
  <!-- Only shown once confirmBook() actually succeeds — see confirmBook(). Deletes the just-created
       QB invoice/bill and clears their ids off the row; gated by a confirm() dialog, and by
       qbDeleteInvoiceSafe/qbDeleteBillSafe refusing anything with a payment already on it. -->
  <button class="btn hide" style="width:100%;margin-top:8px;color:var(--red);border-color:#eec0c0" id="m-undo" onclick="undoBook(null,null,null,this)">Undo — delete this invoice &amp; bill</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
var WORKER='https://maintenance-hub.brett-2f8.workers.dev';
var SECRET_KEY='mh_auth';
var AUTH_TOKEN='';
var cur=null;
var curMs=null; // {sigId, ids} — the milestone-billing counterpart to `cur` (legacy book/book-final)
var modalMode='book'; // 'book' | 'milestones' — which confirm handler the shared modal dispatches to
var msSelections={}; // sigId -> array of currently-checked milestone ids

function api(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json','X-Auth-Token':AUTH_TOKEN}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(WORKER+path,opts).then(function(res){return res.json().then(function(d){if(d.error==='Unauthorized')throw new Error('Unauthorized');return d;});});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}

function doLogin(){
  var v=document.getElementById('login-input').value.trim();AUTH_TOKEN=v;
  api('GET','/proposal/signatures').then(function(){localStorage.setItem(SECRET_KEY,v);enterApp();})
    .catch(function(){AUTH_TOKEN='';document.getElementById('login-error').classList.remove('hide');});
}
function enterApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load();}

// Two separate signed-proposal systems feed this one screen: the older per-property B-076
// registry (/proposal/signatures + /proposal/book) and the newer generic scope e-sign system
// (/scope-proposal/signed + /scope-proposal/book, Aug 19/21 2026). Same review/preview/confirm
// UX either way — each row just remembers which API pair (`kind`) it books through.
// Ridge Co materials budget vs actual (Sep 22 2026). r.materials comes from the Worker
// (scopeMaterialsBudgetSummary): budget = Ridge Co's own cost priced into the signed proposal;
// actual = receipts matched to this job's work order. Those receipts are already billed through
// the proposal, so Review Bills won't invoice them again — this is where they stay visible.
function materialsHtml(r){
  var m=r&&r.materials; if(!m) return '';
  if(m.state==='unknown'&&!(m.budget_cost>0)) return '';
  if(m.state==='unknown') return '<div class="sub" style="margin-top:8px">Ridge Co materials: budget '+money(m.budget_cost)+' · couldn\'t load receipts to compare.</div>';
  if(m.state==='none') return '';
  var head='<div style="margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;font-size:12.5px;line-height:1.5">'
    +'<div style="font-weight:700;margin-bottom:2px">Ridge Co materials</div>';
  var body;
  {
    var line='Budget '+money(m.budget_cost)+' (owner pays '+money(m.budget_price)+', in the milestones) · Receipts '+money(m.actual)+' ('+m.receipt_count+')';
    var tag='';
    if(m.state==='not_bought') tag='<span class="chip signed" style="margin-left:6px">not bought yet</span>';
    else if(m.state==='over') tag='<span class="chip gap" style="margin-left:6px">over by '+money(-m.variance)+'</span>';
    else tag='<span class="chip booked" style="margin-left:6px">'+money(m.variance)+' left</span>';
    body='<div>'+line+tag+'</div>';
    body+='<div class="sub" style="margin-top:2px">Receipts on this job are already covered by the milestones, so Review Bills won\'t invoice them again.</div>';
    if(m.state==='over') body+='<div class="sub" style="margin-top:2px">The overage is <b>not</b> billed to the owner. If they owe it, bill it manually in QuickBooks.</div>';
  }
  return head+body+'</div>';
}
function load(){
  Promise.all([
    api('GET','/proposal/signatures').catch(function(e){return {error:e.message};}),
    api('GET','/scope-proposal/signed').catch(function(e){return {error:e.message};})
  ]).then(function(res){
    var legacy=Array.isArray(res[0])?res[0]:[];
    var scoped=Array.isArray(res[1])?res[1]:[];
    if(!Array.isArray(res[0])&&!Array.isArray(res[1])){
      document.getElementById('list').innerHTML='<div class="warn">'+esc((res[0]&&res[0].error)||(res[1]&&res[1].error)||'Could not load')+'</div>';return;
    }
    var rows=legacy.map(function(r){r.kind='legacy';return r;}).concat(scoped.map(function(r){r.kind='scope';return r;}));
    rows.sort(function(a,b){return String(b.signed_ts||'').localeCompare(String(a.signed_ts||''));});
    document.getElementById('count').textContent=rows.length+' total';
    if(!rows.length){document.getElementById('list').innerHTML='<p class="muted" style="padding:20px 0">No signed proposals yet. When a customer signs a proposal, it appears here.</p>';return;}
    var html='';
    rows.forEach(function(r){
      var booked=(r.status==='Booked')||r.qb_invoice_id;
      var subLine=r.kind==='scope' ? (r.title||('Scope #'+r.scope_id)) : (r.option_label||('Option '+r.option));
      var invLabel=r.kind==='scope' ? 'Invoice owner (deposit)' : 'Invoice owner (1st pmt)';
      var invAmt=r.kind==='scope' ? r.deposit : r.first_payment;
      var billLabel=r.kind==='scope' ? 'Bill vendor (deposit share)' : 'Bill vendor (base)';
      // A scope books a PRORATED share of vendor cost (Vendor_Cost_Total x deposit/subtotal),
      // never the vendor's full job cost. This line said "deposit share" while showing the full
      // cost — a $650 job read as a $650 deposit bill when the real one was $325.
      // vendor_bill_amount is the Worker's own figure (exactly what /scope-proposal/book creates);
      // the ratio is only recomputed here if an older Worker hasn't sent it yet, so this can
      // never fall back to showing the full cost again.
      var billAmt;
      if(r.kind!=='scope'){billAmt=r.vendor_cost;}
      else if(r.vendor_bill_amount!=null){billAmt=r.vendor_bill_amount;}
      else{var _r=(Number(r.subtotal)>0)?(Number(r.deposit)/Number(r.subtotal)):0.5;billAmt=(Number(r.vendor_cost_total)||0)*_r;}
      // 'missing' = invoiced but no vendor bill, and there should be one. 'in_house' = no bill by
      // policy (Ridge Co never bills itself for its own hours) and must stay calm, or the real
      // alarm gets trained away.
      var gap=(r.kind==='scope')?(r.bill_gap||''):'';
      // Milestone billing (Sep 14 2026): any 'scope' row signed under the new payment-schedule
      // system carries r.milestones — renders as a checklist + "bill selected" instead of the
      // old fixed deposit/final block below. A row signed before this shipped has no milestones
      // and falls through to the untouched legacy rendering.
      if(r.kind==='scope' && r.milestones && r.milestones.length){
        var msDone=r.milestones.filter(function(m){return m.status==='billed';}).length;
        var msAllDone=msDone===r.milestones.length;
        html+='<div class="card"><div class="row">'
          +'<div><div class="name">'+esc(r.signer||'—')+'</div>'
          +'<div class="sub">'+esc(r.property||r.proposal_id)+' · '+esc(subLine)+'</div>'
          +'<div class="sub">Signed '+esc(r.signed_date||'')+'</div></div>'
          +'<span class="chip '+(msAllDone?'booked':(msDone>0?'booked':'signed'))+'">'+(msAllDone?'✓ Fully billed':(msDone>0?('✓ '+msDone+'/'+r.milestones.length+' billed'):'Signed — needs billing'))+'</span>'
          +'</div>';
        html+='<div style="margin-top:10px">';
        r.milestones.forEach(function(m){
          var billed=m.status==='billed';
          // CAP-036 #14: "Invoiced — Pending Info" also covers Scope Proposal / milestone
          // billing (Brett confirmed this explicitly). A pending milestone can be flagged
          // here — soft-blocks billing it (see confirmMilestoneBill's pending_info branch)
          // until cleared or deliberately overridden.
          var flagged=!!m.pending_info;
          html+='<label class="row" style="gap:8px;padding:6px 0;border-bottom:1px dotted var(--line);'+(billed?'opacity:.6':'')+'">'
            +'<input type="checkbox"'+(billed?' disabled':(' onchange="toggleMilestone(\''+esc(r.id)+'\',\''+esc(m.id)+'\',this.checked)"'))+'>'
            +'<span style="flex:1">'+esc(m.label)+' <span class="muted">('+m.percent+'%'+(m.trigger==='upfront'?' · upfront':m.trigger==='completion'?' · completion':'')+')</span></span>'
            +'<span>'+money(m.customer_amount)+'</span>'
            +'<span class="chip '+(billed?'booked':(flagged?'gap':'signed'))+'" style="margin-left:2px">'+(billed?('billed'+(m.qb_invoice_number?(' #'+esc(m.qb_invoice_number)):'')):(flagged?'⏳ pending info':'pending'))+'</span>'
            +(!billed?('<a href="#" onclick="toggleMilestonePendingInfo(\''+esc(r.id)+'\',\''+esc(m.id)+'\','+(flagged?'true':'false')+');return false;" style="color:'+(flagged?'var(--red)':'var(--blue)')+';font-size:11px;font-weight:700;text-decoration:none;margin-left:6px">'+(flagged?'Clear':'Flag')+'</a>'):'')
            +'</label>'
            +(flagged?('<div class="sub" style="margin:-2px 0 6px 24px">⏳ '+esc(m.pending_info_note||'Needs info before billing.')+'</div>'):'');
        });
        html+='</div>';
        html+=materialsHtml(r);
        if(!msAllDone) html+='<div style="margin-top:12px"><button class="btn primary" id="msbtn-'+esc(r.id)+'" disabled onclick="previewMilestoneBill(\''+esc(r.id)+'\')">Bill selected (0)</button></div>';
        html+='</div>';
        return; // skip the legacy deposit/final rendering entirely for milestone rows
      }
      html+='<div class="card"><div class="row">'
        +'<div><div class="name">'+esc(r.signer||'—')+'</div>'
        +'<div class="sub">'+esc(r.property||r.proposal_id)+' · '+esc(subLine)+'</div>'
        +'<div class="sub">Signed '+esc(r.signed_date||'')+'</div></div>'
        +'<span class="chip '+(booked?(gap==='missing'?'gap':'booked'):'signed')+'">'+(booked?(gap==='missing'?'⚠ Invoiced — no bill':'✓ Booked'):'Signed — needs billing')+'</span>'
        +'</div>'
        +'<div class="row" style="margin-top:10px">'
        +'<div class="amt"><div class="lbl">'+invLabel+'</div><div class="big">'+money(invAmt)+'</div></div>'
        +'<div class="amt"><div class="lbl">'+billLabel+'</div><div class="big">'+money(billAmt)+'</div></div>'
        +'</div>';
      if(r.kind==='scope') html+=materialsHtml(r);
      if(booked){
        html+='<div class="booked">✓ QuickBooks: invoice'+(r.qb_invoice_number?(' #'+esc(r.qb_invoice_number)):'')+(r.qb_bill_number?(' · bill #'+esc(r.qb_bill_number)):'')+' created. '
          +'<a href="#" onclick="undoBook(\''+esc(r.id)+'\',\''+r.kind+'\',\'\',this);return false;" style="color:var(--red);font-weight:700;text-decoration:none">Undo</a>'
          +(r.kind==='scope'&&r.qb_bill_id?' · <a href="#" onclick="adjustBill(\''+esc(r.id)+'\',\'deposit\');return false;" style="color:var(--blue);font-weight:700;text-decoration:none">Adjust vendor bill</a>':'')
          +'</div>';
        if(gap==='missing'){
          // Persistent, not a one-time toast: the reason is stored on the row, so this banner
          // survives a reload and stays until a bill actually exists. Retry re-runs the same
          // idempotent book call, which skips the existing invoice and only creates the bill.
          // Deliberately NOT a hard block on the final-balance step below (Brett's decision:
          // a missing vendor bill is a hard stop to look at, not a hard block on anything else).
          html+='<div class="warn hard"><strong>⚠ Invoiced — no bill.</strong> The customer was invoiced but the vendor was never billed.'
            +(r.bill_skip_reason?('<br>'+esc(r.bill_skip_reason)):'')+'</div>'
            +'<div style="margin-top:10px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\')">Retry vendor bill</button></div>';
        } else if(gap==='in_house'){
          html+='<div class="sub" style="margin-top:6px">No vendor bill — in-house work. Expected: Ridge Co doesn\'t create a payable for its own hours.</div>';
        }
        // Final-balance booking only exists for the new scope e-sign system (Sep 2 2026) — the
        // deposit was already booked above; this is the "vendor finished, now invoice the rest" step.
        if(r.kind==='scope'){
          if(r.qb_final_invoice_id){
            html+='<div class="booked">✓ Final balance: invoice'+(r.qb_final_invoice_number?(' #'+esc(r.qb_final_invoice_number)):'')+(r.qb_final_bill_number?(' · bill #'+esc(r.qb_final_bill_number)):'')+' created. '
              +'<a href="#" onclick="undoBook(\''+esc(r.id)+'\',\''+r.kind+'\',\'final\',this);return false;" style="color:var(--red);font-weight:700;text-decoration:none">Undo</a>'
              +(r.qb_final_bill_id?' · <a href="#" onclick="adjustBill(\''+esc(r.id)+'\',\'final\');return false;" style="color:var(--blue);font-weight:700;text-decoration:none">Adjust vendor bill</a>':'')
              +'</div>';
            // Same hard-stop banner as the deposit half, above, but for the FINAL vendor bill —
            // added Sep 18 2026. This page had no way to show a missing FINAL bill until now,
            // exactly the gap that hid 1305 N Calvert St's.
            if(r.final_bill_gap==='missing'){
              html+='<div class="warn hard"><strong>⚠ Final balance invoiced — no bill.</strong> The customer was invoiced the final balance but the vendor was never billed.'
                +(r.final_bill_skip_reason?('<br>'+esc(r.final_bill_skip_reason)):'')+'</div>'
                +'<div style="margin-top:10px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\',\'final\')">Retry vendor bill</button></div>';
            } else if(r.final_bill_gap==='in_house'){
              html+='<div class="sub" style="margin-top:6px">No vendor bill on the final balance — in-house work.</div>';
            }
          } else {
            html+='<div style="margin-top:12px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\',\'final\')">Job done — invoice final balance</button></div>';
          }
        }
      } else {
        html+='<div style="margin-top:12px"><button class="btn primary" onclick="preview(\''+esc(r.id)+'\',\''+r.kind+'\')">Preview &amp; create invoice + bill</button></div>';
      }
      html+='</div>';
    });
    document.getElementById('list').innerHTML=html;
  }).catch(function(e){document.getElementById('list').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}

function bookPath(kind,phase){return kind==='scope' ? (phase==='final' ? '/scope-proposal/book-final' : '/scope-proposal/book') : '/proposal/book';}
function undoPath(kind,phase){return kind==='scope' ? (phase==='final' ? '/scope-proposal/unbook-final' : '/scope-proposal/unbook') : '/proposal/unbook';}

// Undo a booking that already succeeded — deletes the QB invoice + bill and reverts the row.
// Called two ways: from the modal right after Confirm (id/kind/phase left null, falls back to
// `cur`), or from a persistent "Undo" link on an already-booked row in the list (id/kind/phase
// passed explicitly, since the modal may be long closed by then). `el` is whatever was clicked
// (button or link) so it can show its own "Undoing…" state without assuming which one it is.
function undoBook(id,kind,phase,el){
  id = id || (cur && cur.id); kind = kind || (cur && cur.kind); phase = (phase != null ? phase : (cur && cur.phase)) || '';
  if(!id||!kind)return;
  var label = phase==='final' ? 'the final-balance invoice and bill' : 'the deposit invoice and bill';
  if(!confirm('Are you sure you want to undo these bills and invoices?\n\nThis deletes '+label+' in QuickBooks. It only works if nothing has been paid against them yet, and it cannot be undone.'))return;
  var origText = el ? el.textContent : '';
  if(el){el.style.pointerEvents='none';el.style.opacity='.55';el.textContent='Undoing…';}
  api('POST',undoPath(kind,phase),{id:id}).then(function(r){
    if(r&&r.ok){toast('Undone — invoice and bill deleted in QuickBooks');closeModal();load();}
    else{toast('Could not undo: '+((r&&r.error)||'unknown error'));if(el){el.style.pointerEvents='';el.style.opacity='';el.textContent=origText;}}
  }).catch(function(e){toast('Error: '+e.message);if(el){el.style.pointerEvents='';el.style.opacity='';el.textContent=origText;}});
}

function preview(id,kind,phase){
  cur={id:id,kind:kind,phase:phase||''};
  modalMode='book';
  document.getElementById('m-title').textContent=phase==='final' ? 'Preview — final balance in QuickBooks' : 'Preview — create in QuickBooks';
  document.getElementById('m-body').innerHTML='<p class="muted"><span class="spin"></span> Building preview…</p>';
  document.getElementById('m-confirm').classList.add('hide');
  // Reset the Cancel/Undo pair back to their pre-confirm state — this modal element is reused
  // across every open, so a previous booking's "Close" + revealed Undo must not leak into a
  // fresh preview for a different row.
  var mc=document.getElementById('m-cancel');mc.textContent='Cancel';mc.classList.remove('hide');
  var mu=document.getElementById('m-undo');mu.classList.add('hide');mu.style.pointerEvents='';mu.style.opacity='';mu.textContent='Undo — delete this invoice & bill';
  document.getElementById('modal').classList.add('open');
  api('POST',bookPath(kind,phase),{id:id,preview_only:true}).then(function(r){
    if(!r||!r.ok||!r.preview){document.getElementById('m-body').innerHTML='<div class="warn">'+esc((r&&r.error)||'Could not build preview')+'</div>';return;}
    var p=r.preview,h='';
    var subhead=esc(p.property)+' · '+esc(p.signer)+(p.option?(' · Option '+esc(p.option)):'');
    h+='<div class="sub" style="margin-bottom:8px">'+subhead+'</div>';
    h+='<div class="line"><span>Invoice → '+esc(p.invoice.customer)+' <span class="muted">('+esc(p.invoice.level)+')</span><br><span class="muted" style="font-size:12px">'+esc(p.invoice.desc)+'</span></span><span>'+money(p.invoice.amount)+'</span></div>';
    if(p.bill){h+='<div class="line"><span>Vendor bill → '+esc(p.bill.vendor)+' <span class="muted">('+esc(p.bill.trade)+')</span></span><span>'+money(p.bill.amount)+'</span></div>';}
    else {h+='<div class="line muted"><span>No vendor bill</span><span>—</span></div>';}
    if(p.already&&(p.already.invoice||p.already.bill)){h+='<div class="warn">Already partly booked (invoice '+esc(p.already.invoice||'—')+', bill '+esc(p.already.bill||'—')+'). Confirm will only create what is missing.</div>';}
    if(p.warnings&&p.warnings.length){h+='<div class="warn">⚠ '+p.warnings.map(esc).join('<br>⚠ ')+'</div>';}
    document.getElementById('m-body').innerHTML=h;
    var b=document.getElementById('m-confirm');b.classList.remove('hide');b.textContent=phase==='final' ? 'Confirm — invoice final balance' : 'Confirm — create in QuickBooks';b.disabled=false;
  }).catch(function(e){document.getElementById('m-body').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}

function confirmBook(btn){
  if(!cur)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating…';
  api('POST',bookPath(cur.kind,cur.phase),{id:cur.id}).then(function(r){
    if(r&&r.ok){
      var msg='Created'+(r.invoice_number?(' invoice #'+r.invoice_number):' invoice')+(r.bill_number?(' + bill #'+r.bill_number):(r.bill_id?' + bill':''));
      document.getElementById('m-body').innerHTML='<p style="font-weight:700;color:var(--green)">✓ '+esc(msg)+'</p>'+((r.warnings&&r.warnings.length)?('<div class="warn">⚠ '+r.warnings.map(esc).join('<br>⚠ ')+'</div>'):'');
      btn.classList.add('hide');
      // Nothing left to "Cancel" — it already happened. Relabel to Close and reveal Undo instead
      // of leaving a button that reads "Cancel" next to something that already says "✓ Created".
      document.getElementById('m-cancel').textContent='Close';
      document.getElementById('m-undo').classList.remove('hide');
      toast('Booked in QuickBooks');load();
    } else {
      btn.disabled=false;btn.textContent='Confirm — create in QuickBooks';
      document.getElementById('m-body').innerHTML+='<div class="warn">⚠ '+esc((r&&r.error)||'Failed')+'</div>';
    }
  }).catch(function(e){btn.disabled=false;btn.textContent='Confirm — create in QuickBooks';toast('Error: '+e.message);});
}
function closeModal(){document.getElementById('modal').classList.remove('open');cur=null;curMs=null;curAdjust=null;}
function confirmModalAction(btn){ if(modalMode==='milestones') confirmMilestoneBill(btn); else if(modalMode==='adjust') confirmAdjust(btn); else confirmBook(btn); }

// ── Vendor-bill adjustment (Sep 18 2026) ────────────────────────────────────
// One-off dollar correction to an already-booked deposit or final vendor bill — built for the
// case that surfaced 1305 N Calvert St's missing-final-bill gap: a vendor asks for more than the
// original share mid-job (unforeseen complexity), Brett decides to eat it rather than re-billing
// the customer, and this lets him apply that straight from the row instead of going around the
// Hub by hand in QuickBooks. Never touches the customer invoice — worker.js's
// scopeProposalAdjustBill only ever edits the vendor's own Bill.
var curAdjust=null;
function adjustBill(id,phase){
  var amtStr=prompt('Adjust the '+phase+' vendor bill by how much?\n\nA positive number raises what\'s owed (e.g. 500 to absorb a vendor cost increase). A negative number lowers it (e.g. -200).');
  if(amtStr===null)return;
  var amount=parseFloat(amtStr);
  if(!amount||isNaN(amount)){toast('Enter a non-zero number');return;}
  var reason=prompt('One line for the QuickBooks bill — why this changed:');
  if(reason===null||!reason.trim()){toast('A reason is required');return;}
  reason=reason.trim();
  curAdjust={id:id,phase:phase,amount:amount,reason:reason};
  modalMode='adjust';
  document.getElementById('m-title').textContent='Preview — adjust vendor bill';
  document.getElementById('m-body').innerHTML='<p class="muted"><span class="spin"></span> Building preview…</p>';
  document.getElementById('m-confirm').classList.add('hide');
  var mc=document.getElementById('m-cancel');mc.textContent='Cancel';mc.classList.remove('hide');
  var mu=document.getElementById('m-undo');mu.classList.add('hide');
  document.getElementById('modal').classList.add('open');
  api('POST','/scope-proposal/adjust-bill',{id:id,phase:phase,amount:amount,reason:reason,preview_only:true}).then(function(r){
    if(!r||!r.ok||!r.preview){document.getElementById('m-body').innerHTML='<div class="warn">'+esc((r&&r.error)||'Could not build preview')+'</div>';return;}
    var p=r.preview,h='';
    h+='<div class="line"><span>Current bill total</span><span>'+money(p.current_total)+'</span></div>';
    h+='<div class="line"><span>Current balance owed</span><span>'+money(p.current_balance)+'</span></div>';
    h+='<div class="line"><span>Adjustment</span><span>'+(p.adjustment>=0?'+':'')+money(p.adjustment)+'</span></div>';
    h+='<div class="total"><span>New balance owed</span><span>'+money(p.new_balance)+'</span></div>';
    h+='<div class="sub" style="margin-top:8px">New bill total: '+money(p.new_total)+'<br>Reason: '+esc(p.reason)+'</div>';
    document.getElementById('m-body').innerHTML=h;
    var b=document.getElementById('m-confirm');b.classList.remove('hide');b.textContent='Confirm — adjust in QuickBooks';b.disabled=false;
  }).catch(function(e){document.getElementById('m-body').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}
function confirmAdjust(btn){
  if(!curAdjust)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Applying…';
  api('POST','/scope-proposal/adjust-bill',{id:curAdjust.id,phase:curAdjust.phase,amount:curAdjust.amount,reason:curAdjust.reason}).then(function(r){
    if(r&&r.ok){
      document.getElementById('m-body').innerHTML='<p style="font-weight:700;color:var(--green)">✓ Bill updated — new balance '+money(r.new_balance)+'</p>';
      btn.classList.add('hide');
      document.getElementById('m-cancel').textContent='Close';
      toast('Vendor bill adjusted in QuickBooks');curAdjust=null;load();
    } else {
      btn.disabled=false;btn.textContent='Confirm — adjust in QuickBooks';
      document.getElementById('m-body').innerHTML+='<div class="warn">⚠ '+esc((r&&r.error)||'Failed')+'</div>';
    }
  }).catch(function(e){btn.disabled=false;btn.textContent='Confirm — adjust in QuickBooks';toast('Error: '+e.message);});
}

// ── Milestone billing (Sep 14 2026) ─────────────────────────────────────────
function toggleMilestone(sigId,msId,checked){
  msSelections[sigId]=msSelections[sigId]||[];
  var idx=msSelections[sigId].indexOf(msId);
  if(checked && idx===-1) msSelections[sigId].push(msId);
  if(!checked && idx!==-1) msSelections[sigId].splice(idx,1);
  var btn=document.getElementById('msbtn-'+sigId);
  if(btn){ var n=msSelections[sigId].length; btn.disabled=(n===0); btn.textContent='Bill selected ('+n+')'; }
}
function previewMilestoneBill(sigId){
  var ids=msSelections[sigId]||[];
  if(!ids.length) return;
  curMs={sigId:sigId,ids:ids}; modalMode='milestones';
  document.getElementById('m-title').textContent='Preview — bill selected milestone(s)';
  document.getElementById('m-body').innerHTML='<p class="muted"><span class="spin"></span> Building preview…</p>';
  document.getElementById('m-confirm').classList.add('hide');
  var mc=document.getElementById('m-cancel');mc.textContent='Cancel';mc.classList.remove('hide');
  var mu=document.getElementById('m-undo');mu.classList.add('hide');mu.style.pointerEvents='';mu.style.opacity='';mu.textContent='Undo — delete this invoice & bill';
  document.getElementById('modal').classList.add('open');
  api('POST','/scope-proposal/bill-milestones',{signature_id:sigId,milestone_ids:ids,preview_only:true}).then(function(r){
    if(!r||!r.ok||!r.preview){document.getElementById('m-body').innerHTML='<div class="warn">'+esc((r&&r.error)||'Could not build preview')+'</div>';return;}
    var p=r.preview,h='';
    h+='<div class="sub" style="margin-bottom:8px">'+esc(p.property)+' · '+esc(p.signer)+'</div>';
    (p.milestones||[]).forEach(function(m){h+='<div class="line"><span>'+esc(m.label)+' ('+m.percent+'%)</span><span>'+money(m.customer_amount)+'</span></div>';});
    h+='<div class="line" style="font-weight:700"><span>Invoice → '+esc(p.invoice.customer)+' <span class="muted">('+esc(p.invoice.level)+')</span></span><span>'+money(p.invoice.amount)+'</span></div>';
    if(p.bill){h+='<div class="line"><span>Vendor bill → '+esc(p.bill.vendor)+' <span class="muted">('+esc(p.bill.trade)+')</span></span><span>'+money(p.bill.amount)+'</span></div>';}
    else {h+='<div class="line muted"><span>No vendor bill</span><span>—</span></div>';}
    if(p.warnings&&p.warnings.length){h+='<div class="warn">⚠ '+p.warnings.map(esc).join('<br>⚠ ')+'</div>';}
    document.getElementById('m-body').innerHTML=h;
    var b=document.getElementById('m-confirm');b.classList.remove('hide');b.textContent='Confirm — bill in QuickBooks';b.disabled=false;
  }).catch(function(e){document.getElementById('m-body').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
}
function confirmMilestoneBill(btn){
  if(!curMs)return;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Creating…';
  api('POST','/scope-proposal/bill-milestones',{signature_id:curMs.sigId,milestone_ids:curMs.ids}).then(function(r){
    if(r&&r.ok){
      var msg='Billed'+(r.invoice_number?(' invoice #'+r.invoice_number):' invoice')+(r.bill_number?(' + bill #'+r.bill_number):(r.bill_id?' + bill':''));
      document.getElementById('m-body').innerHTML='<p style="font-weight:700;color:var(--green)">✓ '+esc(msg)+'</p>'+((r.warnings&&r.warnings.length)?('<div class="warn">⚠ '+r.warnings.map(esc).join('<br>⚠ ')+'</div>'):'');
      btn.classList.add('hide');
      document.getElementById('m-cancel').textContent='Close';
      // No undo path yet for grouped milestone bills (unlike the legacy deposit/final flow) —
      // m-undo deliberately stays hidden here rather than wired to something that doesn't exist.
      toast('Billed in QuickBooks');
      if(curMs) msSelections[curMs.sigId]=[];
      load();
    } else {
      btn.disabled=false;btn.textContent='Confirm — bill in QuickBooks';
      document.getElementById('m-body').innerHTML+='<div class="warn">⚠ '+esc((r&&r.error)||'Failed')+'</div>';
    }
  }).catch(function(e){btn.disabled=false;btn.textContent='Confirm — bill in QuickBooks';toast('Error: '+e.message);});
}
